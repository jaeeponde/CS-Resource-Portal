 on practically relevant instances?<\/div><\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Career paths<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card\"><div class=\"card-label\">Research<\/div><h4>Theory Faculty<\/h4><p>The primary career path for PhD theorists. Requires strong publication record at STOC/FOCS/SODA level.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>Cryptography Engineer<\/h4><p>Designing and implementing cryptographic protocols. PhD or MS with strong crypto background.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>Quant Researcher<\/h4><p>Algorithmic trading firms hire theorists for their mathematical maturity. Very different work from academic CS.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>Quantum Researcher<\/h4><p>At IBM, Google Quantum AI, IonQ, and startups. Mostly research roles with long time horizons.<\/p><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"pull-quote\"><p>Theory has the highest mathematical floor of any CS sub-field. Comfort with proofs is not optional — it is the primary tool of the field.<\/p><\/div>\n  <\/div>\n  <div class=\"page-nav\"><button class=\"btn\" onclick=\"goTo(2)\">← Systems<\/button><span class=\"page-label\">Cluster 03 / 06<\/span><button class=\"btn primary\" onclick=\"goTo(4)\">Next: Human-Centred →<\/button><\/div>\n<\/div>\n\n<\!-- ===================== PAGE 4: HUMAN-CENTRED ===================== -->\n<div class=\"page\" id=\"page-4\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Cluster 04 — Human-Centred Computing<\/div>\n    <h1>Human-Centred<br><em>Computing<\/em><\/h1>\n    <p class=\"hero-lead\">The study of how people interact with technology — designing systems around human needs, studying social effects of computing, and ensuring technology is equitable and accountable.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\"><p>This cluster is distinct from the others in its research methods. Alongside programming and system building, HCI researchers conduct user studies, qualitative interviews, and design experiments.<\/p><\/div>\n    <div class=\"section-block\">\n      <h2>Broad degree vs specialised degree<\/h2>\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">MSCS (HCI track)<\/div><div class=\"data-val\">Lets you take HCI courses within a broader CS degree. Works well if you want HCI depth alongside technical CS depth — for example, building interactive ML systems or studying how developers use programming tools.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">MSHCI<\/div><div class=\"data-val\">A standalone degree in human-computer interaction. Curriculum is entirely focused on HCI — design, user research, evaluation methods, and prototyping. Less technical programming than MSCS. Available at CMU, Michigan, Georgia Tech, Indiana, and others.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">When to pick MSHCI<\/div><div class=\"data-val\">You are committed to UX research or design as a career and you are comfortable with a degree that includes qualitative research methods and design practice alongside technical content.<\/div><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Sub-fields<\/h2>\n      <div class=\"subfield-block specialised\"><div class=\"subfield-tag\">Specialised degree — MSHCI at CMU, Michigan, Georgia Tech<\/div><h4>Human-Computer Interaction<\/h4><p>Designing and evaluating interactive systems with human needs at the centre. Methods include usability studies, participatory design, rapid prototyping, and field research.<\/p><div class=\"example-problem\">How do you design a clinical decision support interface for emergency room physicians that reduces cognitive load during high-stress situations without adding friction to critical workflows?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — typically within MSCS or social science programmes<\/div><h4>Computational Social Science<\/h4><p>Using CS methods — network analysis, NLP, large-scale data processing — to answer questions about human social behaviour. Sits at the boundary of CS and social science.<\/p><div class=\"example-problem\">How do political communities on social media platforms respond to information that contradicts their existing beliefs — and does platform design amplify or attenuate this effect?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — spans CS, law, and social science<\/div><h4>Responsible AI / Ethics<\/h4><p>Studying the fairness, accountability, and transparency of algorithmic systems. Technical work includes bias measurement, fairness-aware ML, and explainability methods.<\/p><div class=\"example-problem\">How do you measure whether a recidivism prediction algorithm treats defendants from different demographic groups equitably?<\/div><\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Career paths<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>UX Researcher<\/h4><p>Conducting user studies and translating findings into product decisions. Primary destination for MSHCI graduates.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>UX Designer<\/h4><p>Designing interfaces and interaction flows. Often a portfolio-driven role.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Research<\/div><h4>HCI Faculty / Researcher<\/h4><p>Academic or industry research positions. PhD typically required for faculty.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Policy<\/div><h4>AI Policy / Trust &amp; Safety<\/h4><p>At companies, governments, and think tanks. Background in responsible AI, law, or social science alongside CS.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\"><button class=\"btn\" onclick=\"goTo(3)\">← Theory<\/button><span class=\"page-label\">Cluster 04 / 06<\/span><button class=\"btn primary\" onclick=\"goTo(5)\">Next: Interdisciplinary →<\/button><\/div>\n<\/div>\n\n<\!-- ===================== PAGE 5: INTERDISCIPLINARY ===================== -->\n<div class=\"page\" id=\"page-5\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Cluster 05 — Interdisciplinary Sciences<\/div>\n    <h1>Interdisciplinary<br><em>Sciences<\/em><\/h1>\n    <p class=\"hero-lead\">Fields where CS methods are applied to problems in other scientific domains — biology, physics, linguistics, and applied mathematics.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\"><p>These fields are not CS with a veneer of another domain — they require enough biology, physics, or applied math to formulate meaningful problems and evaluate solutions.<\/p><\/div>\n    <div class=\"section-block\">\n      <h2>Sub-fields<\/h2>\n      <div class=\"subfield-block specialised\"><div class=\"subfield-tag\">Specialised degree — MSCB / MS Bioinformatics at MIT, Stanford, JHU, others<\/div><h4>Computational Biology & Bioinformatics<\/h4><p>Using computational methods to analyse biological data — genomes, protein structures, gene expression, and molecular interactions. Requires cell biology and molecular biology alongside algorithms and statistics.<\/p><div class=\"example-problem\">How do you predict the three-dimensional structure a protein will fold into from its amino acid sequence alone?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — typically PhD-level research area<\/div><h4>Scientific Computing & Numerical Methods<\/h4><p>Developing computational methods for solving mathematical problems that arise in physics, engineering, and climate science — fluid dynamics, finite element analysis, molecular dynamics simulation.<\/p><div class=\"example-problem\">How do you simulate turbulent fluid flow accurately enough to be useful for aircraft design, without requiring the resources of a national supercomputing facility?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — overlaps with NLP<\/div><h4>Computational Linguistics<\/h4><p>The formal and computational study of human language — syntax, semantics, phonology, and pragmatics. Overlaps significantly with NLP but the focus is on linguistic theory and understanding language as a system.<\/p><div class=\"example-problem\">How do the syntactic structures of a language determine what inferences a native speaker can make — and can these constraints be learned by a language model trained only on text?<\/div><\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Career paths<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>Computational Biologist<\/h4><p>At biotech and pharma companies. Drug discovery, genomics, protein design.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Research<\/div><h4>Academic Research<\/h4><p>Faculty or postdoc in bioinformatics or computational chemistry. PhD required.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>Scientific Software Engineer<\/h4><p>Building simulation tools at national labs or engineering companies.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\"><button class=\"btn\" onclick=\"goTo(4)\">← Human-Centred<\/button><span class=\"page-label\">Cluster 05 / 06<\/span><button class=\"btn primary\" onclick=\"goTo(6)\">Next: Robotics →<\/button><\/div>\n<\/div>\n\n<\!-- ===================== PAGE 6: ROBOTICS ===================== -->\n<div class=\"page\" id=\"page-6\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Cluster 06 — Robotics & Embodied Systems<\/div>\n    <h1>Robotics &<br><em>Embodied Systems<\/em><\/h1>\n    <p class=\"hero-lead\">Building physical systems that sense, plan, and act in the real world. Robotics draws on computer vision, reinforcement learning, control theory, and mechanical systems simultaneously.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\"><p>Robotics is a field where breadth is mandatory rather than optional. A robotics system needs to perceive the world (CV), decide what to do (planning, RL), execute those decisions (control), and do this in real time on physical hardware.<\/p><\/div>\n    <div class=\"section-block\">\n      <h2>Sub-fields<\/h2>\n      <div class=\"subfield-block specialised\"><div class=\"subfield-tag\">Within MSR — uses CV and deep learning<\/div><h4>Perception<\/h4><p>How robots sense and interpret the world — 3D reconstruction from cameras or LiDAR, object detection and tracking, semantic scene understanding.<\/p><div class=\"example-problem\">How do you build a system that can reliably detect and track pedestrians in a self-driving car's camera feed under heavy rain, at night, with partial occlusions?<\/div><\/div>\n      <div class=\"subfield-block specialised\"><div class=\"subfield-tag\">Within MSR — uses RL, optimisation, and control theory<\/div><h4>Planning & Control<\/h4><p>Given a perception of the world and a goal, how does a robot decide what to do and how to execute it? Planning covers high-level decision-making; control covers low-level execution.<\/p><div class=\"example-problem\">How do you plan a manipulation trajectory for a robot arm that is robust to small errors in the position of the object it's picking up?<\/div><\/div>\n      <div class=\"subfield-block specialised\"><div class=\"subfield-tag\">Within MSR — overlaps with HCI<\/div><h4>Human-Robot Interaction (HRI)<\/h4><p>How robots and people work together — communication, trust, shared autonomy, and safety. Draws on HCI methods alongside robotics engineering.<\/p><div class=\"example-problem\">How do you design a surgical robot interface that lets a surgeon maintain fine motor control while the robot simultaneously filters out hand tremor?<\/div><\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Career paths<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>Robotics Engineer<\/h4><p>Building perception, planning, or control systems at robotics companies. Strong demand.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>Autonomy Engineer<\/h4><p>At autonomous vehicle companies. Overlaps significantly with ML engineering.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Research<\/div><h4>Robotics Researcher<\/h4><p>Academic or industry research. PhD required for faculty; MS sufficient for some industry research positions.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\"><button class=\"btn\" onclick=\"goTo(5)\">← Interdisciplinary<\/button><span class=\"page-label\">Cluster 06 / 06<\/span><button class=\"btn primary\" onclick=\"goTo(7)\">Tradeoffs →<\/button><\/div>\n<\/div>\n\n<\!-- ===================== PAGE 7: AI vs SYSTEMS ===================== -->\n<div class=\"page\" id=\"page-7\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Tradeoff 01<\/div>\n    <h1>AI / ML<br><em>vs Systems<\/em><\/h1>\n    <p class=\"hero-lead\">The most common dilemma for CS students right now. Both are strong choices — the right one depends on what kind of work you find engaging.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"versus-header\">\n      <div class=\"versus-side left\"><h3>AI / Machine Learning<\/h3><p>Learning from data. Building models. Working with uncertainty, statistics, and large-scale computation.<\/p><\/div>\n      <div class=\"versus-divider\">vs<\/div>\n      <div class=\"versus-side right\"><h3>Systems<\/h3><p>Making things work reliably at scale. Building infrastructure. Working with concurrency, performance, and failure.<\/p><\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>What the work actually looks like<\/h2>\n      <div class=\"compare-row-grid\">\n        <div class=\"crg-head\"><\/div><div class=\"crg-head\">AI / ML<\/div><div class=\"crg-head\">Systems<\/div>\n        <div class=\"crg-cell label\">Primary tool<\/div><div class=\"crg-cell\">Statistics, linear algebra, neural networks, experimental methodology<\/div><div class=\"crg-cell\">Concurrency, distributed protocols, performance engineering, code<\/div>\n        <div class=\"crg-cell label\">A typical day<\/div><div class=\"crg-cell\">Running experiments, interpreting results, reading papers, adjusting model architecture or training procedure<\/div><div class=\"crg-cell\">Debugging distributed system failures, profiling performance bottlenecks, designing APIs, reviewing code<\/div>\n        <div class=\"crg-cell label\">Feedback loop<\/div><div class=\"crg-cell\">Slower — training runs take hours to days; results are probabilistic and require careful interpretation<\/div><div class=\"crg-cell\">Faster — systems either work or they don't; performance is measurable and deterministic<\/div>\n        <div class=\"crg-cell label\">Math intensity<\/div><div class=\"crg-cell\">High — probability, optimisation, linear algebra are daily tools<\/div><div class=\"crg-cell\">Moderate — discrete math and complexity are useful but not daily requirements<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Which to choose<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\"><div class=\"card-label\">Lean AI/ML if<\/div><h4><\/h4><p>You find statistical reasoning and model behaviour genuinely interesting. You are comfortable with the slower, more uncertain feedback loop of experimental research.<\/p><\/div>\n        <div class=\"card purple-card\"><div class=\"card-label\">Lean Systems if<\/div><h4><\/h4><p>You find satisfaction in making complex systems work reliably and efficiently. You prefer concrete, measurable feedback. You are interested in how computers work at a fundamental level.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\"><button class=\"btn\" onclick=\"goTo(0)\">← Map<\/button><span class=\"page-label\">Tradeoff 01 / 04<\/span><button class=\"btn primary\" onclick=\"goTo(8)\">Next: Theory vs Applied ML →<\/button><\/div>\n<\/div>\n\n<\!-- ===================== PAGE 8: THEORY vs APPLIED ML ===================== -->\n<div class=\"page\" id=\"page-8\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Tradeoff 02<\/div>\n    <h1>Theory<br><em>vs Applied ML<\/em><\/h1>\n    <p class=\"hero-lead\">The tension between formal mathematical understanding and empirical results. Both are legitimate approaches to CS; they require different skills and lead to different careers.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"versus-header\">\n      <div class=\"versus-side left\"><h3>Theory<\/h3><p>Proving what is possible or impossible. Formal guarantees. Mathematical elegance over empirical performance.<\/p><\/div>\n      <div class=\"versus-divider\">vs<\/div>\n      <div class=\"versus-side right\"><h3>Applied ML<\/h3><p>Building things that work. Empirical validation. Scale and performance over formal proofs.<\/p><\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Career paths<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card\"><div class=\"card-label\">Theory<\/div><h4>Narrow but specific<\/h4><p>Academic theory faculty, cryptography engineering, quant research, and algorithm design at infrastructure companies. Fewer and more specific than applied ML roles.<\/p><\/div>\n        <div class=\"card teal-card\"><div class=\"card-label\">Applied ML<\/div><h4>Broad and in demand<\/h4><p>ML engineer, applied scientist, research scientist, and data science roles. The widest job market in CS right now.<\/p><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Which to choose<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card purple-card\"><div class=\"card-label\">Lean Theory if<\/div><h4><\/h4><p>You find mathematical proof genuinely satisfying. You are comfortable with a narrower job market. You are interested in what is provably true, not just what works in practice.<\/p><\/div>\n        <div class=\"card teal-card\"><div class=\"card-label\">Lean Applied ML if<\/div><h4><\/h4><p>You are motivated by results — systems that work, benchmarks that improve, products that ship. You find empirical methodology more engaging than proof construction.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\"><button class=\"btn\" onclick=\"goTo(7)\">← AI vs Systems<\/button><span class=\"page-label\">Tradeoff 02 / 04<\/span><button class=\"btn primary\" onclick=\"goTo(9)\">Next: Broad vs Niche →<\/button><\/div>\n<\/div>\n\n<\!-- ===================== PAGE 9: BROAD vs NICHE ===================== -->\n<div class=\"page\" id=\"page-9\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Tradeoff 03<\/div>\n    <h1>Broad<br><em>vs Niche specialisation<\/em><\/h1>\n    <p class=\"hero-lead\">A strategy question rather than a field question. Should you develop expertise across several areas or go very deep in one?<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\"><h2>What breadth gives you<\/h2><p>Breadth makes you flexible. You can work across teams, contribute to projects that span technical areas, and pivot when a field's demand shifts. It is also lower-risk early in a career — if you're not yet certain what you want to specialise in, spending your first year building competence in two or three areas is more useful than going deep in one that turns out not to suit you.<\/p><\/div>\n    <div class=\"section-block\"><h2>What depth gives you<\/h2><p>Depth is how you build a research reputation. In academic CS, being the person who solved a particular problem is more legible to the community than being broadly competent. Strong research profiles are almost always built around a coherent research agenda. Depth also makes you easier to hire for specific roles.<\/p><\/div>\n    <div class=\"section-block\">\n      <h2>Field-specific advice<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card\"><div class=\"card-label\">AI / ML<\/div><h4>Depth helps early<\/h4><p>In ML research, being known for a specific contribution early in a PhD is often more valuable than broad competence. The field moves fast and specific expertise is more legible.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Systems<\/div><h4>Breadth matters more<\/h4><p>Systems work often spans OS, networking, and storage. Understanding how these interact is as important as depth in any one.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Robotics<\/div><h4>Breadth is mandatory<\/h4><p>A robotics system needs perception, planning, and control. Depth in one area without competence in the others is limiting.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Theory<\/div><h4>Depth is the field<\/h4><p>Theoretical contributions require sustained focus on a narrow set of problems. Breadth in theory usually results from sustained depth that connects to adjacent areas.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\"><button class=\"btn\" onclick=\"goTo(8)\">← Theory vs Applied ML<\/button><span class=\"page-label\">Tradeoff 03 / 04<\/span><button class=\"btn primary\" onclick=\"goTo(10)\">Next: Specialised vs MSCS →<\/button><\/div>\n<\/div>\n\n<\!-- ===================== PAGE 10: SPECIALISED vs MSCS ===================== -->\n<div class=\"page\" id=\"page-10\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Tradeoff 04<\/div>\n    <h1>Specialised degree<br><em>vs MSCS<\/em><\/h1>\n    <p class=\"hero-lead\">When a specialised degree (MSAI, MSHCI, MSR) exists for the field you want — should you take it, or do MSCS and build the same depth through course selection?<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"versus-header\">\n      <div class=\"versus-side left\"><h3>Specialised degree<\/h3><p>MSAI, MSML, MSHCI, MSR — a named degree in a specific field. Curriculum is prescribed.<\/p><\/div>\n      <div class=\"versus-divider\">vs<\/div>\n      <div class=\"versus-side right\"><h3>MSCS<\/h3><p>A broad CS degree where you choose courses across the curriculum. Maximum flexibility.<\/p><\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>The practical decision rule<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\"><div class=\"card-label\">Take the specialised degree if<\/div><h4><\/h4><p>You are certain about your field, the specialised degree exists at the programme you're attending, and the curriculum is genuinely more focused than the MSCS track. Check both curricula — at some schools they are nearly identical.<\/p><\/div>\n        <div class=\"card purple-card\"><div class=\"card-label\">Take MSCS if<\/div><h4><\/h4><p>You are not certain about your focus, you want to combine areas, or the MSCS and specialised degree curricula at your programme are essentially the same. MSCS is not a compromise — it is the right choice for anyone who values flexibility.<\/p><\/div>\n      <\/div>\n      <p style=\"margin-top:1.5rem; font-size:0.9rem; color:var(--ink-3);\">One practical note: at schools like CMU that offer many named degrees, the specialised degrees often have genuinely distinct curricula. At schools that offer fewer named degrees, the difference between MSCS and MSAI may only be a handful of required versus elective courses.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\"><button class=\"btn\" onclick=\"goTo(9)\">← Broad vs Niche<\/button><span class=\"page-label\">Tradeoff 04 / 04<\/span><button class=\"btn primary\" onclick=\"goTo(0)\">← Back to map<\/button><\/div>\n  <div class=\"disclaimer\">This resource is maintained by the Ashoka University Post Graduate Office. Field and degree information reflects general patterns and may not apply to every programme.<\/div>\n<\/div>\n\n<script>\n/* ── PAGE NAV ── */\nconst TOTAL_PAGES = 11;\nlet currentPage = 0;\nfunction buildNav() {\n  const c = document.getElementById('navDots'); c.innerHTML = '';\n  const labels = ['Map','AI/ML','Systems','Theory','Human-Centred','Interdisciplinary','Robotics','T1','T2','T3','T4'];\n  for (let i = 0; i < TOTAL_PAGES; i++) {\n    const d = document.createElement('div');\n    d.className = 'nav-dot' + (i===currentPage?' active':(i<currentPage?' visited':''));\n    d.onclick = () => goTo(i); d.title = labels[i];\n    c.appendChild(d);\n  }\n}\nfunction goTo(n) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.getElementById('page-'+n).classList.add('active');\n  currentPage = n; buildNav();\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nbuildNav();\n\n/* ── INTERACTIVE FIELD MAP ── */\nvar FM_INFO = {\n  'fc-aiml':  ['cluster','AI / ML','The largest and most active research area in CS. Covers every system that learns from data, makes decisions, or generates content. Accounts for the most paper submissions at NeurIPS, ICML, ICLR, CVPR, and ACL. Both research and industry demand are very high.'],\n  'fc-sys':   ['cluster','Systems','Concerned with how software works at scale — operating systems, distributed systems, databases, security, networking, and hardware. The work is empirical and engineering-intensive. Demand is high and more stable across economic cycles than AI/ML.'],\n  'fc-theory':['cluster','Theory','The mathematical foundations of CS — what can be computed, how efficiently, and with what guarantees. Requires comfort with proofs, combinatorics, algebra, and logic. The highest mathematical floor and the narrowest industry job market of any CS cluster.'],\n  'fc-hci':   ['cluster','Human-Centred Computing','Studies how people interact with technology. Unusually for CS, research methods include user studies, qualitative interviews, and design experiments alongside programming. Career paths span UX research, design, and policy roles.'],\n  'fc-inter': ['cluster','Interdisciplinary Sciences','CS methods applied to other scientific domains — biology, physics, applied math, linguistics. Requires genuine investment in the domain alongside CS depth. Not CS with a veneer of another subject.'],\n  'fc-rob':   ['cluster','Robotics & Embodied Systems','Building physical systems that sense, plan, and act in the real world. Breadth is mandatory — a robot needs perception, decision-making, and execution simultaneously. One of the less saturated high-growth areas.'],\n\n  'fd-mscs-ai':    ['broad','MSCS (AI track)','Covers AI/ML courses alongside systems, theory, or HCI. Most programmes allow 3–4 AI courses within an MSCS. Best if you want to combine AI with another area, or are not yet certain you want only AI. More flexible than a named MSAI.'],\n  'fd-mscs-sys':   ['broad','MSCS (Systems track)','The standard path for systems. No standalone MS in Systems exists at most institutions — you do MSCS and select systems courses. Systems knowledge is embedded throughout the CS curriculum by design.'],\n  'fd-mscs-theory':['broad','MSCS (Theory track)','The only degree option for theory. No standalone Theory MS exists anywhere. You share the MSCS with systems and ML students, filling electives with algorithms, complexity, combinatorics, and logic courses.'],\n  'fd-mscs-hci':   ['broad','MSCS (HCI track)','Best if you want HCI combined with ML or systems work, or want to remain in engineering roles rather than moving into pure UX research or design.'],\n  'fd-mscs-inter': ['broad','MSCS + domain electives','The default path for interdisciplinary work. You do MSCS and take electives in biology, physics, or linguistics. Requires self-direction to build domain knowledge alongside CS depth.'],\n  'fd-msr':        ['spec','MSR / MSROBOTICS','Robotics is small enough that the broad and specialised degree are the same. An MSR at CMU or MSROBOTICS at Michigan covers the entire field. Available primarily at CMU, Michigan, Johns Hopkins, Georgia Tech, and USC.'],\n\n  'fd-msai':  ['spec','MSAI / MSML','More prescribed curriculum than MSCS — defined AI/ML courses with less room for outside electives. Signals clear focus to employers. At many schools the courses are identical to the MSCS AI track — check both curricula before deciding.'],\n  'fd-mscv':  ['spec','MSCV','A specialised degree in Computer Vision. Available at CMU and a small number of other schools. Best for students certain they want CV specifically.'],\n  'fd-msds-a':['spec','MSDS (AI/ML cluster)','Data Science MS programmes sit at the boundary of AI/ML and statistics. Primarily a professional degree for applied data science roles, not a research degree. High industry demand.'],\n  'fd-msnlp': ['spec','MSNLP (rare)','A standalone NLP degree. Rare — only a handful of programmes offer this as a named degree. NLP has been transformed by large language models and is currently one of the most active sub-fields.'],\n  'fd-msis':  ['spec','MSIS / MS-Security','Security is the main systems sub-field with a dedicated degree. CMU MSIT-IS, Georgia Tech MSCS-Security, and similar programmes exist for students who want depth in applied security, policy, and cryptography together.'],\n  'fd-msde':  ['spec','MSDE (Data Engineering)','Focuses on large-scale data infrastructure — pipelines, warehouses, streaming systems. Available at a small number of schools. Sits at the boundary of systems and data science. High industry demand.'],\n  'fd-mshci': ['spec','MSHCI','A standalone degree in human-computer interaction. Curriculum is entirely HCI — design, user research, evaluation, and prototyping. Less technical programming than MSCS. Available at CMU, Michigan, Georgia Tech, Indiana, and others.'],\n  'fd-mscb':  ['spec','MSCB / MS Bioinformatics','Available at MIT, Stanford, Johns Hopkins, and others. Builds CS and biology competence in parallel. Most appropriate if you know you want to work in biology, pharma, or biotech.'],\n  'fd-msds-i':['spec','MSDS (Interdisciplinary cluster)','Applied data science at the intersection of statistics, CS, and domain science. Primarily a professional degree. Strong demand across sectors.'],\n\n  'fd-rl':      ['sub','Reinforcement Learning','Learning through interaction — an agent takes actions, receives rewards, and learns a policy. Underlies game-playing systems, robotics control, and language model training (RLHF). Requires probability, optimisation, and dynamic programming.'],\n  'fd-aisafety':['sub','AI Safety & Alignment','Ensuring AI systems behave as intended as they become more capable. Technical work includes interpretability, robustness, and alignment methods. Distinct from AI ethics. Industry positions concentrated at Anthropic, DeepMind, ARC Evals, Redwood Research.'],\n  'fd-dl':      ['sub','Deep Learning','The study of neural network architectures — transformers, diffusion models, graph networks — and their training dynamics. Pervades CV, NLP, and RL. Covered in virtually every AI/ML programme.'],\n  'fd-os':      ['sub','OS & Distributed Systems','How computers manage resources extended to networks of machines. Covers coordination, consensus, fault tolerance, and consistency. The foundation of every large-scale software system.'],\n  'fd-arch':    ['sub','Computer Architecture','Design of processors, memory hierarchies, and hardware-software interfaces. Increasingly important as ML workloads have driven demand for custom silicon — GPUs, TPUs, NPUs.'],\n  'fd-pl':      ['sub','PL & Compilers','Design of programming languages, type systems, and the tools that translate code to machine instructions. Bridges type theory and systems engineering.'],\n  'fd-net':     ['sub','Networking','Design and analysis of communication systems — protocols, routing, congestion control, and network architecture. Increasingly intersects with ML training infrastructure.'],\n  'fd-algos':   ['sub','Algorithms & Complexity','Design and analysis of efficient algorithms, and the study of computational complexity — which problems are tractable and which are not. Foundational to everything else in CS.'],\n  'fd-crypto':  ['sub','Cryptography (theoretical)','Mathematical study of secure communication — building protocols whose security can be formally proved. Foundational to blockchain, secure computation, and zero-knowledge proofs.'],\n  'fd-fm':      ['sub','Formal Methods & Verification','Using mathematical logic to prove that software and hardware are correct. Used in safety-critical systems: avionics, medical devices, cryptographic protocols.'],\n  'fd-qc':      ['sub','Quantum Computing','Computing with quantum mechanical systems — qubits, superposition, entanglement. Currently pre-commercial in most applications. Requires linear algebra and quantum mechanics alongside CS theory.'],\n  'fd-css':     ['sub','Computational Social Science','Using CS methods — network analysis, NLP, large-scale data — to answer questions about human social behaviour. Published in both CS venues and social science journals.'],\n  'fd-rai':     ['sub','Responsible AI / Ethics','Studying fairness, accountability, and transparency of algorithmic systems. Technical work includes bias measurement, fairness-aware ML, and explainability. Different community from AI Safety.'],\n  'fd-scicomp': ['sub','Scientific Computing','Computational methods for physics, engineering, and climate science — fluid dynamics, finite element analysis, molecular dynamics. Requires applied mathematics.'],\n  'fd-ling':    ['sub','Computational Linguistics','Formal and computational study of human language — syntax, semantics, phonology, pragmatics. Overlaps with NLP but focuses on understanding language as a system.'],\n  'fd-percept': ['sub','Perception','How robots sense and interpret the world — 3D reconstruction, object detection and tracking, semantic scene understanding. Draws heavily on computer vision and deep learning.'],\n  'fd-planning':['sub','Planning & Control','How a robot decides what to do and executes it. Planning covers high-level decisions; control covers low-level execution. Requires optimisation theory and increasingly RL.'],\n  'fd-hri':     ['sub','Human-Robot Interaction','How robots and people work together — communication, trust, shared autonomy, and safety. Draws on HCI methods alongside robotics engineering.']\n};\n\nvar FM_TAGCLS = {cluster:'fm-t-cluster', broad:'fm-t-broad', spec:'fm-t-spec', sub:'fm-t-sub'};\nvar FM_TAGLBL = {cluster:'Research cluster', broad:'Broad degree', spec:'Specialised degree', sub:'Sub-field — no dedicated degree'};\n\nvar fmPanel  = document.getElementById('fm-panel');\nvar fmPtag   = document.getElementById('fm-ptag');\nvar fmPtitle = document.getElementById('fm-ptitle');\nvar fmPbody  = document.getElementById('fm-pbody');\nvar fmActive = null;\n\nfunction fmShow(id) {\n  var d = FM_INFO[id]; if (!d) return;\n  if (fmActive) fmActive.classList.remove('fm-active');\n  fmActive = document.getElementById(id);\n  if (fmActive) fmActive.classList.add('fm-active');\n  fmPtag.className = 'fm-ptag ' + FM_TAGCLS[d[0]];\n  fmPtag.textContent = FM_TAGLBL[d[0]];\n  fmPtitle.textContent = d[1];\n  fmPbody.textContent  = d[2];\n  fmPanel.classList.add('open');\n  fmPanel.scrollIntoView({behavior:'smooth', block:'nearest'});\n}\n\ndocument.getElementById('fm-pclose').addEventListener('click', function() {\n  fmPanel.classList.remove('open');\n  if (fmActive) { fmActive.classList.remove('fm-active'); fmActive = null; }\n});\n\nObject.keys(FM_INFO).forEach(function(id) {\n  var el = document.getElementById(id);\n  if (el) el.addEventListener('click', function() { fmShow(id); });\n});\n<\/script>\n<style>\n.pg-home{display:none;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:none;border:1px solid var(--rule);padding:.4rem .75rem;cursor:pointer;white-space:nowrap}\n.pg-home:hover{color:var(--accent);border-color:var(--accent)}\n.pg-home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\nbody.on-sub .pg-home{display:inline-flex}\nbody.on-sub nav .nav-brand{display:none}\n<\/style>\n<script>(function(){\nvar nav=document.querySelector('nav');if(!nav||typeof goTo!=='function')return;\nvar b=document.createElement('button');b.type='button';b.className='pg-home';b.textContent='\\u2190 Contents';\nb.title='Back to the start of this section';b.onclick=function(){goTo(0)};nav.insertBefore(b,nav.firstChild);\nfunction sync(){var a=document.querySelector('.page.active');var sub=!!a&&a.id!=='page-0';\n if(document.body.classList.contains('on-sub')!==sub)document.body.classList.toggle('on-sub',sub);}\nnew MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});sync();\nwindow.addEventListener('message',function(e){if(e.data==='pg-home')goTo(0)});\n})();<\/script>\n<\/body>\n<\/html>"}, {"id": "shortlist", "title": "Shortlisting master's schools", "short": "Shortlisting", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Shortlisting Master's Schools — Ashoka CS<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --ink: #1a1a1a; --ink-2: #444; --ink-3: #888;\n    --paper: #faf8f3; --paper-2: #f2efe8; --paper-3: #e8e4da;\n    --accent: #c0392b; --accent-2: #e67e22;\n    --teal: #1a7a6e; --teal-light: #e8f5f3;\n    --rule: #ddd9d0;\n    --serif: 'DM Serif Display', Georgia, serif;\n    --sans: 'DM Sans', sans-serif;\n    --mono: 'DM Mono', monospace;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; font-size: 16px; line-height: 1.7; }\n\n  nav { position: fixed; top: 0; left: 0; right: 0; background: var(--paper); border-bottom: 1px solid var(--rule); z-index: 100; padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; }\n  .nav-brand { font-family: var(--mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }\n  .nav-brand span { color: var(--accent); }\n  .nav-progress { display: flex; gap: 6px; align-items: center; }\n  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--paper-3); cursor: pointer; transition: background 0.2s, transform 0.2s; }\n  .nav-dot.active { background: var(--accent); transform: scale(1.4); }\n  .nav-dot.visited { background: var(--ink-3); }\n\n  .page { display: none; min-height: 100vh; padding-top: 56px; animation: fadeIn 0.35s ease; }\n  .page.active { display: block; }\n  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n\n  .hero { padding: 5rem 2rem 4rem; max-width: 900px; margin: 0 auto; border-bottom: 1px solid var(--rule); }\n  .hero-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; }\n  .hero h1 { font-family: var(--serif); font-size: clamp(2.2rem, 4.5vw, 3.6rem); line-height: 1.15; color: var(--ink); margin-bottom: 1.4rem; font-weight: 400; }\n  .hero h1 em { font-style: italic; color: var(--accent); }\n  .hero-lead { font-size: 1.05rem; color: var(--ink-2); max-width: 580px; line-height: 1.75; }\n\n  .content { max-width: 900px; margin: 0 auto; padding: 3rem 2rem 6rem; }\n  .section-block { margin-bottom: 3.5rem; }\n  .section-block h2 { font-family: var(--serif); font-size: 1.75rem; font-weight: 400; margin-bottom: 1rem; color: var(--ink); }\n  .section-block h3 { font-family: var(--sans); font-size: 0.875rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); margin-bottom: 0.75rem; margin-top: 2rem; }\n  .section-block p { color: var(--ink-2); margin-bottom: 1rem; }\n  .section-block p:last-child { margin-bottom: 0; }\n\n  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin: 1.5rem 0; }\n  .card { background: var(--paper-2); border: 1px solid var(--rule); padding: 1.25rem 1.25rem 1.5rem; }\n  .card-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.5rem; }\n  .card h4 { font-family: var(--serif); font-size: 1.1rem; font-weight: 400; margin-bottom: 0.5rem; color: var(--ink); }\n  .card p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.6; }\n  .card.accent-card { background: #fdf0ee; border-color: #e8bfba; }\n  .card.teal-card { background: var(--teal-light); border-color: #b3d8d4; }\n\n  .data-rows { border: 1px solid var(--rule); margin: 1.5rem 0; }\n  .data-row { display: grid; grid-template-columns: 180px 1fr; border-bottom: 1px solid var(--rule); }\n  .data-row:last-child { border-bottom: none; }\n  .data-key { padding: 0.85rem 1rem; background: var(--paper-2); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; display: flex; align-items: flex-start; padding-top: 1rem; }\n  .data-val { padding: 0.85rem 1.25rem; font-size: 0.9rem; color: var(--ink-2); line-height: 1.65; }\n  .data-val strong { color: -2); line-height: 1.6; align-items: flex-start; }\n  .step-list li:last-child { border-bottom: none; }\n  .step-num { font-family: var(--mono); font-size: 11px; color: var(--accent); min-width: 20px; padding-top: 2px; flex-shrink: 0; }\n\n  .toc { margin: 2rem 0; }\n  .toc-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--rule); cursor: pointer; transition: color 0.15s; }\n  .toc-item:hover { color: var(--accent); }\n  .toc-item:hover .toc-arrow { opacity: 1; transform: translateX(4px); }\n  .toc-num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 2rem; }\n  .toc-title { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; flex: 1; }\n  .toc-meta { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.05em; display: none; }\n  @media (min-width: 500px) { .toc-meta { display: block; } }\n  .toc-arrow { font-size: 1rem; color: var(--accent); opacity: 0; transition: opacity 0.15s, transform 0.15s; }\n\n  .page-nav { max-width: 900px; margin: 0 auto; padding: 2rem 2rem 4rem; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; }\n  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 0.7rem 1.4rem; font-family: var(--sans); font-size: 0.875rem; font-weight: 500; cursor: pointer; border: 1px solid var(--ink); background: transparent; color: var(--ink); transition: background 0.15s, color 0.15s; letter-spacing: 0.01em; }\n  .btn:hover { background: var(--ink); color: var(--paper); }\n  .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }\n  .btn.primary:hover { background: #a93226; border-color: #a93226; }\n  .btn:disabled { opacity: 0.28; cursor: default; pointer-events: none; }\n  .page-label { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em; text-align: center; }\n\n  .disclaimer { background: var(--paper-2); border-top: 1px solid var(--rule); padding: 1rem 2rem; font-size: 0.8rem; color: var(--ink-3); text-align: center; line-height: 1.6; }\n  @media (max-width: 600px) { .card-grid { grid-template-columns: 1fr; } }\n\n  .pv-tag { display: inline-block; font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; margin-left: 6px; vertical-align: middle; }\n  .pv-tag.pub { background: var(--teal-light); color: var(--teal); border: 1px solid #b3d8d4; }\n  .pv-tag.priv { background: #fdf0ee; color: var(--accent); border: 1px solid #e8bfba; }\n<\/style>\n<\/head>\n<body>\n\n<nav>\n  <div class=\"nav-brand\">Ashoka University · <span>CS Higher Ed<\/span><\/div>\n  <div class=\"nav-progress\" id=\"navDots\"><\/div>\n<\/nav>\n\n<\!-- PAGE 0: INDEX -->\n<div class=\"page active\" id=\"page-0\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 04 — Applications · Post Graduate Office<\/div>\n    <h1>Shortlisting<br><em>master's schools<\/em><\/h1>\n    <p class=\"hero-lead\">A practical guide for CS students at Ashoka who have decided to pursue a master's and are now building their application list. Covers location, cost, programme quality, how to categorise schools, and the tools to do the research.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <p>Shortlisting is not the same as applying. It is the research phase that determines whether you apply to the right schools — not just the most well-known ones. A well-built shortlist accounts for your target outcome, your profile, and your practical constraints.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <div class=\"toc\">\n        <div class=\"toc-item\" onclick=\"goTo(1)\">\n          <span class=\"toc-num\">01<\/span>\n          <span class=\"toc-title\">Location<\/span>\n          <span class=\"toc-meta\">US · Canada · UK · Europe · India · Asia · Strategy<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(2)\">\n          <span class=\"toc-num\">02<\/span>\n          <span class=\"toc-title\">Cost<\/span>\n          <span class=\"toc-meta\">Total cost · Public vs private · TA/RA · Funding<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(3)\">\n          <span class=\"toc-num\">03<\/span>\n          <span class=\"toc-title\">Programme<\/span>\n          <span class=\"toc-meta\">Faculty · Placements · PhD outcomes · Alumni mapping<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(4)\">\n          <span class=\"toc-num\">04<\/span>\n          <span class=\"toc-title\">Safety, Target, Dream<\/span>\n          <span class=\"toc-meta\">How to categorise · GPA cutoffs · How many to apply<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(5)\">\n          <span class=\"toc-num\">05<\/span>\n          <span class=\"toc-title\">Resources<\/span>\n          <span class=\"toc-meta\">PG Office spreadsheet · Rankings · Tools<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"disclaimer\">This resource is maintained by the Ashoka University Post Graduate Office. Information reflects general patterns and may not apply to every programme or student profile.<\/div>\n<\/div>\n\n<\!-- PAGE 1: LOCATION -->\n<div class=\"page\" id=\"page-1\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 01 — Location<\/div>\n    <h1>Choosing a<br><em>region<\/em><\/h1>\n    <p class=\"hero-lead\">Where you study determines your visa pathway, job market access, cost of living, and in many cases where you live for the five years after graduation. Decide on a region before researching individual schools. Within every region, whether a school is public (government-funded) or private changes its cost, funding options, and in some cases its research culture — this is called out school by school below.<\/p>\n  <\/div>\n  <div class=\"content\">\n\n    <div class=\"howto\">\n      <div class=\"howto-label\">How to research location<\/div>\n      <p>For visa rules: go directly to the official immigration website for each country — USCIS (US), IRCC (Canada), UKVI (UK). For cost of living: Numbeo (numbeo.com) gives city-level data on rent, food, and transport. For job market density: LinkedIn's job search filtered by location and job title shows how many relevant roles exist in each city.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>United States<\/h2>\n      <h3>Why students choose it<\/h3>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Visa<\/div>\n          <h4>STEM OPT<\/h4>\n          <p>F-1 visa + STEM OPT gives 3 years of post-graduation work authorisation without immediate employer sponsorship. The most generous international student work pathway of any English-speaking country.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Market<\/div>\n          <h4>Largest tech ecosystem<\/h4>\n          <p>Highest concentration of CS companies globally. Highest compensation for CS roles internationally. Most internationally recognised CS programmes.<\/p>\n        <\/div>\n      <\/div>\n      <h3>Watch out for<\/h3>\n      <div class=\"card-grid\">\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">Cost<\/div>\n          <h4>Highest tuition globally<\/h4>\n          <p>$50,000–$90,000 total tuition for a 2-year programme. Cost of living varies dramatically — Pittsburgh and Austin are manageable; San Francisco and New York are not.<\/p>\n        <\/div>\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">Visa<\/div>\n          <h4>H-1B uncertainty<\/h4>\n          <p>After OPT expires, long-term US residency depends on the H-1B lottery. It is oversubscribed and not guaranteed. Permanent residency is not a certainty even after a successful OPT period.<\/p>\n        <\/div>\n      <\/div>\n      <h3>Public vs private in the US<\/h3>\n      <p>Public (state-funded) universities are generally cheaper, especially once any in-state consideration or lower base tuition is factored in, and several have CS placement on par with top private schools. Private universities carry more brand recognition and are usually more expensive, but are not consistently better for CS outcomes specifically. See the Cost page for a full breakdown.<\/p>\n      <h3>Major programme hubs<\/h3>\n      <div class=\"table-wrap\">\n        <table class=\"std-table\">\n          <thead><tr><th>City<\/th><th>Key schools<\/th><\/tr><\/thead>\n          <tbody>\n            <tr><td class=\"tl\">Bay Area<\/td><td>Stanford <span class=\"pv-tag priv\">Private<\/span>, UC Berkeley <span class=\"pv-tag pub\">Public<\/span>, Santa Clara <span class=\"pv-tag priv\">Private<\/span><\/td><\/tr>\n            <tr><td class=\"tl\">Boston<\/td><td>MIT <span class=\"pv-tag priv\">Private<\/span>, Northeastern <span class=\"pv-tag priv\">Private<\/span>, Boston University <span class=\"pv-tag priv\">Private<\/span><\/td><\/tr>\n            <tr><td class=\"tl\">New York<\/td><td>Columbia <span class=\"pv-tag priv\">Private<\/span>, NYU <span class=\"pv-tag priv\">Private<\/span>, Cornell Tech <span class=\"pv-tag priv\">Private<\/span><\/td><\/tr>\n            <tr><td class=\"tl\">Pittsburgh<\/td><td>CMU <span class=\"pv-tag priv\">Private<\/span><\/td><\/tr>\n            <tr><td class=\"tl\">Southern California<\/td><td>UCLA <span class=\"pv-tag pub\">Public<\/span>, UCSD <span class=\"pv-tag pub\">Public<\/span>, USC <span class=\"pv-tag priv\">Private<\/span><\/td><\/tr>\n            <tr><td class=\"tl\">Atlanta<\/td><td>Georgia Tech <span class=\"pv-tag pub\">Public<\/span><\/td><\/tr>\n            <tr><td class=\"tl\">Seattle<\/td><td>University of Washington <span class=\"pv-tag pub\">Public<\/span><\/td><\/tr>\n            <tr><td class=\"tl\">Austin<\/td><td>UT Austin <span class=\"pv-tag pub\">Public<\/span><\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Canada<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Visa<\/div>\n          <h4>PGWP + Express Entry<\/h4>\n          <p>Post-Graduation Work Permit allows up to 3 years of work authorisation. Express Entry permanent residency pathway is more predictable than the US H-1B lottery.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Cost<\/div>\n          <h4>Lower than the US<\/h4>\n          <p>Tuition and living costs are meaningfully lower than comparable US programmes. Salaries are also lower than US equivalents, though cost of living adjusts accordingly.<\/p>\n        <\/div>\n      <\/div>\n      <p><strong style=\"color:var(--ink);\">Public vs private:<\/strong> Almost every major Canadian CS programme — UofT, UBC, McGill, Waterloo — is a public university. There is little practical distinction to make here; unlike the US, the \"private premium\" in brand and tuition mostly does not apply.<\/p>\n      <p style=\"margin-top:1.2rem;\"><strong style=\"color:var(--ink);\">Hubs:<\/strong> Toronto (UofT <span class=\"pv-tag pub\">Public<\/span>), Vancouver (UBC <span class=\"pv-tag pub\">Public<\/span>), Montréal (McGill <span class=\"pv-tag pub\">Public<\/span>, Université de Montréal <span class=\"pv-tag pub\">Public<\/span> — especially strong for AI/ML via MILA), Waterloo <span class=\"pv-tag pub\">Public<\/span>.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>United Kingdom<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Duration<\/div>\n          <h4>1-year programmes<\/h4>\n          <p>Faster return to the job market and lower total cost than a 2-year US programme. Graduate Route visa provides 2 years of post-graduation work authorisation (3 for PhD graduates).<\/p>\n        <\/div>\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">Watch out for<\/div>\n          <h4>Limited depth<\/h4>\n          <p>One year leaves little room for deep specialisation or career pivoting. London cost of living is very high. International tuition is typically £25,000–£35,000 for the year.<\/p>\n        <\/div>\n      <\/div>\n      <p><strong style=\"color:var(--ink);\">Public vs private:<\/strong> Almost all UK universities, including every school listed below, are public institutions (funded and regulated by the state, sometimes called \"state universities\"). A small number of private UK universities exist (e.g. University of Buckingham) but none are prominent for CS master's degrees, so this distinction matters far less here than in the US.<\/p>\n      <div class=\"warn-block\">\n        <div class=\"warn-icon\">→<\/div>\n        <p><strong>Fully funded PhD positions are rare in the UK compared to the US.<\/strong> US PhD programmes are typically funded by default — admission usually comes with a TA/RA stipend and tuition waiver. In the UK, funding is not guaranteed alongside admission: students often compete separately for a limited number of studentships (UKRI, departmental, or supervisor grant funding), and many self-fund or fund through external scholarships. If PhD funding matters to you, confirm the funding model for each UK programme individually rather than assuming it comes with the offer.<\/p>\n      <\/div>\n      <p style=\"margin-top:1.2rem;\"><strong style=\"color:var(--ink);\">Strong programmes (all public):<\/strong> Imperial College London, UCL, Edinburgh, Oxford, Cambridge (very selective), Manchester, Southampton.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Europe (non-UK)<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Cost<\/div>\n          <h4>Often free or very low<\/h4>\n          <p>Public universities in Germany, Sweden, and the Netherlands charge minimal or no tuition even for international students. ETH Zurich and EPFL are globally competitive with top US programmes.<\/p>\n        <\/div>\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">Watch out for<\/div>\n          <h4>Fragmented job market<\/h4>\n          <p>The job market varies significantly across countries. English-language programmes exist but daily life often requires the local language. The EU Blue Card work visa varies by country and is less streamlined than OPT.<\/p>\n        <\/div>\n      <\/div>\n      <p><strong style=\"color:var(--ink);\">Public vs private:<\/strong> Nearly all of the strong CS programmes in continental Europe — ETH Zurich, EPFL, TU Munich, KTH, TU Delft — are public institutions, which is part of why costs are so low. Private universities are much less common in European CS education than in the US, and generally do not outrank the top public options.<\/p>\n      <p style=\"margin-top:1.2rem;\"><strong style=\"color:var(--ink);\">Strong programmes (all public):<\/strong> ETH Zurich, EPFL, TU Munich, KTH Stockholm, TU Delft.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>India<\/h2>\n      <p>An India-based master's (or a direct-entry PhD) is worth considering for students who want to stay close to family, are prioritising the Indian job market, or are weighing a low-debt option against significant international loans. It's also the natural comparison point for Ashoka students since admission cycles, exams, and campus culture are already familiar.<\/p>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Cost<\/div>\n          <h4>Lowest cost by far<\/h4>\n          <p>Public institutions (IITs, IISc, NITs) charge a fraction of international tuition — total cost for a 2-year M.Tech at an IIT is typically in the ₹2–4 lakh range including fees, before any assistantship stipend is applied.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Funding<\/div>\n          <h4>HTRA / TA support<\/h4>\n          <p>M.Tech students at IITs who qualify via GATE are commonly eligible for a Half-Time Teaching/Research Assistantship (HTRA), which covers tuition and provides a monthly stipend — a funding structure closer to the US TA/RA model than to UK-style self-funding.<\/p>\n        <\/div>\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">Watch out for<\/div>\n          <h4>Entrance exams and seat scarcity<\/h4>\n          <p>Admission to public institutions runs through centralised, high-stakes exams (GATE for M.Tech, JAM for M.Sc, an interview process for research positions) rather than the holistic application process used abroad. Seats in top programmes and specialisations are limited and highly competitive.<\/p>\n        <\/div>\n      <\/div>\n      <h3>Public vs private in India<\/h3>\n      <p>The distinction is sharper in India than almost anywhere else, because it changes not just cost but the admission process itself.<\/p>\n      <div class=\"table-wrap\">\n        <table class=\"std-table\">\n          <thead><tr><th>Type<\/th><th>Examples<\/th><th>Notes<\/th><\/tr><\/thead>\n          <tbody>\n            <tr><td class=\"tl\">Public<\/td><td>IITs (Bombay, Delhi, Madras, Kanpur, Kharagpur, and others), IISc Bangalore, NITs<\/td><td>Government-funded, very low tuition, admission almost entirely via GATE/JAM/entrance exam and merit rank, strong research output and HTRA funding for M.Tech/PhD.<\/td><\/tr>\n            <tr><td class=\"tl\">Private / deemed<\/td><td>BITS Pilani, IIIT Hyderabad, IIIT Delhi, Ashoka, Plaksha, Krea<\/td><td>Higher fees than public institutions (though still far below US/UK tuition), often more flexible or holistic admissions, growing research programmes especially in CS/AI at IIIT-Hyderabad and IIIT-Delhi.<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <h3>Job market and location<\/h3>\n      <p>Bangalore, Hyderabad, Pune, and the NCR region (Delhi/Gurugram/Noida) are the dominant CS hubs, with the highest concentration of both Indian tech companies and global-capability-centre roles for MNCs. No visa considerations apply for Indian citizens, which removes an entire layer of planning present in every other region on this page.<\/p>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to research Indian programmes<\/div>\n        <ul>\n          <li>Check each institute's official CS/CSE department page for faculty research areas, and cross-reference with Google Scholar as you would for any other region.<\/li>\n          <li>GATE cutoffs and previous years' closing ranks are published by the exam authority and by individual institutes — search <em>[institute name] M.Tech CSE GATE cutoff<\/em> to gauge where you stand.<\/li>\n          <li>Talk to Ashoka seniors or alumni who have gone this route — the PG Office spreadsheet (see Resources) includes India-based outcomes alongside international ones.<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Singapore and Asia<\/h2>\n      <p>NUS and NTU (both public, autonomous universities funded by the Singapore government) are globally ranked with strong industry links to the Asian technology market. Work visa pathways for skilled graduates are straightforward. Cost of living is lower than the US or UK. Best suited to students specifically targeting Southeast Asian industry or wanting proximity to Asian technology hubs.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Application strategy<\/h2>\n      <div class=\"table-wrap\">\n        <table class=\"std-table\">\n          <thead><tr><th>Strategy<\/th><th>When it makes sense<\/th><\/tr><\/thead>\n          <tbody>\n            <tr><td class=\"tl\">One country only<\/td><td>Most students — allows deeper research and simpler applications<\/td><\/tr>\n            <tr><td class=\"tl\">US + Canada<\/td><td>Best optionality for students targeting North American careers<\/td><\/tr>\n            <tr><td class=\"tl\">US + Europe<\/td><td>Cost-conscious students who want a US option alongside low-cost European programmes<\/td><\/tr>\n            <tr><td class=\"tl\">India + one international region<\/td><td>Sensible hedge for students genuinely open to either path, given how different the application timelines and formats are<\/td><\/tr>\n            <tr><td class=\"tl\">Three or more countries<\/td><td>Rarely worth the added complexity — application quality suffers<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(0)\">← Back<\/button>\n    <span class=\"page-label\">01 / 05<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(2)\">Next: Cost →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 2: COST -->\n<div class=\"page\" id=\"page-2\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 02 — Cost<\/div>\n    <h1>Understanding<br><em>cost<\/em><\/h1>\n    <p class=\"hero-lead\">Tuition is not the full number. Total cost of attendance, funding opportunities within each university, and the expected salary return all factor into whether a programme makes financial sense. Whether a university is public or private is one of the biggest single drivers of that number, so it's called out region by region below.<\/p>\n  <\/div>\n  <div class=\"content\">\n\n    <div class=\"section-block\">\n      <h2>Total cost of attendance<\/h2>\n      <p>Add tuition, fees, health insurance (mandatory and expensive at US schools), housing, food, and transport. The table below gives estimated total costs — tuition plus living — for a full programme.<\/p>\n      <div class=\"table-wrap\">\n        <table class=\"std-table\">\n          <thead><tr><th>Region<\/th><th>Duration<\/th><th>Estimated total<\/th><\/tr><\/thead>\n          <tbody>\n            <tr><td class=\"tl\">United States<\/td><td>2 years<\/td><td>$80,000–$160,000<\/td><\/tr>\n            <tr><td class=\"tl\">United Kingdom<\/td><td>1 year<\/td><td>£40,000–£70,000<\/td><\/tr>\n            <tr><td class=\"tl\">Canada<\/td><td>2 years<\/td><td>CAD $60,000–$100,000<\/td><\/tr>\n            <tr><td class=\"tl\">Germany / Sweden<\/td><td>2 years<\/td><td>€15,000–€30,000 (living costs only)<\/td><\/tr>\n            <tr><td class=\"tl\">India (public institutes)<\/td><td>2 years<\/td><td>₹4–8 lakh (roughly $5,000–$10,000), often lower with an HTRA stipend<\/td><\/tr>\n            <tr><td class=\"tl\">India (private institutes)<\/td><td>2 years<\/td><td>₹8–20 lakh (roughly $10,000–$24,000)<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to find accurate numbers<\/div>\n        <p>Every US university publishes a Cost of Attendance (CoA) page under the financial aid or bursar section. This breaks down tuition, fees, health insurance, and estimated living costs. Always use the international student figure, not the domestic one.<\/p>\n        <p>Search: <em>[university name] cost of attendance international students.<\/em> For living costs, cross-reference with Numbeo (numbeo.com) for the specific city. The relevant question is not just total cost but expected salary return — model both numbers before committing.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Public vs private universities<\/h2>\n      <p>This distinction shows up differently in every region — in the US it is mainly a cost-vs-brand tradeoff; in India it also determines the admission process; in Canada, the UK, and continental Europe, the large majority of strong CS programmes are public and the distinction barely applies.<\/p>\n      <div class=\"card-grid\">\n        <div class=\"card\">\n          <div class=\"card-label\">US Public<\/div>\n          <h4>Lower cost, strong outcomes<\/h4>\n          <p>Georgia Tech, UCSD, UT Austin, UW, UIUC, UCLA. Georgia Tech's MSCS is among the best-valued CS programmes in the US. Comparable or better placement than many private schools at a significantly lower price.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">US Private<\/div>\n          <h4>Higher cost, strong brand<\/h4>\n          <p>CMU, Stanford, Columbia, Cornell. Carry significant brand recognition. Not consistently better than strong public universities for CS placement. Columbia and Cornell Tech are the most relevant for CS master's specifically.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">European Public<\/div>\n          <h4>Very low cost, world-class<\/h4>\n          <p>TU Munich, KTH, TU Delft, ETH Zurich, EPFL. Minimal or no tuition for international students. Not consolation options — several rank among the best CS programmes in the world.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">India Public<\/div>\n          <h4>Lowest cost, exam-based entry<\/h4>\n          <p>IITs, IISc, NITs. Government-subsidised tuition, HTRA stipends available for qualifying M.Tech/research students, but admission runs through GATE/JAM rank rather than a holistic application.<\/p>\n        <\/div>\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">India Private<\/div>\n          <h4>Higher cost than public, more flexible entry<\/h4>\n          <p>BITS Pilani, IIIT Hyderabad, IIIT Delhi. Fees are higher than at public institutes but still far below international tuition. Admission processes are more varied and, in some cases, more holistic.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Teaching and Research Assistantships<\/h2>\n      <p>TA and RA positions are available to master's students at most US and Canadian universities (both public and private), and an equivalent HTRA structure exists for qualifying M.Tech students at Indian public institutes. They are more commonly awarded to PhD students but are not out of reach for motivated master's students. As noted on the Location page, UK programmes are the exception — funded positions there are scarcer and less automatic, at both master's and PhD level, regardless of whether the university is public or private.<\/p>\n      <div class=\"data-rows\">\n        <div class=\"data-row\">\n          <div class=\"data-key\">What they provide<\/div>\n          <div class=\"data-val\">Tuition waiver plus a stipend of $18,000–$28,000/year in the US/Canada (or, in India, a tuition waiver plus a monthly HTRA stipend), in exchange for 15–20 hours of work per week.<\/div>\n        <\/div>\n        <div class=\"data-row\">\n          <div class=\"data-key\">TA work<\/div>\n          <div class=\"data-val\">Grading assignments, running office hours, leading lab or discussion sections for undergraduate courses.<\/div>\n        <\/div>\n        <div class=\"data-row\">\n          <div class=\"data-key\">RA work<\/div>\n          <div class=\"data-val\">Research in a faculty lab. Requires establishing a relationship with a professor before or immediately after arriving at the programme.<\/div>\n        <\/div>\n        <div class=\"data-row\">\n          <div class=\"data-key\">Availability<\/div>\n          <div class=\"data-val\">Competitive and not guaranteed at admission. Students with prior research experience who contact faculty early are better positioned.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to find TA/RA opportunities<\/div>\n        <ul>\n          <li>Check the department's graduate funding page — some programmes list TA availability explicitly for incoming students. For Indian public institutes, HTRA eligibility rules are usually published on the department's M.Tech admissions page.<\/li>\n          <li>After admission, email the department's graduate coordinator asking about TA openings for the incoming cohort. This is normal and expected.<\/li>\n          <li>For RA positions: identify faculty whose research interests you before you arrive. Email them in the summer before your programme starts — reference a specific paper of theirs, explain your background, and ask whether they have openings for funded research students.<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"warn-block\">\n        <div class=\"warn-icon\">→<\/div>\n        <p>A cold email that references a professor's specific recent work and asks a genuine research question gets responses. A generic \"I am interested in your research\" email does not.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>University funding opportunities<\/h2>\n      <p>Many universities offer merit-based scholarships, fellowships, and need-based grants specifically for international students — separate from TA/RA positions. These are worth checking for every programme on your list before you assume a programme is unaffordable. Public and private universities both run these schemes, though private universities with larger endowments (mainly in the US) sometimes have more generous need-based aid available.<\/p>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to find university funding<\/div>\n        <ul>\n          <li>Go to the programme's financial aid or graduate funding page. Search: <em>[university name] graduate funding international students<\/em> or <em>[programme name] scholarships.<\/em><\/li>\n          <li>Check the university's central graduate school website — many maintain fellowship databases that cover all departments.<\/li>\n          <li>Look at the admissions FAQ for the specific programme. Funding for admitted students is sometimes listed there.<\/li>\n          <li>After receiving an offer, email the graduate admissions coordinator and ask directly whether merit scholarships or fellowships are available to incoming international students. Departments sometimes have discretionary funds not publicly advertised.<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(1)\">← Location<\/button>\n    <span class=\"page-label\">02 / 05<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(3)\">Next: Programme →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 3: PROGRAMME -->\n<div class=\"page\" id=\"page-3\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 03 — Programme<\/div>\n    <h1>Evaluating a<br><em>programme<\/em><\/h1>\n    <p class=\"hero-lead\">Four things matter: the faculty in your area, where graduates actually go, PhD outcomes if that path is relevant, and whether the programme's alumni are doing what you want to do.<\/p>\n  <\/div>\n  <div class=\"content\">\n\n    <div class=\"section-block\">\n      <h2>Faculty and labs<\/h2>\n      <p>For research-oriented programmes or programmes you plan to use as a PhD bridge, faculty are the most important factor — this applies equally whether the institution is public or private. A prestigious programme with no faculty working in your area is the wrong programme for you.<\/p>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to find relevant faculty<\/div>\n        <ul>\n          <li>Go to the CS department website and navigate to the faculty directory. Most departments list faculty by research area — filter for your area of interest.<\/li>\n          <li>Click through to individual faculty pages. Look for: recent publications (last 2–3 years), an active lab page with current students, and a research description that matches your interests.<\/li>\n          <li>Cross-reference on Google Scholar (scholar.google.com) to check their publication record and recent activity. A faculty member with no recent publications may be on sabbatical, leaving the institution, or no longer active in research.<\/li>\n          <li>Use CSRankings.org — it shows faculty by publication output at top conferences and lets you filter by sub-field. A programme that ranks highly overall in AI but has only one active ML faculty member may not serve you as well as a lower-ranked programme with five active researchers in your area. This works for Indian public institutes (IITs, IISc) too, alongside US, UK, Canadian, and European ones.<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to cold email a professor<\/div>\n        <p>Cold emailing faculty is normal and expected, particularly for research-oriented programmes, and applies just as much at Indian public/private institutes as it does abroad.<\/p>\n        <ul>\n          <li><strong>Include:<\/strong> one sentence on your background, a specific reference to their recent work by name, a concrete question about their research or whether they are accepting master's students, and your CV.<\/li>\n          <li><strong>Do not include:<\/strong> long descriptions of your achievements, generic statements about being passionate about the field, or requests for admission advice. Faculty do not control admissions.<\/li>\n          <li><strong>Timing:<\/strong> September–November, before the application season peaks. One follow-up after two weeks of no response is appropriate.<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Placement outcomes<\/h2>\n      <p>Placement data tells you where graduates actually go — not where the brochure says they go. This is the single most useful piece of information about whether a programme suits your specific goal.<\/p>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to find placement data<\/div>\n        <ul>\n          <li>Search: <em>[programme name] alumni outcomes<\/em> or <em>[programme name] career report.<\/em> Some programmes publish this officially. Indian public institutes (IITs, IISc, NITs) also publish formal, department-wise placement reports each year — search <em>[institute name] M.Tech placement report<\/em> directly.<\/li>\n          <li>Most don't. In that case, go to LinkedIn. Search for the university name in the Education filter, add the degree type, and filter by graduation year (last 3–4 years). Look at where graduates work now, in what roles, and in what cities.<\/li>\n          <li>Use the LinkedIn Alumni tool on the university's LinkedIn page — it shows aggregate data on where graduates work, what they do, and where they are located.<\/li>\n          <li>If you cannot find data through either route, message a current student or recent graduate directly on LinkedIn. Explain you are researching the programme and ask about placement outcomes. Most respond when approached with a specific question.<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"warn-block\">\n        <div class=\"warn-icon\">→<\/div>\n        <p>Programmes that cannot or will not share placement data are a red flag. Aggregated statistics without role-level detail (\"90% employed within 6 months\") tell you almost nothing useful.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>PhD outcomes<\/h2>\n      <p>If you plan to use an MS as a bridge to a PhD application, check where graduates from the programme go on to do their PhDs. A research MS at UMass, UWaterloo, or UofT regularly places graduates into PhD programmes at top US schools. A coursework MS at a mid-ranked programme may not have the same research culture or faculty connections to support that pathway. This is true for Indian public institutes as well — an M.Tech or dual-degree at an IIT or IISc with genuine research output can be a strong PhD bridge, but this varies a lot by specific lab and advisor.<\/p>\n      <div class=\"warn-block\">\n        <div class=\"warn-icon\">→<\/div>\n        <p>Remember the funding asymmetry from the Location page when comparing PhD paths: in the US, PhD admission is normally bundled with guaranteed TA/RA funding for the full programme. In the UK, fully funded PhD places are comparatively rare and often awarded separately and competitively (UKRI studentships, specific grants) rather than guaranteed with admission — factor this in before assuming a UK PhD offer includes funding.<\/p>\n      <\/div>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to find this<\/div>\n        <ul>\n          <li>LinkedIn search as above, filtered for graduates who list \"PhD student\" or \"PhD candidate\" as their current role.<\/li>\n          <li>Email a current student directly and ask: \"What percentage of students from this programme go on to PhD programmes, and at which schools?\"<\/li>\n          <li>Look at faculty lab pages at top PhD programmes — if multiple current PhD students list this MS in their background, that is a meaningful signal.<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Mapping alumni to your target outcome<\/h2>\n      <p>The most useful exercise before finalising your list: find 5–10 people currently in the role you want 3 years from now and look at where they did their master's. This is more informative than any ranking.<\/p>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to do this on LinkedIn<\/div>\n        <ul>\n          <li>Search for the job title you want (e.g. \"Machine Learning Engineer
