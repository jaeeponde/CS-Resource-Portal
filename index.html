ss=\"pull-quote\">\n        <p>\"Talk to people who changed their minds — the PhD student who left after two years, the engineer who went back to do a master's at 27. Their reasoning is more useful than the success stories.\"<\/p>\n      <\/div>\n      <p>The most honest information about any of these paths comes from people who took them and reconsidered. Seek out those conversations. They are rarely on a university's website or an alumni panel.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(6)\">← Back<\/button>\n    <span class=\"page-label\">07 / 07<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(0)\">Back to contents<\/button>\n  <\/div>\n  <div class=\"disclaimer\">This resource is maintained by the Ashoka University Post Graduate Office. Content does not constitute professional career advice.<\/div>\n<\/div>\n\n<script>\n// ============ NAVIGATION ============\nconst TOTAL_PAGES = 8;\nlet currentPage = 0;\n\nfunction buildNav() {\n  const container = document.getElementById('navDots');\n  container.innerHTML = '<span onclick=\"goTo(Math.max(0, 0))\" style=\"font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:0.06em;cursor:pointer;margin-right:10px;\"> HOME <\/span>';\n  const labels = ['Map','AI/ML','Systems','Theory','Human-Centred','Interdisciplinary','Robotics','T1: AI vs Systems','T2: Theory vs ML','T3: Broad vs Niche','T4: Degree vs MSCS'];\n  for (let i = 0; i < TOTAL_PAGES; i++) {\n    const dot = document.createElement('div');\n    dot.className = 'nav-dot' + (i === currentPage ? ' active' : (i < currentPage ? ' visited' : ''));\n    dot.onclick = () => goTo(i);\n    dot.title = labels[i];\n    container.appendChild(dot);\n  }\n}\n\n\nfunction goTo(n) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.getElementById('page-' + n).classList.add('active');\n  currentPage = n;\n  buildNav();\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n  if (n === 4) initQuiz();\n}\n\nbuildNav();\n\n// ============ DECISION TOOL ============\nconst questions = [\n  {\n    category: \"Research exposure\",\n    categoryClass: \"cat-research\",\n    text: \"How much research experience do you have so far?\",\n    note: \"Be honest — course projects don't count as research unless you produced something original.\",\n    options: [\n      { text: \"I've done independent research — read papers, formed a hypothesis, produced a result (even a negative one)\", value: { phd: 4, ms_research: 2 } },\n      { text: \"I've assisted a faculty member or lab — running experiments, reviewing literature, writing code for a research project\", value: { phd: 2, ms_research: 3, ms_course: 1 } },\n      { text: \"I've done a course project with a research flavour — but nothing independently initiated\", value: { ms_research: 2, ms_course: 1 } },\n      { text: \"My experience is mostly coursework and personal/engineering projects\", value: { job: 2, ms_course: 2 } }\n    ]\n  },\n  {\n    category: \"Faculty collaboration\",\n    categoryClass: \"cat-research\",\n    text: \"Have you worked with a professor or researcher in a substantive capacity?\",\n    note: \"This includes RA positions, independent study, or co-authoring anything — not just taking their class.\",\n    options: [\n      { text: \"Yes — I've co-authored or significantly contributed to a paper, report, or research project under faculty supervision\", value: { phd: 4, ms_research: 3 } },\n      { text: \"Yes — I've worked as an RA or in an independent study, but nothing has been published or formally written up\", value: { phd: 2, ms_research: 3 } },\n      { text: \"I've had research conversations with professors and they know my work, but no formal collaboration\", value: { ms_research: 2, phd: 1 } },\n      { text: \"Not really — my relationship with faculty has mostly been as a student in their courses\", value: { job: 1, ms_course: 2 } }\n    ]\n  },\n  {\n    category: \"Problem clarity\",\n    categoryClass: \"cat-fit\",\n    text: \"Do you have a specific research problem or area you want to work on?\",\n    note: \"\\\"I'm interested in AI\\\" is not a problem statement. A problem statement has a gap, a why, and something to test.\",\n    options: [\n      { text: \"Yes — I can describe a specific open problem, why it matters, and a plausible approach to it\", value: { phd: 5, ms_research: 2 } },\n      { text: \"I have a research area I'm excited about and have read papers in, but not a defined problem yet\", value: { phd: 2, ms_research: 3 } },\n      { text: \"I have broad interests (ML, systems, HCI, etc.) but haven't gone deep enough to identify gaps\", value: { ms_course: 2, ms_research: 2 } },\n      { text: \"I don't have a research focus — I'm more interested in building and shipping things\", value: { job: 3, ms_course: 1 } }\n    ]\n  },\n  {\n    category: \"Work preference\",\n    categoryClass: \"cat-fit\",\n    text: \"When you're at your most engaged working on something, what does that work look like?\",\n    options: [\n      { text: \"Reading, experimenting, thinking — trying to understand something nobody fully understands yet\", value: { phd: 3, ms_research: 2 } },\n      { text: \"Learning a new technical area deeply through structured coursework and challenging problem sets\", value: { ms_course: 3 } },\n      { text: \"Building a system, shipping it, seeing it handle real traffic or real users\", value: { job: 3, ms_course: 1 } },\n      { text: \"Moving fast across different problems — prototyping, iterating, pivoting\", value: { job: 3 } }\n    ]\n  },\n  {\n    category: \"Uncertainty tolerance\",\n    categoryClass: \"cat-fit\",\n    text: \"Your experiment has been failing for three months. No clear reason. Your advisor is supportive but can't diagnose it either. How do you respond?\",\n    note: \"This is not hypothetical — this is a routine part of a PhD.\",\n    options: [\n      { text: \"I'd dig in harder — failure modes are often where the interesting findings are\", value: { phd: 4 } },\n      { text: \"I'd manage, but I'd need check-ins and structure to stay functional\", value: { ms_research: 2, phd: 1 } },\n      { text: \"I'd start questioning whether I'm in the right place — I need more regular progress signals\", value: { ms_course: 2, job: 1 } },\n      { text: \"That honestly sounds unsustainable for me — I need feedback loops and defined goals\", value: { job: 2, ms_course: 2 } }\n    ]\n  },\n  {\n    category: \"Application readiness\",\n    categoryClass: \"cat-practical\",\n    text: \"If you were applying to PhD programmes right now, how strong is your profile?\",\n    note: \"PhD admissions are competitive. Strong profiles have: research output, strong LoRs from researchers who know your work, and a clear SOP.\",\n    options: [\n      { text: \"Strong — I have research output, at least one strong LoR from a research supervisor, and a clear SOP I could write\", value: { phd: 4, ms_research: 2 } },\n      { text: \"Developing — I have some research experience and good LoRs but my output isn't publication-level yet\", value: { ms_research: 3, phd: 1 } },\n      { text: \"Weak for PhD — my profile is strong for industry or a coursework MS but I haven't done meaningful research\", value: { job: 2, ms_course: 3 } },\n      { text: \"I honestly don't know what a competitive PhD application looks like\", value: { ms_course: 1, job: 1 } }\n    ]\n  },\n  {\n    category: \"Career signal\",\n    categoryClass: \"cat-practical\",\n    text: \"What role do you actually want to be doing in 6 years?\",\n    options: [\n      { text: \"Faculty, research scientist, or a frontier AI research role that requires a PhD\", value: { phd: 5 } },\n      { text: \"Research engineer or applied ML engineer at a strong lab or company — PhD preferred but not required\", value: { phd: 2, ms_research: 3, ms_course: 1 } },\n      { text: \"Senior/staff SWE, ML engineer, or tech lead at a product company in India or abroad\", value: { ms_course: 2, job: 2 } },\n      { text: \"Founder, early-stage engineer, or PM at a startup — I want to move and build fast\", value: { job: 4 } }\n    ]\n  },\n  {\n    category: \"Financial situation\",\n    categoryClass: \"cat-practical\",\n    text: \"What's your honest financial position heading out of Ashoka?\",\n    note: \"A self-funded US coursework MS costs ₹75L–1.1Cr all-in. A PhD is funded. A job starts earning immediately.\",\n    options: [\n      { text: \"I need to start earning — debt or a multi-year delay isn't feasible for me or my family\", value: { job: 4 } },\n      { text: \"I can take on loans for the right opportunity if the ROI is clear\", value: { ms_course: 3 } },\n      { text: \"I'm okay with a stipend (₹30–50K/month or $25–35K/year) if the work is meaningful\", value: { phd: 3, ms_research: 2 } },\n      { text: \"I have family support and genuine flexibility — money isn't the main constraint\", value: { phd: 2, ms_course: 2, ms_research: 1 } }\n    ]\n  },\n  {\n    category: \"Self-knowledge\",\n    categoryClass: \"cat-fit\",\n    text: \"Why are you considering higher education at all?\",\n    note: \"Pick the one that most honestly reflects your primary motivation.\",\n    options: [\n      { text: \"There are specific problems I want to spend years on — higher education is the right structure for that\", value: { phd: 4, ms_research: 2 } },\n      { text: \"I want to specialise in an area where depth genuinely matters for the roles I want\", value: { ms_course: 3, ms_research: 1 } },\n      { text: \"I want to work abroad and the MS is the most realistic route\", value: { ms_course: 4 } },\n      { text: \"I'm not sure what to do next and higher ed feels like a safer path than the job market\", value: { job: 3 } }\n    ]\n  },\n  {\n    category: \"Research reading\",\n    categoryClass: \"cat-research\",\n    text: \"When did you last read a research paper outside of a course requirement — and what happened?\",\n    options: [\n      { text: \"Recently, and I ended up going deep — following citations, testing ideas, wanting to build on it\", value: { phd: 4, ms_research: 2 } },\n      { text: \"I've read papers to understand tools and techniques I wanted to use in projects\", value: { ms_course: 2, ms_research: 1, job: 1 } },\n      { text: \"I've skimmed papers but haven't found myself genuinely pulled into the research\", value: { ms_course: 1, job: 1 } },\n      { text: \"I don't really seek out research papers — I learn better from documentation, tutorials, and building\", value: { job: 3 } }\n    ]\n  }\n];\n\nconst pathMeta = {\n  job:         { name: \"Direct employment\",       sub: \"Join the workforce after graduation\",      color: \"#6c63ff\", fillClass: \"fill-job\",         headerClass: \"path-job\" },\n  ms_course:   { name: \"Coursework MS\",           sub: \"A taught programme to deepen specialisation\", color: \"#e67e22\", fillClass: \"fill-ms_course\",   headerClass: \"path-ms_course\" },\n  ms_research: { name: \"Research MS / MTech\",     sub: \"Thesis-based — tests research fit\",        color: \"#1a7a6e\", fillClass: \"fill-ms_research\",  headerClass: \"path-ms_research\" },\n  phd:         { name: \"PhD\",                     sub: \"A research degree — 4 to 6 years\",         color: \"#c0392b\", fillClass: \"fill-phd\",          headerClass: \"path-phd\" }\n};\n\nconst pathResults = {\n  job: {\n    explanation: \"Your answers consistently point toward direct employment. This isn't a consolation — in CS, two focused years in industry will compound in ways that most coursework master's programmes can't match. You'll ship real code, work in teams, handle production systems, and build a network of peers who are doing the same. The students who thrive in industry straight out of undergrad are the ones who know what they want to build, not necessarily what they want to study. That profile fits what you described.\",\n    caveats: [\n      \"If you're choosing industry because you're unsure what else to do, treat it as a 2-year experiment — not a permanent decision. Many strong engineers go back for a research MS or PhD at 25–27.\",\n      \"The door to graduate school doesn't close. Coming back with 2 years of strong engineering experience makes your PhD or MS application meaningfully stronger.\",\n      \"If you eventually want research-adjacent roles (ML engineering, applied research), plan your job search to put you close to those domains now — not after 5 years in unrelated engineering.\"\n    ],\n    tests: [\n      \"Apply to companies where you'll work on problems you'd want to study further — AI/ML teams, systems infra, or wherever your interests actually are\",\n      \"Find a senior engineer in your first job who you'd want to be in 3 years, and figure out how they got there\",\n      \"Set a 2-year checkpoint: are you learning as fast as you would in a graduate programme? If not, that's information\"\n    ]\n  },\n  ms_course: {\n    explanation: \"A coursework MS looks like the right fit based on what you've described. You want to go deeper in a technical area, you value structure and clear milestones, and you're thinking about roles or geographies where the credential genuinely moves the needle. That's a coherent case. The key question now is: which programme, and is the financial case real? A strong MS placement into roles you actually want, at a salary that offsets the cost within a few years, is the benchmark to hold programmes to.\",\n    caveats: [\n      \"The difference between a top-10 and a mid-ranked MS programme in industry outcomes is significant. Do not pay CMU prices for a programme without CMU placement outcomes.\",\n      \"A coursework MS in India (IIT, BITS) is dramatically cheaper and still competitive for Indian industry roles. If your goal is working in India, don't default to a US programme.\",\n      \"OPT (Optional Practical Training) gives F-1 students 1–3 years of US work authorisation — this is real value that often isn't priced into the ROI calculation.\"\n    ],\n    tests: [\n      \"Research the specific placement outcomes of every programme you're considering — median salary, companies, roles, not just aggregated rankings\",\n      \"Talk to at least one person who graduated in the last 18 months, not someone with a polished LinkedIn post — ask whether they'd do it again\",\n      \"Audit one graduate-level course online (Stanford CS229, MIT 6.824) for 4–6 weeks to verify the pace and depth energise rather than drain you\"\n    ]\n  },\n  ms_research: {\n    explanation: \"A research master's — whether at IISc, an IIT, or a foreign programme — makes sense as your next step. You have research instincts and some exposure, but you're not yet at the point where a PhD application is competitive or where you're certain enough to commit 5 years. A research MS is the right way to find out. You'll produce a thesis, work closely with an advisor, and in 2 years you'll know whether you want more or whether you're ready for industry. Either outcome is legitimate and both are common.\",\n    caveats: [\n      \"Your advisor in a research MS matters almost as much as it does in a PhD. Research their publication history, how their current students describe them, and what their students do after graduating.\",\n      \"A research MS does not automatically become a PhD. In many Indian programmes, the transition requires a separate application or departmental approval — clarify this before you enroll.\",\n      \"If you're considering IISc or IIT research programmes, the GATE score is often a formal requirement. Start preparing now if you haven't.\"\n    ],\n    tests: [\n      \"Approach an Ashoka faculty member whose research interests you and ask for a semester-long RA position — treat this as your proof of concept before applying\",\n      \"Read 5 recent papers in the area you'd want to research, not to understand them fully, but to see if the questions interest you when they're real and specific\",\n      \"Write a draft research statement (one page) articulating what you want to study and why — the difficulty of writing it tells you something honest about your readiness\"\n    ]\n  },\n  phd: {\n    explanation: \"Your profile and answers suggest you have the foundational conditions for a PhD: genuine research exposure, comfort with open-ended problems, a specific intellectual direction, and realistic expectations about what the process involves. The strongest PhD applicants are not always the highest scorers — they're the people who have worked in a research environment and want more of it. If that describes you, the next step is not deciding whether to do a PhD, but identifying the right programme and advisor.\",\n    caveats: [\n      \"A PhD application lives or dies on your letters of recommendation from research supervisors. If you don't have at least one strong LoR from someone who has seen you do research, your application will struggle regardless of your GPA or GRE.\",\n      \"Advisor fit is more important than programme ranking. A well-matched advisor at a strong second-tier school will produce better outcomes than a mismatched one at a top-5 programme. Research specific people, not just institutions.\",\n      \"Be honest about your SOP. Admissions committees read thousands of them. Generic statements about 'passion for AI' are discarded quickly. A specific research question you want to answer, and why you're the person to answer it, is what gets read.\"\n    ],\n    tests: [\n      \"Identify 3–5 faculty members at programmes you're considering — read their last 5 papers and cold-email the one whose work most overlaps with yours, with a specific question or observation\",\n      \"Try to reproduce a result from a recent paper in your area of interest — this is as close to first-year PhD work as you can get without enrolling\",\n      \"Ask a current PhD student (in year 3 or 4, not year 1) to be honest with you about what their week looks like and what they wish they'd known before starting\"\n    ]\n  }\n};\n\nlet answers = new Array(questions.length).fill(null);\nlet currentQ = 0;\n\nfunction initQuiz() {\n  answers = new Array(questions.length).fill(null);\n  currentQ = 0;\n  renderQuestion();\n}\n\nfunction getScores() {\n  const scores = { job: 0, ms_course: 0, ms_research: 0, phd: 0 };\n  answers.forEach((ansIdx, qIdx) => {\n    if (ansIdx === null) return;\n    const vals = questions[qIdx].options[ansIdx].value;\n    Object.entries(vals).forEach(([k, v]) => { scores[k] += v; });\n  });\n  return scores;\n}\n\nfunction renderQuestion() {\n  const pct = Math.round((currentQ / questions.length) * 100);\n  document.getElementById('quizProgress').style.width = pct + '%';\n  document.getElementById('progressLeft').textContent = 'Question ' + (currentQ + 1) + ' of ' + questions.length;\n  document.getElementById('progressRight').textContent = pct + '% complete';\n\n  const q = questions[currentQ];\n  const answeredSoFar = answers.filter(a => a !== null).length;\n  const scores = getScores();\n  const maxScore = Math.max(...Object.values(scores), 1);\n\n  let scorePeekHTML = '';\n  if (answeredSoFar >= 3) {\n    scorePeekHTML = '<div class=\"score-peek\"><div class=\"score-peek-label\">Live signal — updates as you answer<\/div>' +\n      Object.entries(pathMeta).map(function(entry) {\n        var k = entry[0], m = entry[1];\n        return '<div class=\"score-bar-row\"><div class=\"score-bar-name\">' + m.name + '<\/div><div class=\"score-bar-track\"><div class=\"score-bar-fill ' + m.fillClass + '\" style=\"width:' + Math.round((scores[k] / maxScore) * 100) + '%\"><\/div><\/div><div class=\"score-bar-val\">' + scores[k] + '<\/div><\/div>';\n      }).join('') + '<\/div>';\n  }\n\n  document.getElementById('quizContent').innerHTML =\n    '<div class=\"question-block\">' +\n    '<div class=\"question-context ' + q.categoryClass + '\">' + q.category + '<\/div>' +\n    '<div class=\"question-text\">' + q.text + '<\/div>' +\n    (q.note ? '<div class=\"question-note\">' + q.note + '<\/div>' : '') +\n    '<div class=\"options-list\">' +\n    q.options.map(function(opt, i) {\n      return '<button class=\"option-btn ' + (answers[currentQ] === i ? 'selected' : '') + '\" onclick=\"selectOption(' + i + ')\">' +\n        '<span class=\"option-tag\">' + String.fromCharCode(65 + i) + '<\/span>' +\n        '<span>' + opt.text + '<\/span><\/button>';\n    }).join('') +\n    '<\/div>' +\n    '<div class=\"q-nav\">' +\n    '<button class=\"btn\" onclick=\"prevQ()\" ' + (currentQ === 0 ? 'disabled' : '') + '>← Back<\/button>' +\n    '<button class=\"btn primary\" onclick=\"nextQ()\" ' + (answers[currentQ] === null ? 'disabled' : '') + '>' + (currentQ === questions.length - 1 ? 'See my result →' : 'Next →') + '<\/button>' +\n    '<\/div>' +\n    scorePeekHTML +\n    '<\/div>';\n}\n\nfunction selectOption(i) {\n  answers[currentQ] = i;\n  renderQuestion();\n}\n\nfunction nextQ() {\n  if (answers[currentQ] === null) return;\n  if (currentQ < questions.length - 1) { currentQ++; renderQuestion(); }\n  else showResult();\n}\n\nfunction prevQ() {\n  if (currentQ > 0) { currentQ--; renderQuestion(); }\n}\n\nfunction showResult() {\n  document.getElementById('quizProgress').style.width = '100%';\n  document.getElementById('progressLeft').textContent = 'Complete';\n  document.getElementById('progressRight').textContent = '100% complete';\n\n  const scores = getScores();\n  const total = Object.values(scores).reduce(function(a, b) { return a + b; }, 0);\n  const sorted = Object.entries(scores).sort(function(a, b) { return b[1] - a[1]; });\n  const winner = sorted[0][0];\n  const winScore = sorted[0][1];\n  const confidence = Math.round((winScore / Math.max(total, 1)) * 100);\n  const confLabel = confidence >= 55 ? 'Strong signal' : confidence >= 38 ? 'Moderate signal' : 'Mixed signal — worth exploring multiple paths';\n\n  const info = pathResults[winner];\n  const meta = pathMeta[winner];\n  const maxScore = sorted[0][1];\n\n  document.getElementById('quizContent').innerHTML =\n    '<div class=\"result-block\">' +\n    '<div class=\"result-header ' + meta.headerClass + '\">' +\n    '<div class=\"result-path-label\">Suggested path<\/div>' +\n    '<div class=\"result-path-name\">' + meta.name + '<\/div>' +\n    '<div class=\"result-path-sub\">' + meta.sub + '<\/div>' +\n    '<div class=\"confidence-row\"><div class=\"confidence-track\"><div class=\"confidence-fill\" id=\"confFill\" style=\"width:0%\"><\/div><\/div>' +\n    '<div class=\"confidence-text\">' + confLabel + '<\/div><\/div><\/div>' +\n\n    '<div class=\"result-section\"><div class=\"result-section-label\">Why this path fits your answers<\/div>' +\n    '<div class=\"result-explanation\">' + info.explanation + '<\/div><\/div>' +\n\n    '<div class=\"result-section\"><div class=\"result-section-label\">Score breakdown<\/div>' +\n    '<div class=\"breakdown-grid\">' +\n    sorted.map(function(entry) {\n      var k = entry[0], v = entry[1];\n      return '<div class=\"breakdown-item ' + (k === winner ? 'winner' : '') + '\">' +\n        '<div class=\"breakdown-name\">' + pathMeta[k].name + '<\/div>' +\n        '<div class=\"breakdown-bar-track\"><div class=\"breakdown-bar-fill ' + pathMeta[k].fillClass + '\" style=\"width:' + Math.round((v / Math.max(maxScore, 1)) * 100) + '%\"><\/div><\/div>' +\n        '<div class=\"breakdown-pct\">' + v + ' pts · ' + Math.round((v / Math.max(total, 1)) * 100) + '% of total<\/div><\/div>';\n    }).join('') +\n    '<\/div><\/div>' +\n\n    '<div class=\"result-section\"><div class=\"result-section-label\">Things to be honest with yourself about<\/div>' +\n    '<ul class=\"caveat-list\">' + info.caveats.map(function(c) { return '<li>' + c + '<\/li>'; }).join('') + '<\/ul><\/div>' +\n\n    '<div class=\"result-section\"><div class=\"test-next-block\">' +\n    '<div class=\"test-next-label\">What to test next<\/div>' +\n    '<h3>Before you commit, do these<\/h3>' +\n    '<p>Low-stakes experiments that generate honest signal about your fit.<\/p>' +\n    '<ul class=\"test-next-list\">' + info.tests.map(function(t) { return '<li>' + t + '<\/li>'; }).join('') + '<\/ul>' +\n    '<\/div><\/div>' +\n\n    '<div class=\"result-actions\">' +\n    '<button class=\"btn\" onclick=\"initQuiz()\">Retake quiz<\/button>' +\n    '<button class=\"btn primary\" onclick=\"goTo(5)\">Continue: Opportunity cost →<\/button>' +\n    '<\/div><\/div>';\n\n  setTimeout(function() {\n    var el = document.getElementById('confFill');\n    if (el) el.style.width = confidence + '%';\n  }, 150);\n}\n\ninitQuiz();\n<\/script>\n<style>\n.pg-home{display:none;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:none;border:1px solid var(--rule);padding:.4rem .75rem;cursor:pointer;white-space:nowrap}\n.pg-home:hover{color:var(--accent);border-color:var(--accent)}\n.pg-home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\nbody.on-sub .pg-home{display:inline-flex}\nbody.on-sub nav .nav-brand{display:none}\n<\/style>\n<script>(function(){\nvar nav=document.querySelector('nav');if(!nav||typeof goTo!=='function')return;\nvar b=document.createElement('button');b.type='button';b.className='pg-home';b.textContent='\\u2190 Contents';\nb.title='Back to the start of this section';b.onclick=function(){goTo(0)};nav.insertBefore(b,nav.firstChild);\nfunction sync(){var a=document.querySelector('.page.active');var sub=!!a&&a.id!=='page-0';\n if(document.body.classList.contains('on-sub')!==sub)document.body.classList.toggle('on-sub',sub);}\nnew MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});sync();\nwindow.addEventListener('message',function(e){if(e.data==='pg-home')goTo(0)});\n})();<\/script>\n<\/body>\n<\/html>"}, {"id": "degree", "title": "What degree should I pursue?", "short": "Which degree?", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>What Degree Should I Pursue? — Ashoka CS<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --ink: #1a1a1a;\n    --ink-2: #444;\n    --ink-3: #888;\n    --paper: #faf8f3;\n    --paper-2: #f2efe8;\n    --paper-3: #e8e4da;\n    --accent: #c0392b;\n    --accent-2: #e67e22;\n    --teal: #1a7a6e;\n    --teal-light: #e8f5f3;\n    --rule: #ddd9d0;\n    --serif: 'DM Serif Display', Georgia, serif;\n    --sans: 'DM Sans', sans-serif;\n    --mono: 'DM Mono', monospace;\n  }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  body {\n    font-family: var(--sans);\n    background: var(--paper);\n    color: var(--ink);\n    min-height: 100vh;\n    font-size: 16px;\n    line-height: 1.7;\n  }\n\n  /* NAV */\n  nav {\n    position: fixed; top: 0; left: 0; right: 0;\n    background: var(--paper);\n    border-bottom: 1px solid var(--rule);\n    z-index: 100;\n    padding: 0 2rem;\n    height: 56px;\n    display: flex; align-items: center; justify-content: space-between;\n  }\n  .nav-brand { font-family: var(--mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }\n  .nav-brand span { color: var(--accent); }\n  .nav-progress { display: flex; gap: 6px; align-items: center; }\n  .nav-dot {\n    width: 6px; height: 6px; border-radius: 50%;\n    background: var(--paper-3); cursor: pointer;\n    transition: background 0.2s, transform 0.2s;\n  }\n  .nav-dot.active { background: var(--accent); transform: scale(1.4); }\n  .nav-dot.visited { background: var(--ink-3); }\n\n  /* PAGES */\n  .page { display: none; min-height: 100vh; padding-top: 56px; animation: fadeIn 0.35s ease; }\n  .page.active { display: block; }\n  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n\n  /* HERO */\n  .hero {\n    padding: 5rem 2rem 4rem;\n    max-width: 900px;\n    margin: 0 auto;\n    border-bottom: 1px solid var(--rule);\n  }\n  .hero-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; }\n  .hero h1 { font-family: var(--serif); font-size: clamp(2.2rem, 4.5vw, 3.6rem); line-height: 1.15; color: var(--ink); margin-bottom: 1.4rem; font-weight: 400; }\n  .hero h1 em { font-style: italic; color: var(--accent); }\n  .hero-lead { font-size: 1.05rem; color: var(--ink-2); max-width: 580px; line-height: 1.75; }\n\n  /* CONTENT */\n  .content { max-width: 900px; margin: 0 auto; padding: 3rem 2rem 6rem; }\n\n  .section-block { margin-bottom: 3.5rem; }\n  .section-block h2 { font-family: var(--serif); font-size: 1.75rem; font-weight: 400; margin-bottom: 1rem; color: var(--ink); }\n  .section-block h3 { font-family: var(--sans); font-size: 0.9rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); margin-bottom: 0.6rem; margin-top: 2rem; }\n  .section-block p { color: var(--ink-2); margin-bottom: 1rem; }\n  .section-block p:last-child { margin-bottom: 0; }\n\n  /* PULL QUOTE */\n  .pull-quote { border-left: 3px solid var(--accent); padding: 1rem 1.5rem; margin: 2rem 0; background: var(--paper-2); }\n  .pull-quote p { font-family: var(--serif); font-size: 1.2rem; color: var(--ink); font-style: italic; margin: 0; }\n\n  /* CARDS */\n  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin: 1.5rem 0; }\n  .card { background: var(--paper-2); border: 1px solid var(--rule); padding: 1.25rem 1.25rem 1.5rem; }\n  .card-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.5rem; }\n  .card h4 { font-family: var(--serif); font-size: 1.1rem; font-weight: 400; margin-bottom: 0.5rem; color: var(--ink); }\n  .card p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.6; }\n  .card.accent-card { background: #fdf0ee; border-color: #e8bfba; }\n  .card.teal-card { background: var(--teal-light); border-color: #b3d8d4; }\n  .card.amber-card { background: #fef9ee; border-color: #f0d9a0; }\n\n  /* TIMELINE */\n  .timeline { position: relative; padding-left: 2rem; margin: 1.5rem 0; }\n  .timeline::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--rule); }\n  .timeline-item { position: relative; margin-bottom: 1.8rem; padding-left: 0.5rem; }\n  .timeline-item::before { content: ''; position: absolute; left: -2rem; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--ink-3); }\n  .timeline-item.highlight::before { background: var(--accent); border-color: var(--accent); }\n  .timeline-year { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; margin-bottom: 0.3rem; }\n  .timeline-item h4 { font-weight: 500; color: var(--ink); margin-bottom: 0.3rem; font-size: 0.95rem; }\n  .timeline-item p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.6; }\n\n  /* STAT ROW */\n  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 2rem 0; }\n  .stat-cell { background: var(--paper); padding: 1.25rem 1rem; text-align: center; }\n  .stat-number { font-family: var(--serif); font-size: 2rem; color: var(--ink); line-height: 1; margin-bottom: 0.3rem; }\n  .stat-number span { color: var(--accent); font-size: 1.3rem; }\n  .stat-label { font-size: 0.75rem; color: var(--ink-3); line-height: 1.4; }\n\n  /* DEGREE BADGE */\n  .degree-badge {\n    display: inline-block;\n    font-family: var(--mono);\n    font-size: 10px;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    padding: 0.3rem 0.7rem;\n    border: 1px solid var(--rule);\n    color: var(--ink-3);\n    margin-bottom: 1rem;\n  }\n\n  /* DATA ROW — for structured info */\n  .data-rows { border: 1px solid var(--rule); margin: 1.5rem 0; }\n  .data-row { display: grid; grid-template-columns: 160px 1fr; border-bottom: 1px solid var(--rule); }\n  .data-row:last-child { border-bottom: none; }\n  .data-key { padding: 0.85rem 1rem; background: var(--paper-2); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; display: flex; align-items: flex-start; padding-top: 1rem; }\n  .data-val { padding: 0.85rem 1.25rem; font-size: 0.9rem; color: var(--ink-2); line-height: 1.65; }\n  .data-val strong { color: var(--ink); font-weight: 500; }\n  @media (max-width: 560px) { .data-row { grid-template-columns: 1fr; } .data-key { border-bottom: 1px solid var(--rule); padding-bottom: 0.5rem; } }\n\n  /* TAG PILLS */\n  .tag { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.2rem 0.5rem; margin: 0.15rem; }\n  .tag-low { background: var(--teal-light); color: var(--teal); border: 1px solid #b3d8d4; }\n  .tag-mid { background: #fef9ee; color: #8a6300; border: 1px solid #f0d9a0; }\n  .tag-high { background: #fdf0ee; color: #a93226; border: 1px solid #e8bfba; }\n\n  /* COMPARISON TABLE */\n  .table-wrap { overflow-x: auto; margin: 2rem 0; -webkit-overflow-scrolling: touch; }\n  .compare-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; min-width: 820px; }\n  .compare-table th {\n    background: var(--ink); color: var(--paper);\n    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;\n    padding: 0.85rem 1rem; text-align: left; font-weight: 400; white-space: nowrap;\n  }\n  .compare-table th:first-child { min-width: 130px; }\n  .compare-table td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--rule); color: var(--ink-2); vertical-align: top; line-height: 1.55; }\n  .compare-table tr:nth-child(even) td { background: var(--paper-2); }\n  .compare-table tr:hover td { background: #f0ece3; }\n  .compare-table .row-label { font-weight: 500; color: var(--ink); font-size: 0.875rem; white-space: nowrap; }\n  .compare-table .clickable-row { cursor: pointer; }\n  .compare-table .clickable-row .row-label { color: var(--accent); text-decoration: none; }\n  .compare-table .clickable-row:hover .row-label { text-decoration: underline; }\n  .dep-low { color: var(--teal); font-weight: 500; }\n  .dep-mid { color: #8a6300; font-weight: 500; }\n  .dep-high { color: var(--accent); font-weight: 500; }\n\n  /* INDIA NOTE */\n  .india-note {\n    border: 1px solid var(--rule);\n    border-left: 3px solid var(--accent-2);\n    background: var(--paper-2);\n    padding: 1.25rem 1.5rem;\n    margin: 2.5rem 0 0;\n  }\n  .india-note-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 0.5rem; }\n  .india-note p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.65; }\n\n  /* EXIT OPTIONS */\n  .exit-block { border: 1px solid #b3d8d4; background: var(--teal-light); padding: 1.25rem 1.5rem; margin: 1.5rem 0; }\n  .exit-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); margin-bottom: 0.5rem; }\n  .exit-block p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.65; }\n\n  /* TOC */\n  .toc { margin: 2rem 0; }\n  .toc-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--rule); cursor: pointer; transition: color 0.15s; }\n  .toc-item:hover { color: var(--accent); }\n  .toc-item:hover .toc-arrow { opacity: 1; transform: translateX(4px); }\n  .toc-num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 2rem; }\n  .toc-title { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; flex: 1; }\n  .toc-meta { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; display: none; }\n  @media (min-width: 500px) { .toc-meta { display: block; } }\n  .toc-arrow { font-size: 1rem; color: var(--accent); opacity: 0; transition: opacity 0.15s, transform 0.15s; }\n\n  /* PAGE NAV */\n  .page-nav { max-width: 900px; margin: 0 auto; padding: 2rem 2rem 4rem; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; }\n  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 0.7rem 1.4rem; font-family: var(--sans); font-size: 0.875rem; font-weight: 500; cursor: pointer; border: 1px solid var(--ink); background: transparent; color: var(--ink); transition: background 0.15s, color 0.15s; letter-spacing: 0.01em; }\n  .btn:hover { background: var(--ink); color: var(--paper); }\n  .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }\n  .btn.primary:hover { background: #a93226; border-color: #a93226; }\n  .btn:disabled { opacity: 0.28; cursor: default; pointer-events: none; }\n  .page-label { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em; text-align: center; }\n\n  .disclaimer { background: var(--paper-2); border-top: 1px solid var(--rule); padding: 1rem 2rem; font-size: 0.8rem; color: var(--ink-3); text-align: center; line-height: 1.6; }\n\n  @media (max-width: 600px) { .stat-row { grid-template-columns: 1fr 1fr; } }\n<\/style>\n<\/head>\n<body>\n\n<nav>\n  <div class=\"nav-brand\">Ashoka University · <span>CS Higher Ed<\/span><\/div>\n  <div class=\"nav-progress\" id=\"navDots\"><\/div>\n<\/nav>\n\n<\!-- ===================== PAGE 0: INDEX / COMPARISON ===================== -->\n<div class=\"page active\" id=\"page-0\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 02 — Degree Types · Post Graduate Office<\/div>\n    <h1>What degree<br>should I <em>pursue?<\/em><\/h1>\n    <p class=\"hero-lead\">A comparison of every postgraduate degree type available in CS, and a deep dive into each one. For students who have decided to pursue higher education and want to understand what they're choosing between.<\/p>\n  <\/div>\n\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <h2>At a glance — all degree types<\/h2>\n      <p>Click any degree to read the full deep dive.<\/p>\n      <div class=\"table-wrap\">\n        <table class=\"compare-table\">\n          <thead>\n            <tr>\n              <th>Degree<\/th>\n              <th>Duration<\/th>\n              <th>Funding<\/th>\n              <th>Thesis?<\/th>\n              <th>Advisor role<\/th>\n              <th>Primary output<\/th>\n              <th>Financial risk<\/th>\n              <th>Time risk<\/th>\n              <th>Typical next step<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody>\n            <tr class=\"clickable-row\" onclick=\"goTo(1)\">\n              <td class=\"row-label\">MS (coursework)<\/td>\n              <td>1.5–2 years<\/td>\n              <td>Self-funded<\/td>\n              <td>No<\/td>\n              <td class=\"dep-low\">None<\/td>\n              <td>Courses + capstone<\/td>\n              <td><span class=\"tag tag-high\">High<\/span><\/td>\n              <td><span class=\"tag tag-low\">Low<\/span><\/td>\n              <td>Industry role<\/td>\n            <\/tr>\n            <tr class=\"clickable-row\" onclick=\"goTo(2)\">\n              <td class=\"row-label\">MS (research)<\/td>\n              <td>1.5–2.5 years<\/td>\n              <td>Partial / varies<\/td>\n              <td>Yes<\/td>\n              <td class=\"dep-high\">High<\/td>\n              <td>Thesis<\/td>\n              <td><span class=\"tag tag-mid\">Medium<\/span><\/td>\n              <td><span class=\"tag tag-mid\">Medium<\/span><\/td>\n              <td>Industry or PhD<\/td>\n            <\/tr>\n            <tr class=\"clickable-row\" onclick=\"goTo(3)\">\n              <td class=\"row-label\">MEng<\/td>\n              <td>1–2 years<\/td>\n              <td>Self-funded<\/td>\n              <td>No<\/td>\n              <td class=\"dep-low\">Low<\/td>\n              <td>Design project<\/td>\n              <td><span class=\"tag tag-high\">High<\/span><\/td>\n              <td><span class=\"tag tag-low\">Low<\/span><\/td>\n              <td>Industry role<\/td>\n            <\/tr>\n            <tr class=\"clickable-row\" onclick=\"goTo(4)\">\n              <td class=\"row-label\">MSE<\/td>\n              <td>1.5–2 years<\/td>\n              <td>Self-funded<\/td>\n              <td>Optional<\/td>\n              <td class=\"dep-mid\">Low–Moderate<\/td>\n              <td>Courses ± thesis<\/td>\n              <td><span class=\"tag tag-high\">High<\/span><\/td>\n              <td><span class=\"tag tag-low\">Low<\/span><\/td>\n              <td>Industry role<\/td>\n            <\/tr>\n            <tr class=\"clickable-row\" onclick=\"goTo(5)\">\n              <td class=\"row-label\">MTech<\/td>\n              <td>2 years<\/td>\n              <td>Stipend (India)<\/td>\n              <td>Yes<\/td>\n              <td class=\"dep-high\">High<\/td>\n              <td>Thesis<\/td>\n              <td><span class=\"tag tag-low\">Low<\/span><\/td>\n              <td><span class=\"tag tag-mid\">Medium<\/span><\/td>\n              <td>Industry or research<\/td>\n            <\/tr>\n            <tr class=\"clickable-row\" onclick=\"goTo(6)\">\n              <td class=\"row-label\">MPhil<\/td>\n              <td>1–2 years<\/td>\n              <td>Partial / varies<\/td>\n              <td>Yes<\/td>\n              <td class=\"dep-high\">High<\/td>\n              <td>Short thesis<\/td>\n              <td><span class=\"tag tag-mid\">Medium<\/span><\/td>\n              <td><span class=\"tag tag-low\">Low<\/span><\/td>\n              <td>PhD or industry<\/td>\n            <\/tr>\n            <tr class=\"clickable-row\" onclick=\"goTo(7)\">\n              <td class=\"row-label\">MRes<\/td>\n              <td>1 year<\/td>\n              <td>Partial / varies<\/td>\n              <td>Yes<\/td>\n              <td class=\"dep-high\">High<\/td>\n              <td>Research report<\/td>\n              <td><span class=\"tag tag-mid\">Medium<\/span><\/td>\n              <td><span class=\"tag tag-low\">Low<\/span><\/td>\n              <td>PhD or industry<\/td>\n            <\/tr>\n            <tr class=\"clickable-row\" onclick=\"goTo(8)\">\n              <td class=\"row-label\">PhD<\/td>\n              <td>4–6 years<\/td>\n              <td>Fully funded<\/td>\n              <td>Yes<\/td>\n              <td class=\"dep-high\">Central<\/td>\n              <td>Dissertation + publications<\/td>\n              <td><span class=\"tag tag-low\">Low<\/span><\/td>\n              <td><span class=\"tag tag-high\">High<\/span><\/td>\n              <td>Research or faculty<\/td>\n            <\/tr>\n            <tr class=\"clickable-row\" onclick=\"goTo(9)\">\n              <td class=\"row-label\">Integrated MS-PhD<\/td>\n              <td>5–6 years<\/td>\n              <td>Fully funded<\/td>\n              <td>Yes<\/td>\n              <td class=\"dep-high\">Central<\/td>\n              <td>MS + dissertation<\/td>\n              <td><span class=\"tag tag-low\">Low<\/span><\/td>\n              <td><span class=\"tag tag-high\">High<\/span><\/td>\n              <td>Research or faculty<\/td>\n            <\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <p style=\"font-size:0.8rem; color: var(--ink-3); margin-top: 0.5rem;\">Click any row to read the full deep dive for that degree.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>How to read this table<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card\">\n          <div class=\"card-label\">Financial risk<\/div>\n          <h4>What you might lose money on<\/h4>\n          <p>High means you're paying significant tuition with no guarantee of a proportional salary return. Low means the programme is funded — your financial exposure is primarily the salary you're not earning.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Time risk<\/div>\n          <h4>What you might lose time on<\/h4>\n          <p>High means the timeline is uncertain and extends well beyond the nominal duration. Low means the degree has a fixed, predictable end date. A PhD has low financial risk but high time risk — the inverse of a self-funded MS.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Advisor role<\/div>\n          <h4>How central the relationship is<\/h4>\n          <p>\"None\" means you choose courses from a catalogue with minimal faculty involvement. \"Central\" means your advisor controls your research direction, funding, publication record, and in many cases your job prospects after graduation.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Deep dives<\/h2>\n      <div class=\"toc\">\n        <div class=\"toc-item\" onclick=\"goTo(1)\">\n          <span class=\"toc-num\">01<\/span>\n          <span class=\"toc-title\">MS — Coursework<\/span>\n          <span class=\"toc-meta\">1.5–2 yr · Self-funded · No thesis<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(2)\">\n          <span class=\"toc-num\">02<\/span>\n          <span class=\"toc-title\">MS — Research<\/span>\n          <span class=\"toc-meta\">1.5–2.5 yr · Partial funding · Thesis<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(3)\">\n          <span class=\"toc-num\">03<\/span>\n          <span class=\"toc-title\">MEng — Master of Engineering<\/span>\n          <span class=\"toc-meta\">1–2 yr · Self-funded · No thesis<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(4)\">\n          <span class=\"toc-num\">04<\/span>\n          <span class=\"toc-title\">MSE — Master of Science in Engineering<\/span>\n          <span class=\"toc-meta\">1.5–2 yr · Self-funded · Optional thesis<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(5)\">\n          <span class=\"toc-num\">05<\/span>\n          <span class=\"toc-title\">MTech — Master of Technology<\/span>\n          <span class=\"toc-meta\">2 yr · Stipend · Thesis · India<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(6)\">\n          <span class=\"toc-num\">06<\/span>\n          <span class=\"toc-title\">MPhil — Master of Philosophy<\/span>\n          <span class=\"toc-meta\">1–2 yr · Partial funding · Short thesis · UK<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(7)\">\n          <span class=\"toc-num\">07<\/span>\n          <span class=\"toc-title\">MRes — Master of Research<\/span>\n          <span class=\"toc-meta\">1 yr · Partial funding · Research report · UK<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(8)\">\n          <span class=\"toc-num\">08<\/span>\n          <span class=\"toc-title\">PhD — Doctor of Philosophy<\/span>\n          <span class=\"toc-meta\">4–6 yr · Fully funded · Dissertation<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(9)\">\n          <span class=\"toc-num\">09<\/span>\n          <span class=\"toc-title\">Integrated MS-PhD<\/span>\n          <span class=\"toc-meta\">5–6 yr · Fully funded · MS + Dissertation<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"disclaimer\">This resource is maintained by the Ashoka University Post Graduate Office. Information reflects general patterns across institutions and may not apply to every programme.<\/div>\n<\/div>\n\n<\!-- ===================== PAGE 1: MS COURSEWORK ===================== -->\n<div class=\"page\" id=\"page-1\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Deep Dive 01<\/div>\n    <h1>MS — <em>Coursework<\/em><\/h1>\n    <p class=\"hero-lead\">A taught master's programme built around structured courses, with no thesis requirement. The most common postgraduate degree in CS internationally.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">Duration<\/div><div class=\"data-val\">1.5–2 years (typically 3–4 semesters)<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Funding<\/div><div class=\"data-val\">Self-funded. Tuition for top US programmes ranges from $50,000–$90,000 total. Teaching or research assistantships are rare and competitive. Some programmes offer partial merit scholarships.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Thesis<\/div><div class=\"data-val\">Not required. Most programmes end with a capstone project or design project completed in the final semester, often in a team.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Advisor role<\/div><div class=\"data-val\">Minimal to none. You interact with faculty primarily as instructors in your courses. There is no research supervisor. Some programmes have a faculty advisor for course selection, but this is administrative.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Location<\/div><div class=\"data-val\">Common in the US and Canada. Less common in Europe, where taught master's are shorter (1 year) and structured differently. Examples: CMU MSCS, Stanford MSCS, Columbia MSCS, Cornell Tech MEng (similar structure), UCSD MS.<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Programme structure<\/h2>\n      <p>A coursework MS is organised around a fixed credit requirement — typically 10–12 graduate courses. Most programmes allow you to choose a specialisation track (machine learning, systems, HCI, security, etc.) that determines which courses you take.<\/p>\n      <div class=\"timeline\">\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Semester 1–2<\/div>\n          <h4>Core coursework<\/h4>\n          <p>Foundation courses in your chosen specialisation, often including required courses set by the department. 3–4 courses per semester. Pace is significantly faster than undergraduate — a week's material often covers what took a month in undergrad.<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Semester 3<\/div>\n          <h4>Electives and depth<\/h4>\n          <p>Elective courses in your specialisation area. Some students begin looking for part-time research positions or industry internships during this semester, particularly in programmes that allow it.<\/p>\n        <\/div>\n        <div class=\"timeline-item highlight\">\n          <div class=\"timeline-year\">Semester 3–4<\/div>\n          <h4>Capstone or final project<\/h4>\n          <p>A substantial team or individual project, often with an industry partner or a faculty-supervised problem. Not a research thesis — the output is a working system, design, or technical report. Graded by a faculty panel.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>What you produce<\/h2>\n      <p>By the end of a coursework MS, you will have completed 10–12 graduate-level courses and a capstone project. You will not have produced publishable research. The credential itself — the degree — is the primary output, along with the depth of knowledge in your specialisation and the network of peers and instructors from the programme.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Typical career destinations<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Most common<\/div>\n          <h4>Industry roles<\/h4>\n          <p>Software engineering, ML engineering, data science, and applied research roles at technology companies. The degree typically allows entry at a slightly more senior level than a bachelor's hire.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Less common<\/div>\n          <h4>Research or PhD<\/h4>\n          <p>Some students use a coursework MS to strengthen a PhD application, particularly if their undergraduate record was thin on research. Most programmes are not designed for this path.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">US-specific<\/div>\n          <h4>OPT and work authorisation<\/h4>\n          <p>International students on F-1 visas receive 12 months of OPT (Optional Practical Training) after graduation, extendable to 3 years for STEM degrees. This is a significant practical reason many Indian students pursue a US MS.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"exit-block\">\n      <div class=\"exit-label\">Exit options<\/div>\n      <p>There are no formal mid-programme exit credentials. You either complete the full credit requirement and graduate, or you withdraw without a degree. Some programmes allow students to take a leave of absence for a semester, but this is institution-specific. Unlike a PhD, there is no \"master out\" option — the degree itself is the terminal credential.<\/p>\n    <\/div>\n\n    <div class=\"india-note\">\n      <div class=\"india-note-label\">India context<\/div>\n      <p>Pure coursework MS programmes are uncommon in India. IIT and IISc master's programmes are predominantly research-based (MTech or MS by Research). If you are looking for a coursework-style master's within India, options are limited — most students who want this structure look to US, Canadian, or European programmes.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(0)\">← Back<\/button>\n    <span class=\"page-label\">01 / 09<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(2)\">Next: MS Research →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- ===================== PAGE 2: MS RESEARCH ===================== -->\n<div class=\"page\" id=\"page-2\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Deep Dive 02<\/div>\n    <h1>MS — <em>Research<\/em><\/h1>\n    <p class=\"hero-lead\">A thesis-based master's programme where the primary work is independent research conducted under a faculty advisor. Structurally distinct from a coursework MS in almost every way.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">Duration<\/div><div class=\"data-val\">1.5–2.5 years. The timeline is less predictable than a coursework MS because it depends on research progress.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Funding<\/div><div class=\"data-val\">Varies significantly by institution and country. In the US, research MS students are sometimes funded through RA positions ($18,000–$28,000/year stipend + tuition waiver), but this is not guaranteed and depends on your advisor having grant funding. In the UK and Europe, partial bursaries and research council funding are available but competitive. Self-funded research MS programmes also exist.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Thesis<\/div><div class=\"data-val\">Required. The thesis is a document presenting original research — a problem statement, related work, methodology, results, and conclusions. It must be defended before a faculty committee.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Advisor role<\/div><div class=\"data-val\">High. Your advisor sets your research direction (or co-develops it with you), supervises your work, provides funding in some cases, and writes your strongest recommendation letter. The relationship is central to the programme experience.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Location<\/div><div class=\"data-val\">Available across US, Canada, UK, Europe, and Asia. In the US, many PhD programmes admit students into a research MS track before PhD candidacy. Standalone research MS programmes exist at institutions like UMass, UWaterloo, UofT, Edinburgh.<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Programme structure<\/h2>\n      <div class=\"timeline\">\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Months 1–6<\/div>\n          <h4>Coursework and research area selection<\/h4>\n          <p>Most research MS programmes require 4–6 graduate courses. Simultaneously, you are expected to identify an advisor and narrow down a research area. Some programmes have a formal rotation system; others expect you to arrive with an advisor already identified.<\/p>\n        <\/div>\n        <div class=\"timeline-item highlight\">\n          <div class=\"timeline-year\">Months 6–18<\/div>\n          <h4>Research<\/h4>\n          <p>The core of the programme. Reading papers, designing experiments, running them, interpreting results, iterating. Weekly advisor meetings. This phase is open-ended — progress depends on the problem, the approach, and factors outside your control.<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Months 18–30<\/div>\n          <h4>Thesis writing and defence<\/h4>\n          <p>Drafting the thesis, incorporating advisor feedback across multiple rounds, submitting to a committee, and defending orally. The defence is typically a 45–60 minute presentation followed by questions from the committee.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Advisor role<\/h2>\n      <p>The advisor relationship in a research MS is qualitatively different from anything in a coursework programme. Your advisor is not an instructor — they are a collaborator and supervisor. They set the research context, review your work regularly, and have significant influence over your timeline and output quality.<\/p>\n      <p>Before committing to a research MS programme, it is worth identifying which faculty member you would want to work with and verifying that they are actively accepting students, have funding, and have graduated students recently.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>What you produce<\/h2>\n      <p>A written thesis presenting an original contribution to a specific research area. Depending on the programme and advisor, this thesis work may also result in a conference or workshop paper submission. The thesis is the primary output — it is examined by a faculty committee and becomes part of the institutional record.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Typical career destinations<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Common path A<\/div>\n          <h4>PhD programme<\/h4>\n          <p>A research MS is often used as preparation for a PhD. Completing a thesis demonstrates research ability and provides a strong writing sample and advisor recommendation for PhD applications.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Common path B<\/div>\n          <h4>Research-adjacent industry<\/h4>\n          <p>Research engineering, applied science, and ML research roles at companies that value research training. The thesis and any publications strengthen this application significantly versus a coursework MS.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Also possible<\/div>\n          <h4>Standard industry roles<\/h4>\n          <p>Software engineering and data science roles. The research MS is not a disadvantage here, but the coursework MS from a stronger branded programme may be equally or more competitive for pure engineering positions.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"exit-block\">\n      <div class=\"exit-label\">Exit options<\/div>\n      <p>Some institutions allow a research MS student to convert to a coursework MS if research is not working out — this typically means completing additional coursework in place of the thesis. This option varies by institution and must be confirmed before enrolment. There is no credential awarded for partially completed thesis work.<\/p>\n    <\/div>\n\n    <div class=\"india-note\">\n      <div class=\"india-note-label\">India context<\/div>\n      <p>IISc offers an MS (Research) programme that is structurally similar — coursework in the first year, thesis in the second. IITs offer a similar degree under the MTech or MS Research label depending on the department. These are stipend-funded and GATE-gated for most candidates. See the MTech deep dive for more detail on the Indian equivalent.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(1)\">← Back<\/button>\n    <span class=\"page-label\">02 / 09<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(3)\">Next: MEng →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- ===================== PAGE 3: MENG ===================== -->\n<div class=\"page\" id=\"page-3\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Deep Dive 03<\/div>\n    <h1>MEng —<br><em>Master of Engineering<\/em><\/h1>\n    <p class=\"hero-lead\">A professional, practice-oriented master's degree designed for engineers who intend to work in industry. No thesis, no research requirement, shorter duration than most MS programmes.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">Duration<\/div><div class=\"data-val\">1–2 years. Many MEng programmes, particularly at US institutions, are designed to be completed in one year (2–3 semesters).<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Funding<\/div><div class=\"data-val\">Self-funded. Tuition is comparable to a coursework MS. Assistantships and scholarships are rare. At institutions like MIT, the MEng is offered as a continuation of the undergraduate degree and may have different cost structures for internal students.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Thesis<\/div><div class=\"data-val\">Not required. The degree ends in a substantial capstone project or design project — this is a practical engineering deliverable, not a research contribution.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Advisor role<\/div><div class=\"data-val\">Low. There is typically a project supervisor rather than a research advisor. The relationship is closer to a manager reviewing a deliverable than an academic mentor guiding independent inquiry.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Where offered<\/div><div class=\"data-val\">MIT, Cornell, Johns Hopkins, Columbia, Penn, Duke, and several other US institutions. The MEng is less common internationally — European universities use different naming conventions for similar professional master's programmes.<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Programme structure<\/h2>\n      <p>The MEng is designed for professional development rather than research training. The curriculum is typically more applied than a traditional MS — courses focus on engineering practice, system design, and domain-specific technical depth.<\/p>\n      <div class=\"timeline\">\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Semester 1<\/div>\n          <h4>Advanced coursework<\/h4>\n          <p>Graduate-level courses in engineering specialisations. Some MEng programmes share courses with their MS counterparts; others have MEng-specific tracks designed for engineers entering industry.<\/p>\n        <\/div>\n        <div class=\"timeline-item highlight\">\n          <div class=\"timeline-year\">Semester 2–3<\/div>\n          <h4>Capstone project<\/h4>\n          <p>A substantial design or engineering project. Often completed in teams. At some institutions, this is done in collaboration with industry partners. The output is a working system, prototype, or detailed design specification — not a research paper.<\/p>\n        <\/div>\n      <\/div>\n      <p>At MIT, the MEng is structured as a fifth year of study for undergraduates already enrolled there. It combines a thesis component with coursework and is somewhat more research-oriented than MEng programmes elsewhere — worth checking the specific institution's structure.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>What you produce<\/h2>\n      <p>A capstone project report and, depending on the programme, a working technical system or prototype. No publications, no original research contribution. The degree signals engineering competence and depth in a specialisation — it is designed to be immediately applicable in an industry role.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Typical career destinations<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Primary destination<\/div>\n          <h4>Industry engineering roles<\/h4>\n          <p>Senior software engineering, systems engineering, and technical product roles at technology companies. The MEng is well recognised at companies that recruit heavily from the institutions that offer it — particularly MIT and Cornell.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Less common<\/div>\n          <h4>Research or PhD<\/h4>\n          <p>The MEng is not designed as a pathway to research careers or PhD programmes. Students who want to pursue a PhD after an MEng would typically need additional research experience beyond the degree itself.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"exit-block\">\n      <div class=\"exit-label\">Exit options<\/div>\n      <p>No intermediate credential. The MEng is a terminal professional degree — you complete it or you don't. Given the short duration (often 1 year), early exits are uncommon.<\/p>\n    <\/div>\n\n    <div class=\"india-note\">\n      <div class=\"india-note-label\">India context<\/div>\n      <p>The MEng title is not commonly used in Indian institutions. The closest equivalents are the MTech (research-based, at IITs) or the ME (Master of Engineering) at some private universities, which is closer in structure to a coursework MS. These are distinct from the US MEng and should be evaluated on their own terms.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(2)\">← Back<\/button>\n    <span class=\"page-label\">03 / 09<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(4)\">Next: MSE →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- ===================== PAGE 4: MSE ===================== -->\n<div class=\"page\" id=\"page-4\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Deep Dive 04<\/div>\n    <h1>MSE —<br><em>Master of Science in Engineering<\/em><\/h1>\n    <p class=\"hero-lead\">A degree title used by multiple institutions to mean different things. Understanding what a specific MSE programme involves requires reading the programme description carefully — the name alone tells you less than it does for other degree types.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">Duration<\/div><div class=\"data-val\">1.5–2 years, typically 3 semesters.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Funding<\/div><div class=\"data-val\">Self-funded in most cases. Some MSE programmes at research-oriented institutions offer partial RA funding, but this is the exception rather than the rule.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Thesis<\/div><div class=\"data-val\">Optional at most institutions — students can choose a thesis track or a coursework-only track. This is the key structural distinction of the MSE: it sits between a pure coursework MS and a research MS.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Advisor role<\/div><div class=\"data-val\">Low to moderate, depending on whether you take the thesis track. In the coursework track, faculty involvement is similar to a coursework MS. In the thesis track, an advisor supervises the thesis work.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Where offered<\/div><div class=\"data-val\">University of Pennsylvania (CIS), Johns Hopkins (CS), University of Michigan (CSE), Arizona State, and others. The degree exists predominantly at US institutions.<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Programme structure<\/h2>\n      <p>The MSE is best understood as a flexible degree that can lean either toward professional coursework or toward research, depending on the institution and the track you choose. Many MSE programmes allow this choice at enrolment or at the end of the first year.<\/p>\n\n      <h3>Coursework track<\/h3>\n      <p>Structurally similar to a coursework MS. 8–10 graduate courses, a capstone or final project, no thesis requirement. Outcome and career destinations are similar to a coursework MS.<\/p>\n\n      <h3>Thesis track<\/h3>\n      <p>Structurally similar to a research MS. 6–8 graduate courses plus independent research under an advisor, ending in a thesis and oral defence. Outcome and career destinations are similar to a research MS.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>What you produce<\/h2>\n      <p>Either a capstone project (coursework track) or a research thesis (thesis track). The degree credential itself is the same regardless of track at most institutions — both say MSE on the diploma, though your transcript will indicate which you completed.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Typical career destinations<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Coursework track<\/div>\n          <h4>Industry roles<\/h4>\n          <p>Software engineering, systems engineering, ML engineering. Comparable to a coursework MS for most industry hiring purposes.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Thesis track<\/div>\n          <h4>Research or PhD<\/h4>\n          <p>Research-adjacent industry roles or PhD programme applications. The thesis provides a research writing sample and the advisor provides a strong LoR, both of which strengthen a PhD application.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"exit-block\">\n      <div class=\"exit-label\">Exit options<\/div>\n      <p>If you enrol in the thesis track and find that research is not working out, most MSE programmes allow you to switch to the coursework track and complete the degree without a thesis. This is one of the practical advantages of the MSE structure over a standalone research MS. Confirm this option with the specific programme before applying.<\/p>\n    <\/div>\n\n    <div class=\"india-note\">\n      <div class=\"india-note-label\">India context<\/div>\n      <p>The MSE title is not used in Indian institutions. The ME (Master of Engineering) degree at some universities covers similar ground but is structured differently. The flexibility of the US MSE — choosing between thesis and non-thesis tracks — is not a feature of most Indian postgraduate programmes.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(3)\">← Back<\/button>\n    <span class=\"page-label\">04 / 09<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(5)\">Next: MTech →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- ===================== PAGE 5: MTECH ===================== -->\n<div class=\"page\" id=\"page-5\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Deep Dive 05<\/div>\n    <h1>MTech —<br><em>Master of Technology<\/em><\/h1>\n    <p class=\"hero-lead\">The primary postgraduate engineering degree in India. Research-oriented, thesis-based, and offered at IITs and IISc with stipend funding for most students.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">Duration<\/div><div class=\"data-val\">2 years (4 semesters).<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Funding<\/div><div class=\"data-val\">Most MTech students at IITs and IISc receive a monthly stipend of ₹12,400–₹16,000 (MHRD/GATE scholarship) plus a tuition fee waiver. Students not holding a GATE score may not qualify for the stipend. Private university MTech programmes are typically self-funded.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Thesis<\/div><div class=\"data-val\">Required. The thesis typically spans the second year and is a substantial research contribution. It must be submitted to and examined by a departmental committee.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Advisor role<\/div><div class=\"data-val\">High. An advisor (called a thesis supervisor or guide) is assigned or chosen at the end of the first year. They direct the research, supervise experiments, and sign off on the thesis. The relationship is similar to a research MS advisor internationally.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Admission<\/div><div class=\"data-val\">GATE score is the standard entry requirement at IITs and IISc. Some departments also admit candidates through direct interview processes for students with exceptional undergraduate records. Admissions are competitive — top departments at IIT Bombay, Delhi, Madras, and IISc are selective.<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Programme structure<\/h2>\n      <div class=\"timeline\">\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Year 1 (Semesters 1–2)<\/div>\n          <h4>Coursework<\/h4>\n          <p>Graduate-level courses in the department. 6–8 courses spread across two semesters. Students begin identifying a thesis supervisor and research area toward the end of Year 1.<\/p>\n        <\/div>\n        <div class=\"timeline-item highlight\">\n          <div class=\"timeline-year\">Year 2 (Semesters 3–4)<\/div>\n          <h4>Thesis research<\/h4>\n          <p>Full-time research under the supervisor. Literature review, problem formulation, experimentation, results analysis, and thesis writing. The thesis is submitted at the end of Semester 4 and defended before a departmental committee.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>What you produce<\/h2>\n      <p>A research thesis presenting an original contribution in your area. Depending on the supervisor and department, this work may also result in a conference or journal paper. The thesis quality and the supervisor's reputation are both important for subsequent opportunities — whether in industry or a PhD programme.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Typical career destinations<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Common path A<\/div>\n          <h4>Industry in India<\/h4>\n          <p>Product companies, research labs, and applied ML roles. The IIT/IISc brand carries significant weight in the Indian job market, particularly for technical roles at larger companies.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Common path B<\/div>\n          <h4>PhD (India or abroad)<\/h4>\n          <p>An MTech from IISc or a top IIT is a strong credential for PhD applications at international programmes. The thesis and supervisor recommendation letter are taken seriously by admissions committees abroad.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Also common<\/div>\n          <h4>Research positions<\/h4>\n          <p>Research associate and scientist roles at DRDO, ISRO, and national labs. Some government research positions explicitly require or prefer an MTech.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"exit-block\">\n      <div class=\"exit-label\">Exit options<\/div>\n      <p>At IISc, exceptional MTech students can apply to convert their enrolment to a PhD programme, typically after completing their thesis and with strong supervisor support. This is not automatic and requires departmental approval. At IITs, the conversion process varies by department. Students who do not complete the thesis do not receive the MTech degree — there is no intermediate credential.<\/p>\n    <\/div>\n\n    <div class=\"india-note\">\n      <div class=\"india-note-label\">India context<\/div>\n      <p>The MTech is the dominant postgraduate engineering degree in India and is what most Indian students mean when they say \"master's in India.\" The quality varies enormously between institutions — an MTech from IISc or IIT Bombay is internationally recognised, while an MTech from a private university may carry little weight for research applications. GATE preparation is typically a 6–12 month commitment and should be factored into the planning timeline.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(4)\">← Back<\/button>\n    <span class=\"page-label\">05 / 09<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(6)\">Next: MPhil →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- ===================== PAGE 6: MPHIL ===================== -->\n<div class=\"page\" id=\"page-6\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Deep Dive 06<\/div>\n    <h1>MPhil —<br><em>Master of Philosophy<\/em><\/h1>\n    <p class=\"hero-lead\">A research degree most commonly offered in the UK, sitting between a taught master's and a PhD. In CS specifically, it is relatively uncommon — most UK CS students move directly from a taught master's to a PhD.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">Duration<\/div><div class=\"data-val\">1–2 years, depending on the institution and whether studied full-time or part-time.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Funding<\/div><div class=\"data-val\">Partial funding is available through UK Research Councils (EPSRC, AHRC) and institutional bursaries, but MPhil-specific funding is less available than PhD funding. Many MPhil students are self-funded or supported by employer sponsorship.<\/div><\/div>\n        <d
