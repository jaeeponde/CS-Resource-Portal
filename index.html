<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Higher Education Resource Portal — Ashoka University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1a1a1a; --ink-2:#444; --ink-3:#888;
    --paper:#faf8f3; --paper-2:#f2efe8; --paper-3:#e8e4da;
    --accent:#c0392b; --rule:#ddd9d0;
    --sans:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { display:flex; flex-direction:column; height:100dvh; background:var(--paper); color:var(--ink); font-family:var(--sans); overflow:hidden; }
  .portal-bar { flex:none; display:flex; align-items:stretch; gap:1rem; padding:0 1rem 0 2rem; height:52px; background:var(--paper-2); border-bottom:1px solid var(--rule); }
  .brand { flex:none; align-self:center; font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap; }
  .brand span { color:var(--accent); }
  .tabs { flex:1; display:flex; justify-content:center; gap:.25rem; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; display:flex; align-items:center; gap:.5rem; padding:0 .85rem; border:0; border-bottom:2px solid transparent; background:none; cursor:pointer; font:500 13px var(--sans); color:var(--ink-2); white-space:nowrap; transition:color .2s, border-color .2s; }
  .tab .num { font-family:var(--mono); font-size:11px; color:var(--ink-3); }
  .tab .short { display:none; }
  .tab:hover { color:var(--ink); }
  .tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
  .tab[aria-selected="true"] .num { color:var(--accent); }
  .tab:focus-visible, .step:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .steps { flex:none; display:flex; align-items:center; gap:.4rem; }
  .step { height:30px; padding:0 .7rem; border:1px solid var(--rule); border-radius:3px; background:var(--paper); cursor:pointer; font:500 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); white-space:nowrap; }
  .step:hover:not(:disabled) { border-color:var(--ink-3); color:var(--ink); }
  .step:disabled { opacity:.35; cursor:default; }
  .frames { flex:1; position:relative; min-height:0; }
  .frames iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--paper); }
  .frames iframe.active { display:block; }
  @media (max-width:1600px) { .tab .full { display:none; } .tab .short { display:inline; } }
  @media (max-width:760px) {
    .portal-bar { padding:0 .5rem 0 1rem; gap:.5rem; }
    .brand { display:none; }
    .tabs { justify-content:flex-start; }
    .tab { padding:0 .55rem; }
    .step .lbl { display:none; }
  }
</style>
</head>
<body>
<header class="portal-bar">
  <div class="brand" role="button" tabindex="0" style="cursor:pointer" onclick="show(0,true)">Ashoka University · <span>Post Graduate Office</span></div>
  <nav class="tabs" role="tablist" aria-label="Guides"><button class="tab home-tab" role="tab" data-id="home" aria-selected="false" aria-label="Home"><span class="short" style="display:inline">Home</span></button><button class="tab" role="tab" data-id="should" aria-selected="false"><span class="num">01</span><span class="full">Should I pursue higher education?</span><span class="short">Should I go?</span></button><button class="tab" role="tab" data-id="degree" aria-selected="false"><span class="num">02</span><span class="full">What degree should I pursue?</span><span class="short">Which degree?</span></button><button class="tab" role="tab" data-id="field" aria-selected="false"><span class="num">03</span><span class="full">What field should I choose?</span><span class="short">Which field?</span></button><button class="tab" role="tab" data-id="shortlist" aria-selected="false"><span class="num">04</span><span class="full">Shortlisting master's schools</span><span class="short">Shortlisting</span></button><button class="tab" role="tab" data-id="after" aria-selected="false"><span class="num">05</span><span class="full">After you apply</span><span class="short">After you apply</span></button></nav>
  <div class="steps">
    <button class="step" id="prevGuide" aria-label="Previous guide">← <span class="lbl">Prev</span></button>
    <button class="step" id="nextGuide" aria-label="Next guide"><span class="lbl">Next</span> →</button>
  </div>
</header>
<main class="frames" id="frames"></main>

const GUIDES = [{"id": "home", "title": "Home", "short": "Home", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Higher Education Resource Portal — Ashoka CS<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --ink: #1a1a1a; --ink-2: #444; --ink-3: #888;\n    --paper: #faf8f3; --paper-2: #f2efe8; --paper-3: #e8e4da;\n    --accent: #c0392b; --teal: #1a7a6e; --teal-light: #e8f5f3;\n    --rule: #ddd9d0;\n    --serif: 'DM Serif Display', Georgia, serif;\n    --sans: 'DM Sans', sans-serif;\n    --mono: 'DM Mono', monospace;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: var(--sans); background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.7; }\n  button { font: inherit; color: inherit; }\n\n  .wrap { width: min(916px, calc(100% - 4rem)); margin-left: auto; margin-right: auto; }\n\n  /* HERO */\n  .hero { padding-top: 6rem; padding-bottom: 4.5rem; border-bottom: 1px solid var(--rule); }\n  .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.4rem; }\n  .hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(2.6rem, 6vw, 4.6rem); line-height: 1.08; letter-spacing: -0.01em; max-width: 14ch; margin-bottom: 1.6rem; }\n  .hero h1 em { font-style: italic; color: var(--accent); }\n  .lead { font-size: 1.15rem; color: var(--ink-2); max-width: 600px; line-height: 1.75; }\n  .hero-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2.2rem; }\n  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 0.8rem 1.5rem; font-size: 0.9rem; font-weight: 500; cursor: pointer; border: 1px solid var(--ink); background: transparent; color: var(--ink); transition: background 0.15s, color 0.15s; }\n  .btn:hover { background: var(--ink); color: var(--paper); }\n  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }\n  .btn.primary:hover { background: #a93226; border-color: #a93226; }\n  .btn:focus-visible, .journey-item:focus-visible, .start-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }\n\n  .facts { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--rule); }\n  .fact { padding: 1.8rem 1.5rem 1.8rem 0; }\n  .fact + .fact { padding-left: 1.5rem; border-left: 1px solid var(--rule); }\n  .fact-num { font-family: var(--serif); font-size: 2.4rem; line-height: 1; color: var(--ink); }\n  .fact-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-top: 0.5rem; }\n\n  section { padding-top: 4.5rem; padding-bottom: 1rem; }\n  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 0.6rem; }\n  h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.7rem, 3vw, 2.2rem); line-height: 1.2; }\n  .sec-intro { color: var(--ink-2); max-width: 620px; margin-bottom: 2rem; }\n\n  /* JOURNEY */\n  .journey { border-top: 1px solid var(--ink); }\n  .journey-item { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 4rem 1fr auto; gap: 1.5rem; padding: 1.8rem 0; cursor: pointer; transition: background 0.15s; }\n  .journey-item:hover { background: var(--paper-2); }\n  .journey-item:hover .j-arrow { color: var(--accent); transform: translateX(4px); }\n  .j-num { font-family: var(--mono); font-size: 12px; color: var(--accent); padding-top: 0.55rem; padding-left: 0.25rem; }\n  .j-q { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.25rem; }\n  .j-title { font-family: var(--serif); font-size: 1.6rem; line-height: 1.2; margin-bottom: 0.5rem; }\n  .j-desc { font-size: 0.95rem; color: var(--ink-2); max-width: 600px; line-height: 1.65; }\n  .j-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.9rem; }\n  .tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; color: var(--ink-2); border: 1px solid var(--rule); background: var(--paper); padding: 2px 8px; }\n  .tag.tool { color: var(--teal); background: var(--teal-light); border-color: #b3d8d4; }\n  .j-arrow { font-size: 1.3rem; color: var(--ink-3); padding-top: 0.4rem; padding-right: 0.5rem; transition: color 0.15s, transform 0.15s; }\n\n  /* START HERE */\n  .start { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }\n  .start-item { text-align: left; background: var(--paper-2); border: 1px solid var(--rule); padding: 1.3rem 1.4rem; cursor: pointer; display: flex; flex-direction: column; gap: 0.9rem; justify-content: space-between; transition: border-color 0.15s, background 0.15s; }\n  .start-item:hover { border-color: var(--accent); background: #fdf0ee; }\n  .start-quote { font-family: var(--serif); font-size: 1.15rem; line-height: 1.35; }\n  .start-go { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }\n\n  /* NOTES */\n  .notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2rem; padding-bottom: 4rem; }\n  .note-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.5rem; }\n  .note p { font-size: 0.92rem; color: var(--ink-2); line-height: 1.65; }\n\n  footer { background: var(--paper-2); border-top: 1px solid var(--rule); padding: 1.4rem 0; font-size: 0.8rem; color: var(--ink-3); line-height: 1.6; }\n\n  @media (max-width: 640px) {\n    .wrap { width: calc(100% - 2.5rem); }\n    .hero { padding-top: 3.5rem; padding-bottom: 3rem; }\n    .hero-actions .btn { flex: 1 1 100%; justify-content: center; }\n    .fact { padding: 1.2rem 0.75rem 1.2rem 0; }\n    .fact + .fact { padding-left: 0.75rem; }\n    .fact-num { font-size: 1.9rem; }\n    .fact-label { font-size: 9px; letter-spacing: 0.06em; line-height: 1.4; }\n    .journey-item { grid-template-columns: 2.2rem 1fr; gap: 0.75rem; }\n    .j-arrow { display: none; }\n    .j-title { font-size: 1.35rem; }\n    section { padding-top: 3.5rem; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<header class=\"wrap hero\">\n  <div class=\"kicker\">Ashoka University · Post Graduate Office<\/div>\n  <h1>Planning what comes <em>after<\/em> your CS degree?<\/h1>\n  <p class=\"lead\">This portal collects the Post Graduate Office's guides for Computer Science students considering a master's or PhD. It covers the whole process, from whether further study is right for you to getting a visa once you have an offer. Read the sections in order, or go straight to the question you have.<\/p>\n  <div class=\"hero-actions\">\n    <button class=\"btn primary\" data-go=\"should\">Start at the beginning →<\/button>\n    <button class=\"btn\" data-scroll=\"start\">Find where to start<\/button>\n  <\/div>\n<\/header>\n\n<div class=\"wrap\">\n  <div class=\"facts\">\n    <div class=\"fact\"><div class=\"fact-num\">5<\/div><div class=\"fact-label\">Sections, in order<\/div><\/div>\n    <div class=\"fact\"><div class=\"fact-num\">25+<\/div><div class=\"fact-label\">Topics covered<\/div><\/div>\n    <div class=\"fact\"><div class=\"fact-num\">3<\/div><div class=\"fact-label\">Interactive tools<\/div><\/div>\n  <\/div>\n<\/div>\n\n<section class=\"wrap\" aria-labelledby=\"journey-h\">\n  <div class=\"sec-head\"><h2 id=\"journey-h\">The five sections<\/h2><\/div>\n  <p class=\"sec-intro\">Each section answers one question. Together they follow the order most students go through, from first considering a postgraduate degree to arriving on campus.<\/p>\n  <div class=\"journey\">\n    <button class=\"journey-item\" data-go=\"should\">\n      <span class=\"j-num\">01<\/span>\n      <span>\n        <span class=\"j-q\" style=\"display:block\">Whether<\/span>\n        <span class=\"j-title\" style=\"display:block\">Should I pursue higher education?<\/span>\n        <span class=\"j-desc\" style=\"display:block\">What an MS or PhD actually involves, how it compares with going straight into industry, the opportunity cost, and who should not do a PhD.<\/span>\n        <span class=\"j-tags\"><span class=\"tag tool\">Decision tool<\/span><span class=\"tag\">MS vs PhD vs job<\/span><span class=\"tag\">Opportunity cost<\/span><\/span>\n      <\/span>\n      <span class=\"j-arrow\">→<\/span>\n    <\/button>\n    <button class=\"journey-item\" data-go=\"degree\">\n      <span class=\"j-num\">02<\/span>\n      <span>\n        <span class=\"j-q\" style=\"display:block\">Which degree<\/span>\n        <span class=\"j-title\" style=\"display:block\">What degree should I pursue?<\/span>\n        <span class=\"j-desc\" style=\"display:block\">Every postgraduate degree type in CS compared side by side, with a detailed page on each: coursework and research MS, MEng, MSE, MTech, MPhil, MRes, PhD and integrated MS-PhD.<\/span>\n        <span class=\"j-tags\"><span class=\"tag\">9 degree types<\/span><span class=\"tag\">Funding<\/span><span class=\"tag\">Duration<\/span><span class=\"tag\">Thesis<\/span><\/span>\n      <\/span>\n      <span class=\"j-arrow\">→<\/span>\n    <\/button>\n    <button class=\"journey-item\" data-go=\"field\">\n      <span class=\"j-num\">03<\/span>\n      <span>\n        <span class=\"j-q\" style=\"display:block\">Which field<\/span>\n        <span class=\"j-title\" style=\"display:block\">What field should I choose?<\/span>\n        <span class=\"j-desc\" style=\"display:block\">A map of the major research areas in CS and what working in each one involves, plus the common dilemmas: AI vs systems, theory vs applied ML, broad vs niche.<\/span>\n        <span class=\"j-tags\"><span class=\"tag tool\">Interactive field map<\/span><span class=\"tag\">AI/ML<\/span><span class=\"tag\">Systems<\/span><span class=\"tag\">Theory<\/span><\/span>\n      <\/span>\n      <span class=\"j-arrow\">→<\/span>\n    <\/button>\n    <button class=\"journey-item\" data-go=\"shortlist\">\n      <span class=\"j-num\">04<\/span>\n      <span>\n        <span class=\"j-q\" style=\"display:block\">Where to apply<\/span>\n        <span class=\"j-title\" style=\"display:block\">Shortlisting master's schools<\/span>\n        <span class=\"j-desc\" style=\"display:block\">How to build an application list based on location, total cost, programme quality and placements, how to sort schools into safety, target and dream, and the tools to research them.<\/span>\n        <span class=\"j-tags\"><span class=\"tag\">US · UK · Canada · Europe · India<\/span><span class=\"tag\">Cost<\/span><span class=\"tag\">Safety / Target / Dream<\/span><\/span>\n      <\/span>\n      <span class=\"j-arrow\">→<\/span>\n    <\/button>\n    <button class=\"journey-item\" data-go=\"after\">\n      <span class=\"j-num\">05<\/span>\n      <span>\n        <span class=\"j-q\" style=\"display:block\">After you apply<\/span>\n        <span class=\"j-title\" style=\"display:block\">Funding, visas and choosing an offer<\/span>\n        <span class=\"j-desc\" style=\"display:block\">Scholarships and education loans, country-by-country student visa preparation, and a framework for deciding between offers.<\/span>\n        <span class=\"j-tags\"><span class=\"tag tool\">Offer comparison<\/span><span class=\"tag\">Scholarships &amp; loans<\/span><span class=\"tag\">US · UK · Canada · Germany visas<\/span><\/span>\n      <\/span>\n      <span class=\"j-arrow\">→<\/span>\n    <\/button>\n  <\/div>\n<\/section>\n\n<section class=\"wrap\" id=\"start\" aria-labelledby=\"start-h\">\n  <div class=\"sec-head\"><h2 id=\"start-h\">Not sure where to start?<\/h2><\/div>\n  <p class=\"sec-intro\">Pick the statement closest to where you are now.<\/p>\n  <div class=\"start\">\n    <button class=\"start-item\" data-go=\"should\"><span class=\"start-quote\">\"I don't know if I want a master's, a PhD, or a job.\"<\/span><span class=\"start-go\">Section 01 →<\/span><\/button>\n    <button class=\"start-item\" data-go=\"degree\"><span class=\"start-quote\">\"I want to study further, but MS, MEng and MRes all sound the same.\"<\/span><span class=\"start-go\">Section 02 →<\/span><\/button>\n    <button class=\"start-item\" data-go=\"field\"><span class=\"start-quote\">\"I can't decide between AI and systems, or whether to specialise.\"<\/span><span class=\"start-go\">Section 03 →<\/span><\/button>\n    <button class=\"start-item\" data-go=\"shortlist\"><span class=\"start-quote\">\"I'm applying to master's programmes and need a list of schools.\"<\/span><span class=\"start-go\">Section 04 →<\/span><\/button>\n    <button class=\"start-item\" data-go=\"after\"><span class=\"start-quote\">\"I have offers and need to work out funding, visas and which to pick.\"<\/span><span class=\"start-go\">Section 05 →<\/span><\/button>\n  <\/div>\n<\/section>\n\n<section class=\"wrap\" aria-labelledby=\"notes-h\">\n  <div class=\"sec-head\"><h2 id=\"notes-h\">How to use this portal<\/h2><\/div>\n  <div class=\"notes\" style=\"margin-top:1.5rem;\">\n    <div class=\"note\"><div class=\"note-label\">Getting around<\/div><p>Use the tabs at the top to switch sections, or Prev and Next to go through them in order. Inside a section, <strong>← Contents<\/strong> takes you back to that section's main page.<\/p><\/div>\n    <div class=\"note\"><div class=\"note-label\">Your place is kept<\/div><p>If you switch between sections, each one stays where you left it. The browser back button also works, and each section has its own link you can share.<\/p><\/div>\n    <div class=\"note\"><div class=\"note-label\">Use it as a starting point<\/div><p>These guides describe general patterns. Fees, visa rules and programme details change every year, so check the official source before you make a decision. Then talk to the Post Graduate Office.<\/p><\/div>\n  <\/div>\n<\/section>\n\n<footer>\n  <div class=\"wrap\">Maintained by the Post Graduate Office, Ashoka University. For Computer Science students considering postgraduate study.<\/div>\n<\/footer>\n\n<script>\ndocument.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => {\n  if (window.parent !== window) window.parent.postMessage({ portalGo: el.dataset.go }, '*');\n}));\ndocument.querySelectorAll('[data-scroll]').forEach(el => el.addEventListener('click', () => {\n  document.getElementById(el.dataset.scroll).scrollIntoView({ behavior: 'smooth', block: 'start' });\n}));\n<\/script>\n<style>\n.pg-home{display:none;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:none;border:1px solid var(--rule);padding:.4rem .75rem;cursor:pointer;white-space:nowrap}\n.pg-home:hover{color:var(--accent);border-color:var(--accent)}\n.pg-home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\nbody.on-sub .pg-home{display:inline-flex}\nbody.on-sub nav .nav-brand{display:none}\n<\/style>\n<script>(function(){\nvar nav=document.querySelector('nav');if(!nav||typeof goTo!=='function')return;\nvar b=document.createElement('button');b.type='button';b.className='pg-home';b.textContent='\\u2190 Contents';\nb.title='Back to the start of this section';b.onclick=function(){goTo(0)};nav.insertBefore(b,nav.firstChild);\nfunction sync(){var a=document.querySelector('.page.active');var sub=!!a&&a.id!=='page-0';\n if(document.body.classList.contains('on-sub')!==sub)document.body.classList.toggle('on-sub',sub);}\nnew MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});sync();\nwindow.addEventListener('message',function(e){if(e.data==='pg-home')goTo(0)});\n})();<\/script>\n<\/body>\n<\/html>\n"}, {"id": "should", "title": "Should I pursue higher education?", "short": "Should I go?", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Should I Pursue Higher Education? — Ashoka CS<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --ink: #1a1a1a;\n    --ink-2: #444;\n    --ink-3: #888;\n    --paper: #faf8f3;\n    --paper-2: #f2efe8;\n    --paper-3: #e8e4da;\n    --accent: #c0392b;\n    --accent-2: #e67e22;\n    --teal: #1a7a6e;\n    --teal-light: #e8f5f3;\n    --rule: #ddd9d0;\n    --serif: 'DM Serif Display', Georgia, serif;\n    --sans: 'DM Sans', sans-serif;\n    --mono: 'DM Mono', monospace;\n  }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  body {\n    font-family: var(--sans);\n    background: var(--paper);\n    color: var(--ink);\n    min-height: 100vh;\n    font-size: 16px;\n    line-height: 1.7;\n  }\n\n  /* NAV */\n  nav {\n    position: fixed; top: 0; left: 0; right: 0;\n    background: var(--paper);\n    border-bottom: 1px solid var(--rule);\n    z-index: 100;\n    padding: 0 2rem;\n    height: 56px;\n    display: flex; align-items: center; justify-content: space-between;\n  }\n  .nav-brand {\n    font-family: var(--mono);\n    font-size: 12px;\n    color: var(--ink-3);\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n  }\n  .nav-brand span { color: var(--accent); }\n  .nav-progress {\n    display: flex; gap: 6px; align-items: center;\n  }\n  .nav-dot {\n    width: 6px; height: 6px;\n    border-radius: 50%;\n    background: var(--paper-3);\n    cursor: pointer;\n    transition: background 0.2s, transform 0.2s;\n  }\n  .nav-dot.active { background: var(--accent); transform: scale(1.4); }\n  .nav-dot.visited { background: var(--ink-3); }\n\n  /* PAGES */\n  .page {\n    display: none;\n    min-height: 100vh;\n    padding-top: 56px;\n    animation: fadeIn 0.4s ease;\n  }\n  .page.active { display: block; }\n\n  @keyframes fadeIn {\n    from { opacity: 0; transform: translateY(8px); }\n    to { opacity: 1; transform: translateY(0); }\n  }\n\n  /* HERO */\n  .hero {\n    padding: 5rem 2rem 4rem;\n    max-width: 820px;\n    margin: 0 auto;\n    border-bottom: 1px solid var(--rule);\n  }\n  .hero-kicker {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--accent);\n    margin-bottom: 1.2rem;\n  }\n  .hero h1 {\n    font-family: var(--serif);\n    font-size: clamp(2.4rem, 5vw, 3.8rem);\n    line-height: 1.15;\n    color: var(--ink);\n    margin-bottom: 1.5rem;\n    font-weight: 400;\n  }\n  .hero h1 em { font-style: italic; color: var(--accent); }\n  .hero-lead {\n    font-size: 1.1rem;\n    color: var(--ink-2);\n    max-width: 580px;\n    line-height: 1.75;\n  }\n  .hero-meta {\n    display: flex;\n    gap: 2rem;\n    margin-top: 1.5rem;\n  }\n  .hero-meta-item {\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--ink-3);\n    letter-spacing: 0.06em;\n  }\n  .hero-meta-item span { color: var(--ink); font-weight: 500; }\n\n  /* CONTENT BODY */\n  .content {\n    max-width: 820px;\n    margin: 0 auto;\n    padding: 3rem 2rem 6rem;\n  }\n\n  /* SECTION BLOCKS */\n  .section-block {\n    margin-bottom: 3.5rem;\n  }\n  .section-block h2 {\n    font-family: var(--serif);\n    font-size: 1.8rem;\n    font-weight: 400;\n    margin-bottom: 1rem;\n    color: var(--ink);\n  }\n  .section-block h3 {\n    font-family: var(--sans);\n    font-size: 1rem;\n    font-weight: 500;\n    text-transform: uppercase;\n    letter-spacing: 0.06em;\n    color: var(--ink-3);\n    margin-bottom: 0.6rem;\n    margin-top: 2rem;\n  }\n  .section-block p {\n    color: var(--ink-2);\n    margin-bottom: 1rem;\n  }\n\n  /* PULL QUOTE */\n  .pull-quote {\n    border-left: 3px solid var(--accent);\n    padding: 1rem 1.5rem;\n    margin: 2rem 0;\n    background: var(--paper-2);\n  }\n  .pull-quote p {\n    font-family: var(--serif);\n    font-size: 1.25rem;\n    color: var(--ink);\n    font-style: italic;\n    margin: 0;\n  }\n\n  /* INFO CARDS */\n  .card-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n    gap: 1rem;\n    margin: 1.5rem 0;\n  }\n  .card {\n    background: var(--paper-2);\n    border: 1px solid var(--rule);\n    padding: 1.25rem 1.25rem 1.5rem;\n  }\n  .card-label {\n    font-family: var(--mono);\n    font-size: 10px;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n    margin-bottom: 0.5rem;\n  }\n  .card h4 {\n    font-family: var(--serif);\n    font-size: 1.15rem;\n    font-weight: 400;\n    margin-bottom: 0.5rem;\n    color: var(--ink);\n  }\n  .card p {\n    font-size: 0.875rem;\n    color: var(--ink-2);\n    margin: 0;\n    line-height: 1.6;\n  }\n  .card.accent-card { background: #fdf0ee; border-color: #e8bfba; }\n  .card.teal-card { background: var(--teal-light); border-color: #b3d8d4; }\n\n  /* TIMELINE */\n  .timeline {\n    position: relative;\n    padding-left: 2rem;\n    margin: 1.5rem 0;\n  }\n  .timeline::before {\n    content: '';\n    position: absolute; left: 0; top: 0; bottom: 0;\n    width: 1px; background: var(--rule);\n  }\n  .timeline-item {\n    position: relative;\n    margin-bottom: 1.8rem;\n    padding-left: 0.5rem;\n  }\n  .timeline-item::before {\n    content: '';\n    position: absolute; left: -2rem; top: 6px;\n    width: 8px; height: 8px;\n    border-radius: 50%;\n    background: var(--paper);\n    border: 1.5px solid var(--ink-3);\n  }\n  .timeline-item.highlight::before { background: var(--accent); border-color: var(--accent); }\n  .timeline-year {\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--ink-3);\n    letter-spacing: 0.06em;\n    margin-bottom: 0.3rem;\n  }\n  .timeline-item h4 { font-weight: 500; color: var(--ink); margin-bottom: 0.3rem; }\n  .timeline-item p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.6; }\n\n  /* STAT ROW */\n  .stat-row {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 1px;\n    background: var(--rule);\n    border: 1px solid var(--rule);\n    margin: 2rem 0;\n  }\n  .stat-cell { background: var(--paper); padding: 1.5rem 1.25rem; text-align: center; }\n  .stat-number {\n    font-family: var(--serif);\n    font-size: 2.4rem;\n    color: var(--ink);\n    line-height: 1;\n    margin-bottom: 0.4rem;\n  }\n  .stat-number span { color: var(--accent); font-size: 1.6rem; }\n  .stat-label { font-size: 0.8rem; color: var(--ink-3); line-height: 1.5; }\n\n  /* NAV FOOTER */\n  .page-nav {\n    max-width: 820px;\n    margin: 0 auto;\n    padding: 2rem 2rem 4rem;\n    border-top: 1px solid var(--rule);\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n  }\n  .btn {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    padding: 0.7rem 1.4rem;\n    font-family: var(--sans);\n    font-size: 0.9rem;\n    font-weight: 500;\n    cursor: pointer;\n    border: 1px solid var(--ink);\n    background: transparent;\n    color: var(--ink);\n    transition: background 0.15s, color 0.15s;\n    letter-spacing: 0.01em;\n  }\n  .btn:hover { background: var(--ink); color: var(--paper); }\n  .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }\n  .btn.primary:hover { background: #a93226; border-color: #a93226; }\n  .btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }\n  .page-label {\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--ink-3);\n    letter-spacing: 0.08em;\n    text-align: center;\n  }\n\n  /* DECISION TOOL */\n  .quiz-wrap {\n    max-width: 680px;\n    margin: 0 auto;\n    padding: 3rem 2rem 5rem;\n  }\n  .quiz-progress-bar {\n    height: 2px;\n    background: var(--paper-3);\n    margin-bottom: 0.75rem;\n  }\n  .quiz-progress-fill {\n    height: 100%;\n    background: var(--accent);\n    transition: width 0.4s ease;\n  }\n  .progress-labels {\n    display: flex;\n    justify-content: space-between;\n    margin-bottom: 3rem;\n  }\n  .progress-label-left, .progress-label-right {\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--ink-3);\n    letter-spacing: 0.06em;\n  }\n  .question-block { animation: fadeIn 0.3s ease; }\n  .question-context {\n    font-family: var(--mono);\n    font-size: 10px;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n    margin-bottom: 0.5rem;\n  }\n  .question-context.cat-research { color: var(--teal); }\n  .question-context.cat-fit { color: #6c63ff; }\n  .question-context.cat-practical { color: var(--accent); }\n  .question-text {\n    font-family: var(--serif);\n    font-size: 1.65rem;\n    line-height: 1.3;\n    color: var(--ink);\n    margin-bottom: 0.6rem;\n    font-weight: 400;\n  }\n  .question-note {\n    font-size: 0.85rem;\n    color: var(--ink-3);\n    margin-bottom: 1.8rem;\n    line-height: 1.5;\n  }\n  .options-list {\n    display: flex;\n    flex-direction: column;\n    gap: 0.6rem;\n  }\n  .option-btn {\n    display: flex;\n    align-items: flex-start;\n    gap: 1rem;\n    padding: 0.95rem 1.2rem;\n    background: var(--paper);\n    border: 1px solid var(--rule);\n    cursor: pointer;\n    text-align: left;\n    font-family: var(--sans);\n    font-size: 0.92rem;\n    color: var(--ink-2);\n    transition: border-color 0.12s, background 0.12s;\n    line-height: 1.55;\n    width: 100%;\n  }\n  .option-btn:hover { border-color: var(--ink-3); background: var(--paper-2); }\n  .option-btn.selected { border-color: var(--accent); background: #fdf0ee; color: var(--ink); }\n  .option-tag {\n    font-family: var(--mono);\n    font-size: 10px;\n    color: var(--ink-3);\n    min-width: 18px;\n    padding-top: 3px;\n    flex-shrink: 0;\n    letter-spacing: 0.05em;\n  }\n  .option-btn.selected .option-tag { color: var(--accent); }\n  .q-nav {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    margin-top: 2rem;\n    gap: 1rem;\n  }\n\n  /* LIVE SCORE BARS */\n  .score-peek {\n    margin-top: 2.5rem;\n    padding-top: 1.5rem;\n    border-top: 1px solid var(--rule);\n  }\n  .score-peek-label {\n    font-family: var(--mono);\n    font-size: 10px;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n    margin-bottom: 1rem;\n  }\n  .score-bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }\n  .score-bar-name { font-family: var(--mono); font-size: 11px; color: var(--ink-2); min-width: 120px; letter-spacing: 0.04em; }\n  .score-bar-track { flex: 1; height: 3px; background: var(--paper-3); }\n  .score-bar-fill { height: 100%; transition: width 0.5s ease; }\n  .fill-job { background: #6c63ff; }\n  .fill-ms_course { background: var(--accent-2); }\n  .fill-ms_research { background: var(--teal); }\n  .fill-phd { background: var(--accent); }\n  .score-bar-val { font-family: var(--mono); font-size: 10px; color: var(--ink-3); min-width: 24px; text-align: right; }\n\n  /* RESULT */\n  .result-block { animation: fadeIn 0.5s ease; }\n  .result-header {\n    padding: 2rem;\n    border: 1px solid var(--rule);\n    margin-bottom: 1.5rem;\n    background: var(--paper-2);\n    position: relative;\n    overflow: hidden;\n  }\n  .result-header::before {\n    content: '';\n    position: absolute;\n    top: 0; left: 0; bottom: 0;\n    width: 4px;\n  }\n  .result-header.path-job::before { background: #6c63ff; }\n  .result-header.path-ms_course::before { background: var(--accent-2); }\n  .result-header.path-ms_research::before { background: var(--teal); }\n  .result-header.path-phd::before { background: var(--accent); }\n  .result-path-label {\n    font-family: var(--mono);\n    font-size: 10px;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n    margin-bottom: 0.5rem;\n  }\n  .result-path-name {\n    font-family: var(--serif);\n    font-size: 2.4rem;\n    color: var(--ink);\n    font-weight: 400;\n    line-height: 1.15;\n    margin-bottom: 0.3rem;\n  }\n  .result-path-sub { font-size: 0.9rem; color: var(--ink-3); margin-bottom: 1.5rem; }\n  .confidence-row { display: flex; align-items: center; gap: 1rem; }\n  .confidence-track { flex: 1; height: 3px; background: var(--paper-3); }\n  .confidence-fill { height: 100%; background: var(--teal); transition: width 1s ease; }\n  .confidence-text { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }\n\n  .result-section { margin-bottom: 1.5rem; }\n  .result-section-label {\n    font-family: var(--mono);\n    font-size: 10px;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: var(--ink-3);\n    margin-bottom: 0.75rem;\n    padding-bottom: 0.5rem;\n    border-bottom: 1px solid var(--rule);\n  }\n  .result-explanation { font-size: 0.95rem; color: var(--ink-2); line-height: 1.75; }\n\n  .caveat-list { list-style: none; margin-top: 0.5rem; }\n  .caveat-list li {\n    display: flex;\n    gap: 0.75rem;\n    padding: 0.6rem 0;\n    border-bottom: 1px solid var(--rule);\n    font-size: 0.875rem;\n    color: var(--ink-2);\n    line-height: 1.6;\n  }\n  .caveat-list li::before {\n    content: '!';\n    font-family: var(--mono);\n    font-size: 10px;\n    color: var(--accent);\n    background: #fdf0ee;\n    border: 1px solid #e8bfba;\n    width: 18px; height: 18px;\n    display: flex; align-items: center; justify-content: center;\n    flex-shrink: 0;\n    margin-top: 2px;\n  }\n\n  .test-next-block { border: 1px solid var(--rule); padding: 1.5rem; background: var(--paper); }\n  .test-next-label {\n    font-family: var(--mono);\n    font-size: 10px;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: var(--accent);\n    margin-bottom: 0.5rem;\n  }\n  .test-next-block h3 { font-family: var(--serif); font-size: 1.3rem; font-weight: 400; margin-bottom: 0.4rem; color: var(--ink); }\n  .test-next-block > p { font-size: 0.875rem; color: var(--ink-3); margin-bottom: 1rem; }\n  .test-next-list { list-style: none; }\n  .test-next-list li {\n    display: flex; gap: 0.6rem;\n    padding: 0.55rem 0;\n    border-top: 1px solid var(--rule);\n    font-size: 0.875rem; color: var(--ink-2); line-height: 1.6;\n  }\n  .test-next-list li::before { content: '→'; color: var(--accent); flex-shrink: 0; font-size: 0.8rem; margin-top: 2px; }\n\n  .breakdown-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.5rem; }\n  @media (max-width: 480px) { .breakdown-grid { grid-template-columns: 1fr; } }\n  .breakdown-item { padding: 0.75rem 1rem; background: var(--paper-2); border: 1px solid var(--rule); }\n  .breakdown-item.winner { border-color: var(--teal); background: var(--teal-light); }\n  .breakdown-name { font-size: 0.8rem; font-weight: 500; color: var(--ink); margin-bottom: 0.25rem; }\n  .breakdown-bar-track { height: 3px; background: var(--paper-3); margin-bottom: 0.3rem; }\n  .breakdown-bar-fill { height: 100%; transition: width 0.8s ease; }\n  .breakdown-pct { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }\n  .result-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 2rem; }\n\n  /* OPPORTUNITY COST */\n  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin: 1.5rem 0; }\n  @media (max-width: 600px) { .two-col { grid-template-columns: 1fr; } .stat-row { grid-template-columns: 1fr; } }\n  .path-column { padding: 1.5rem; border: 1px solid var(--rule); }\n  .path-column h4 {\n    font-family: var(--serif);\n    font-size: 1.3rem;\n    font-weight: 400;\n    margin-bottom: 1rem;\n    padding-bottom: 0.75rem;\n    border-bottom: 1px solid var(--rule);\n  }\n  .path-column.ms-col h4 { color: var(--teal); }\n  .path-column.work-col h4 { color: var(--accent-2); }\n  .path-column ul { list-style: none; font-size: 0.875rem; color: var(--ink-2); line-height: 1.7; }\n  .path-column ul li { padding: 0.3rem 0; border-bottom: 1px dashed var(--rule); padding-left: 0.8rem; position: relative; }\n  .path-column ul li::before { content: '·'; position: absolute; left: 0; color: var(--ink-3); }\n\n  /* WHO SHOULDN'T */\n  .warning-block {\n    border: 1px solid #e8bfba; background: #fdf0ee;\n    padding: 1.5rem; margin: 1.5rem 0;\n    display: flex; gap: 1rem; align-items: flex-start;\n  }\n  .warning-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }\n  .warning-block h4 { font-weight: 500; color: var(--ink); margin-bottom: 0.4rem; font-size: 0.95rem; }\n  .warning-block p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.6; }\n  .ok-block {\n    border: 1px solid #b3d8d4; background: var(--teal-light);\n    padding: 1.5rem; margin: 1.5rem 0;\n    display: flex; gap: 1rem; align-items: flex-start;\n  }\n  .ok-block h4 { font-weight: 500; color: var(--teal); margin-bottom: 0.4rem; font-size: 0.95rem; }\n  .ok-block p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.6; }\n\n  /* WHAT TO TEST NEXT PAGE */\n  .action-card {\n    border: 1px solid var(--rule); padding: 1.5rem; margin-bottom: 1rem;\n    background: var(--paper); position: relative; overflow: hidden;\n  }\n  .action-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }\n  .action-card.type-research::before { background: var(--teal); }\n  .action-card.type-ms::before { background: var(--accent-2); }\n  .action-card.type-job::before { background: #6c63ff; }\n  .action-card.type-phd::before { background: var(--accent); }\n  .action-card-tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }\n  .type-research .action-card-tag { color: var(--teal); }\n  .type-ms .action-card-tag { color: var(--accent-2); }\n  .type-job .action-card-tag { color: #6c63ff; }\n  .type-phd .action-card-tag { color: var(--accent); }\n  .action-card h4 { font-weight: 500; font-size: 1rem; color: var(--ink); margin-bottom: 0.4rem; }\n  .action-card p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.6; }\n  .action-card .timeline-tag { font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 0.75rem; letter-spacing: 0.06em; }\n\n  /* TOC */\n  .toc { margin: 3rem 0 2rem; }\n  .toc-item {\n    display: flex; align-items: center; gap: 1rem;\n    padding: 1rem 0; border-bottom: 1px solid var(--rule);\n    cursor: pointer; transition: color 0.15s;\n  }\n  .toc-item:hover { color: var(--accent); }\n  .toc-item:hover .toc-arrow { opacity: 1; transform: translateX(4px); }\n  .toc-num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 2rem; }\n  .toc-title { font-family: var(--serif); font-size: 1.2rem; font-weight: 400; flex: 1; }\n  .toc-tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); display: none; }\n  @media (min-width: 500px) { .toc-tag { display: block; } }\n  .toc-arrow { font-size: 1rem; color: var(--accent); opacity: 0; transition: opacity 0.15s, transform 0.15s; }\n\n  .disclaimer {\n    background: var(--paper-2); border-top: 1px solid var(--rule);\n    padding: 1rem 2rem; font-size: 0.8rem; color: var(--ink-3); text-align: center; line-height: 1.6;\n  }\n  .divider { border: none; border-top: 1px solid var(--rule); margin: 2.5rem 0; }\n<\/style>\n<\/head>\n<body>\n\n<nav>\n  <div class=\"nav-brand\">Ashoka University · <span>CS Higher Ed<\/span><\/div>\n  <div class=\"nav-progress\" id=\"navDots\"><\/div>\n<\/nav>\n\n<\!-- PAGE 0: INDEX -->\n<div class=\"page active\" id=\"page-0\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Post Graduate Office · Computer Science<\/div>\n    <h1>Should I pursue<br><em>higher education?<\/em><\/h1>\n    <p class=\"hero-lead\">A guide for CS undergraduates who are weighing what to do after their degree. Powered by the Post Graduate Office at Ashoka University.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"toc\">\n      <div class=\"toc-item\" onclick=\"goTo(1)\">\n        <span class=\"toc-num\">01<\/span>\n        <span class=\"toc-title\">What is higher education in CS?<\/span>\n        <span class=\"toc-tag\">Info<\/span>\n        <span class=\"toc-arrow\">→<\/span>\n      <\/div>\n      <div class=\"toc-item\" onclick=\"goTo(2)\">\n        <span class=\"toc-num\">02<\/span>\n        <span class=\"toc-title\">What does an MS or PhD actually look like?<\/span>\n        <span class=\"toc-tag\">Info<\/span>\n        <span class=\"toc-arrow\">→<\/span>\n      <\/div>\n      <div class=\"toc-item\" onclick=\"goTo(3)\">\n        <span class=\"toc-num\">03<\/span>\n        <span class=\"toc-title\">What changes after an MS vs staying in industry?<\/span>\n        <span class=\"toc-tag\">Info<\/span>\n        <span class=\"toc-arrow\">→<\/span>\n      <\/div>\n      <div class=\"toc-item\" onclick=\"goTo(4)\">\n        <span class=\"toc-num\">04<\/span>\n        <span class=\"toc-title\">Decision tool — find your path<\/span>\n        <span class=\"toc-tag\">Interactive<\/span>\n        <span class=\"toc-arrow\">→<\/span>\n      <\/div>\n      <div class=\"toc-item\" onclick=\"goTo(5)\">\n        <span class=\"toc-num\">05<\/span>\n        <span class=\"toc-title\">Opportunity cost<\/span>\n        <span class=\"toc-tag\">Info<\/span>\n        <span class=\"toc-arrow\">→<\/span>\n      <\/div>\n      <div class=\"toc-item\" onclick=\"goTo(6)\">\n        <span class=\"toc-num\">06<\/span>\n        <span class=\"toc-title\">Who should not do a PhD<\/span>\n        <span class=\"toc-tag\">Info<\/span>\n        <span class=\"toc-arrow\">→<\/span>\n      <\/div>\n      <div class=\"toc-item\" onclick=\"goTo(7)\">\n        <span class=\"toc-num\">07<\/span>\n        <span class=\"toc-title\">What to test next<\/span>\n        <span class=\"toc-tag\">Action<\/span>\n        <span class=\"toc-arrow\">→<\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <span><\/span>\n    <span class=\"page-label\">7 sections · ~20 min read<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(1)\">Start reading →<\/button>\n  <\/div>\n  <div class=\"disclaimer\">This resource is maintained by the Ashoka University Post Graduate Office. Information reflects general patterns and may not reflect your individual circumstances.<\/div>\n<\/div>\n\n<\!-- PAGE 1: WHAT IS HIGHER ED -->\n<div class=\"page\" id=\"page-1\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 01 — Introduction<\/div>\n    <h1>What is higher<br>education <em>in CS?<\/em><\/h1>\n    <p class=\"hero-lead\">A look at the different paths, what they're actually for, and who they're designed to serve.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <p>After a bachelor's degree in Computer Science, you broadly have three paths: join the workforce, pursue a taught master's (MS), or pursue a research degree (MS or PhD). These are very different things in terms of duration, learning outcomes and skill building.<\/p>\n      <p>Higher education is not a sequel to a bachelor's. It is a different kind of institution with very different incentives, that may not appeal to everyone. Your decision depends on whether you believe that higher education is indispensable for the career you aim to build.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>The three paths at a glance<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card\">\n          <div class=\"card-label\">Path 01<\/div>\n          <h4>Coursework MS<\/h4>\n          <p>1.5–2 years. Structured classes. Designed to make you a better thinker rather than a better coder. Courses are usually specialisations in CS topics such as ML, systems, or HCI. Ends in a project or capstone under the department. Serves for entry into better industry roles.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Path 02<\/div>\n          <h4>Research MS<\/h4>\n          <p>1.5–2.5 years. Mix of courses and independent research. Ends in a thesis under an advisor. This serves as a trial run for a PhD. Useful if you want to test research before committing to 4–6 years.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Path 03<\/div>\n          <h4>PhD<\/h4>\n          <p>4–6 years. You are no longer a student in any traditional sense. You are a researcher who happens to take occasional courses while working in a lab full time. You produce new knowledge, are paid a stipend and your relationship with your advisor is central to your experience.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>What higher education is <em>not<\/em><\/h2>\n      <p>It is not a safe option when you're unsure what to do. It is not a signal of intelligence — it is a signal of a specific kind of interest. It is not always the highest-paying path. And in CS, a master's is NOT required to do high-quality work in industry.<\/p>\n      <p>Many of the best software engineers, ML practitioners, and engineering leaders in India and abroad do not have postgraduate degrees. Some of the best researchers do.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>The Indian CS context<\/h2>\n      <p>If you're at Ashoka, you likely have peers going to IIT master's programmes, BITS dual-degree alumni entering the market, and some going abroad to universities like CMU, UMass, or UT Austin. Here's what's worth knowing:<\/p>\n      <div class=\"card-grid\">\n        <div class=\"card\">\n          <div class=\"card-label\">India<\/div>\n          <h4>IIT / IISc MS & MTech<\/h4>\n          <p>Heavily research-oriented. Strong brand in Indian academia and some industry roles. Stipends for research MS. Competitive admissions via GATE / direct interview for top candidates.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Abroad<\/div>\n          <h4>US / Europe MS<\/h4>\n          <p>Coursework MS programmes (CMU, Columbia, UCSD) are self-funded or loan-based. Expensive ($60–90K total). Strong return if you intend to stay or work abroad. Return on investment is real but not guaranteed.<\/p>\n        <\/div>\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">Both<\/div>\n          <h4>PhD — fully funded<\/h4>\n          <p>A PhD should never be self-funded. Both IIITs/IISc in India and most US/EU programmes fund PhD students with stipends. If someone asks you to pay for a PhD, that is a red flag.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>What Ashoka prepares you for<\/h2>\n      <p>Ashoka's CS programme is liberal-arts inflected — you've likely done courses outside CS, thought about ethics, policy, and systems in ways that most engineering students haven't. This is actually a meaningful differentiator for research (interdisciplinary problems) and for some MS programmes that value breadth.<\/p>\n      <p>It can also mean your coding interview prep may need work compared to peers from engineering colleges. Be honest with yourself about this gap before applying.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(0)\">← Back<\/button>\n    <span class=\"page-label\">01 / 07<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(2)\">Next →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 2: DAY TO DAY -->\n<div class=\"page\" id=\"page-2\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 02 — Reality Check<\/div>\n    <h1>What does an MS<br>or PhD <em>actually look like?<\/em><\/h1>\n    <p class=\"hero-lead\">The lived reality of a student pursuing higher education. What do you spend your days doing, and what does that demand of you?<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <p>Students applying to graduate school should have a clear idea of their lifestyle for the next few years, especially how it differs from their undergraduate education.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>A week in a coursework MS<\/h2>\n      <div class=\"timeline\">\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Mon–Tue<\/div>\n          <h4>Lectures and readings<\/h4>\n          <p>Attend 2–3 classes. Read papers and textbooks assigned for the week. CS master's courses move fast — a week may cover material that took a month in undergrad.<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Wed–Thu<\/div>\n          <h4>Assignments and problem sets<\/h4>\n          <p>Most courses have weekly homework. Expect to code, derive, and debug. In systems or ML courses, assignments can take 10–20 hours each. Group work is common but graded individually at most schools.<\/p>\n        <\/div>\n        <div class=\"timeline-item highlight\">\n          <div class=\"timeline-year\">Fri–Sun<\/div>\n          <h4>Projects and catching up<\/h4>\n          <p>Term projects run alongside coursework. Most students spend weekends on these. Social life exists, but it is not the same as undergrad. You are working most of the time.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>A week in a PhD programme<\/h2>\n      <p>After the first year of coursework, a PhD student's week looks very different, and rather unstructured.<\/p>\n      <div class=\"timeline\">\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Variable<\/div>\n          <h4>Reading papers<\/h4>\n          <p>A serious PhD student reads 3–10 papers a week, depending on the stage of their research. This is how you understand what already exists and where the gaps are.<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Variable<\/div>\n          <h4>Running experiments<\/h4>\n          <p>In CS, this usually means writing code, training models, running ablations, and debugging for days with no visible progress. A single paper can take 6–18 months of experimental work.<\/p>\n        <\/div>\n        <div class=\"timeline-item highlight\">\n          <div class=\"timeline-year\">Weekly<\/div>\n          <h4>Advisor meetings<\/h4>\n          <p>Most PhD students meet their advisor once a week. This meeting is the compass of your programme. A good advisor gives direction and opens doors. A mismatched or absent advisor is one of the most common reasons PhDs stall or fail.<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Ongoing<\/div>\n          <h4>Writing<\/h4>\n          <p>Papers, grant proposals, literature reviews. Strong academic writing is essential and very different from technical writing. Many students underestimate how much of a PhD is writing.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>The advisor relationship<\/h2>\n      <p>This is the most important factor in a PhD experience, and almost no one talks about it before they apply. Your advisor controls your funding, your publication record, your graduation timeline, and often your first job.<\/p>\n      <div class=\"card-grid\">\n        <div class=\"card\">\n          <div class=\"card-label\">Ask them<\/div>\n          <h4>Graduation timeline<\/h4>\n          <p>How long do their students typically take? Are there students who left without finishing? Why?<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Ask current students<\/div>\n          <h4>Mentoring style<\/h4>\n          <p>Hands-on or hands-off? Some students need direction; others need autonomy. Know which you are.<\/p>\n        <\/div>\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">Red flags<\/div>\n          <h4>Advisor warning signs<\/h4>\n          <p>No recent publications from their students. No students willing to talk to you. High rate of students changing advisors or leaving the programme.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>The core of a strong PhD application<\/h2>\n      <p>A strong PhD application is anchored in a clearly defined and well-thought-out research question. Admissions committees are not just looking for interest in a field — they want to see that you have already begun to narrow down a specific problem you care about and can articulate why it matters. This question should feel purposeful and feasible, not vague or overly broad.<\/p>\n      <p>Just as importantly, you need to demonstrate that you have the skills to pursue this question. Prior research experience, projects, or relevant coursework should clearly build toward your proposed area of study, showing that you understand the tools and challenges involved. When your past work connects naturally to your research direction, it signals both preparation and intent.<\/p>\n      <p>If you do not yet have a well-defined question, a PhD may not be the right step right now.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(1)\">← Back<\/button>\n    <span class=\"page-label\">02 / 07<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(3)\">Next →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 3: MS VS INDUSTRY -->\n<div class=\"page\" id=\"page-3\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 03 — Outcomes<\/div>\n    <h1>What changes after an MS<br>vs <em>staying in industry?<\/em><\/h1>\n    <p class=\"hero-lead\">Roles, salary trajectories, and geography — a realistic look at what the MS credential actually buys you in the CS job market.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <p>The honest answer is: it depends on what you want to do. In some specialisations, an MS is a significant accelerant. In others, two years of strong engineering experience will beat a degree. Here's the breakdown.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Roles and doors<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">MS advantage<\/div>\n          <h4>Research engineering<\/h4>\n          <p>At labs like DeepMind, Google Brain, Microsoft Research, Meta AI — a research-focused MS or PhD is essentially required. Most research engineer roles explicitly list it.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">MS advantage<\/div>\n          <h4>ML / AI specialisation<\/h4>\n          <p>For senior ML roles (Staff ML Engineer and above), a graduate degree is common but not universal. Companies like Clearco, Swiggy, Flipkart hire strong self-taught engineers, but a degree accelerates the path.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Industry wins<\/div>\n          <h4>Software engineering<\/h4>\n          <p>For SWE roles, a BSc and strong coding skills are sufficient. Many top SWEs at FAANG/Indian startups do not have postgraduate degrees. The MS primarily shifts your starting level — L4 vs L3, for example.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Industry wins<\/div>\n          <h4>Product, Design, PM<\/h4>\n          <p>CS + work experience beats CS + MS for most product and design-adjacent roles. An MBA might eventually matter, but an MS rarely changes the trajectory here.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Salary: MS vs direct entry<\/h2>\n      <p>These are approximate figures to illustrate trajectories, not guarantees.<\/p>\n      <div class=\"stat-row\">\n        <div class=\"stat-cell\">\n          <div class=\"stat-number\">2<span>–3yr<\/span><\/div>\n          <div class=\"stat-label\">Typical time for direct-entry engineer<br>to reach senior level in India<\/div>\n        <\/div>\n        <div class=\"stat-cell\">\n          <div class=\"stat-number\">1<span>–2yr<\/span><\/div>\n          <div class=\"stat-label\">MS grad typically enters<br>at a slightly senior level<\/div>\n        <\/div>\n        <div class=\"stat-cell\">\n          <div class=\"stat-number\">~2yr<\/div>\n          <div class=\"stat-label\">Approximate time to close<br>the gap for a strong direct hire<\/div>\n        <\/div>\n      <\/div>\n      <p>In the Indian market, the salary premium for an MS over a BS at the same company is meaningful but not dramatic — roughly one promotion's worth. For US roles, the premium is larger, especially in ML/AI.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Geography<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card\">\n          <div class=\"card-label\">If you want to work in India<\/div>\n          <h4>MS is optional<\/h4>\n          <p>A strong undergraduate record and good internship experience is sufficient for most roles. An IIT or IISc MS adds brand value but isn't a requirement. Indian startups and product companies hire on demonstrated ability.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">If you want to work abroad<\/div>\n          <h4>MS is often the visa pathway<\/h4>\n          <p>For the US in particular, an MS on an F-1 visa with OPT (Optional Practical Training) is one of the most reliable routes to employment. The degree's ROI is partly the credential and partly the work authorisation it provides.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>What an MS does <em>not<\/em> fix<\/h2>\n      <p>An MS will not fix a weak understanding of fundamentals. It will make you a better engineer/researcher only if your fundamentals are already strong. Graduate programmes assume you are already competent; they are not remedial. Students should be entirely confident and comfortable with their undergraduate coursework and skillset before pursuing higher education.<\/p>\n    <\/div>\n    <div class=\"pull-quote\">\n      <p>An MS deepens your knowledge and opens specialised or research roles, while going straight to industry gives you immediate experience, income, and faster career momentum.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(2)\">← Back<\/button>\n    <span class=\"page-label\">03 / 07<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(4)\">Take the decision tool →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 4: DECISION TOOL -->\n<div class=\"page\" id=\"page-4\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 04 — Decision Tool<\/div>\n    <h1>Find your <em>path<\/em><\/h1>\n    <p class=\"hero-lead\">Ten questions. Be honest — especially on the ones that are uncomfortable. The tool is only as useful as your answers.<\/p>\n    <div class=\"hero-meta\">\n      <div class=\"hero-meta-item\"><span>10<\/span> questions<\/div>\n      <div class=\"hero-meta-item\"><span>~5<\/span> minutes<\/div>\n      <div class=\"hero-meta-item\"><span>4<\/span> possible paths<\/div>\n    <\/div>\n  <\/div>\n  <div class=\"quiz-wrap\">\n    <div class=\"quiz-progress-bar\">\n      <div class=\"quiz-progress-fill\" id=\"quizProgress\" style=\"width:0%\"><\/div>\n    <\/div>\n    <div class=\"progress-labels\">\n      <div class=\"progress-label-left\" id=\"progressLeft\">Question 1 of 10<\/div>\n      <div class=\"progress-label-right\" id=\"progressRight\">0% complete<\/div>\n    <\/div>\n    <div id=\"quizContent\"><\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(3)\">← Back<\/button>\n    <span class=\"page-label\">04 / 07<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(5)\">Next →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 5: OPPORTUNITY COST -->\n<div class=\"page\" id=\"page-5\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 05 — Opportunity Cost<\/div>\n    <h1>Two years of MS<br>vs <em>two years of work<\/em><\/h1>\n    <p class=\"hero-lead\">What do you actually give up when you go to graduate school? The numbers, the compounding, and what most people forget to count.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <p>Opportunity cost is what economists call the value of the next best alternative you give up. For most CS students from Ashoka, the question is: what does two years of a coursework MS cost you, compared to two years of working?<\/p>\n      <p>This is not a reason to avoid an MS. It is a reason to be clear about what you're trading.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>The financial picture<\/h2>\n      <p>Let's look at a rough comparison for an Ashoka CS graduate choosing between a US MS and direct employment.<\/p>\n      <div class=\"two-col\">\n        <div class=\"path-column ms-col\">\n          <h4>US Coursework MS (2 years)<\/h4>\n          <ul>\n            <li>Tuition: $60,000–90,000 total<\/li>\n            <li>Living expenses: $30,000–40,000<\/li>\n            <li>Loan interest (if applicable)<\/li>\n            <li>Lost salary: $0 income while studying<\/li>\n            <li>TA/RA funding: rare in coursework MS<\/li>\n            <li>Total outflow: $75–110K before first paycheck<\/li>\n          <\/ul>\n        <\/div>\n        <div class=\"path-column work-col\">\n          <h4>2 Years in Industry (India)<\/h4>\n          <ul>\n            <li>Starting salary: ₹10–18 LPA (good company)<\/li>\n            <li>Year 2 salary: ₹14–25 LPA with promotion<\/li>\n            <li>Skills: production systems, teamwork, shipping<\/li>\n            <li>Savings: meaningful capital accumulation<\/li>\n            <li>Network: industry peers, mentors<\/li>\n            <li>Total inflow: real money, real experience<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>The compounding effect<\/h2>\n      <p>Money compounds. Skills compound. Reputation compounds. When you go to grad school at 22, you are not just delaying income for two years — you are starting the compounding clock two years later. At 30, two years earlier in your career can mean a meaningful difference in your savings, your seniority, and your network depth.<\/p>\n      <p>The same logic applies in reverse: if an MS unlocks a role that pays significantly more, that premium also compounds. The question is whether the specific MS you're considering actually does that for the roles you want.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>What you can't buy back<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">Lost from working<\/div>\n          <h4>Research training<\/h4>\n          <p>The skills and habits of research — reading widely, thinking at the frontier, producing novel work — are hard to develop on the job. Industry provides breadth; research provides depth in a specific way.<\/p>\n        <\/div>\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">Lost from studying<\/div>\n          <h4>Early career momentum<\/h4>\n          <p>The people you work with in your first two years become lifelong professional connections. Being two years behind your peers in seniority can matter in certain fast-moving fields like early-stage startups.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>The PhD is different<\/h2>\n      <p>A PhD in CS (especially in the US) is fully funded — you receive a stipend of $25,000–38,000/year and your tuition is waived. You are still giving up higher industry salaries, but you are not going into debt. The opportunity cost is real (especially in AI/ML, where industry salaries are very high) but the financial risk profile is much lower than a self-funded MS.<\/p>\n      <p>The PhD opportunity cost is primarily time — 4 to 6 years of your career spent at research-level pay rather than industry-level pay. In a field where compensation is very high, that gap can be $500K–$1M over the programme duration. This is not to say don't do a PhD. It is to say: know what you're choosing.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Questions to ask yourself<\/h2>\n      <div class=\"timeline\">\n        <div class=\"timeline-item\">\n          <h4>What specific role does this unlock?<\/h4>\n          <p>Name a job title. Research whether companies hiring for it actually require or prefer the degree.<\/p>\n        <\/div>\n        <div class=\"timeline-item highlight\">\n          <h4>Can I get there without it in 3 years?<\/h4>\n          <p>Strong engineers often reach senior roles within 3 years of graduating. Would 3 years of focused work get you to the same place as an MS?<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <h4>What is my actual financial plan?<\/h4>\n          <p>Loans taken at 22 shape decisions at 28. Model the numbers honestly, including interest and delayed savings.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(4)\">← Back<\/button>\n    <span class=\"page-label\">05 / 07<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(6)\">Next →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 6: WHO SHOULD NOT -->\n<div class=\"page\" id=\"page-6\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 06 — Honest Advice<\/div>\n    <h1>Who should <em>not<\/em><br>do a PhD<\/h1>\n    <p class=\"hero-lead\">This page doesn't appear on university brochures. It should. Most of the unhappiest PhD students saw these signs before they applied and didn't take them seriously.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <p>A PhD is one of the best things you can do if you are the right person for it. It is one of the worst if you're not. The hard part is that many of the wrong reasons feel like the right reasons when you're 21.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Warning signs<\/h2>\n      <div class=\"warning-block\">\n        <div class=\"warning-icon\">⚠<\/div>\n        <div>\n          <h4>You're doing it for the title<\/h4>\n          <p>If your primary motivation is being called \"Doctor\" or the perceived prestige of a PhD, you will struggle. The daily experience of a PhD — failed experiments, rejected papers, unclear progress — is not compatible with prestige as a motivator. The title comes at the end of 5 years of often frustrating, unglamorous work.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"warning-block\">\n        <div class=\"warning-icon\">⚠<\/div>\n        <div>\n          <h4>You haven't actually tried research<\/h4>\n          <p>Many students apply to PhD programmes based on having done well in courses, without having done independent research. Course performance and research performance are correlated but not the same thing. Before applying, spend time — genuinely — trying to read papers, identify gaps, and produce something original. If you find it boring or painful, that is important information.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"warning-block\">\n        <div class=\"warning-icon\">⚠<\/div>\n        <div>\n          <h4>You hate uncertainty<\/h4>\n          <p>A PhD is structurally uncertain. You might work on something for a year and discover it doesn't work. Papers get rejected. Research directions change. Advisors leave. If you need clear milestones, predictable timelines, and regular external validation to function, a PhD will be very hard for you. Industry has reviews, sprints, and promotions. Research has rejection letters and silence.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"warning-block\">\n        <div class=\"warning-icon\">⚠<\/div>\n        <div>\n          <h4>You're avoiding a decision<\/h4>\n          <p>Graduate school is sometimes chosen because it feels safer than the uncertainty of job hunting. This is especially true after a difficult graduation market. Pursuing a PhD because you're uncertain about what else to do is a recipe for misery — you will be stuck doing something very demanding without the internal drive that makes it worthwhile.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"warning-block\">\n        <div class=\"warning-icon\">⚠<\/div>\n        <div>\n          <h4>You want a high salary quickly<\/h4>\n          <p>A PhD delays high earnings by 4–6 years. In CS, the industry salary curve is steep and starts early. If financial stability and early wealth accumulation are important to you right now, a PhD is not the fastest path. This is not a moral failing — it's just not aligned with that goal.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"warning-block\">\n        <div class=\"warning-icon\">⚠<\/div>\n        <div>\n          <h4>You haven't read papers and found them interesting<\/h4>\n          <p>If you have never read a research paper and thought \"I want to work on this problem,\" you are probably not ready for a PhD. Research motivation has to come from engagement with the actual content of a field — not from a vague interest in \"AI\" or \"systems.\" If you can name a specific open problem that genuinely interests you, that's a good sign. If you can't, keep looking before committing.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Signs you <em>might<\/em> be well-suited<\/h2>\n      <div class=\"ok-block\">\n        <div class=\"warning-icon\">✓<\/div>\n        <div>\n          <h4>You've done research and want more of it<\/h4>\n          <p>Not a course project — independent research, reading papers, producing something. If you've had this experience and found it genuinely engaging (not just impressive-looking on a resume), that's a meaningful signal.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"ok-block\">\n        <div class=\"warning-icon\">✓<\/div>\n        <div>\n          <h4>There's a specific problem you want to solve<\/h4>\n          <p>The best PhD students often have something they can't stop thinking about — a problem they find important and unsolved. It doesn't have to be a grand civilisational challenge. It has to be something you'd read about on a Sunday afternoon by choice.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"ok-block\">\n        <div class=\"warning-icon\">✓<\/div>\n        <div>\n          <h4>You're comfortable with delayed, uncertain feedback<\/h4>\n          <p>You can work on something for months without knowing if it's working. You can rebound from rejection. You can motivate yourself without a deadline. These are rare skills and they matter enormously.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"ok-block\">\n        <div class=\"warning-icon\">✓<\/div>\n        <div>\n          <h4>You want a career path that requires it<\/h4>\n          <p>Academic faculty positions require a PhD. Research scientist roles at frontier AI labs increasingly require one. If your specific goal has a PhD as a genuine prerequisite, that changes the calculus significantly.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"pull-quote\">\n      <p>\"The students who thrive in PhD programmes are not necessarily the smartest. They are the most curious and the most resilient.\"<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(5)\">← Back<\/button>\n    <span class=\"page-label\">06 / 07<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(7)\">Next →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 7: WHAT TO TEST NEXT -->\n<div class=\"page\" id=\"page-7\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 07 — Action<\/div>\n    <h1>What to <em>test next<\/em><\/h1>\n    <p class=\"hero-lead\">Before you commit to any path, there are low-cost experiments you can run. These take weeks or months — not years — and give you real signal on whether a direction is right for you.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <p>The most important thing you can do before applying to a graduate programme is gather firsthand evidence about your own preferences. The actions below are designed to do that — not to pad a CV, but to genuinely test a hypothesis about yourself.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>For students considering a PhD / Research MS<\/h2>\n      <div class=\"action-card type-phd\">\n        <div class=\"action-card-tag\">PhD test<\/div>\n        <h4>Read 5 papers in an area that interests you<\/h4>\n        <p>Not a survey — recent research papers (NeurIPS, ICML, ICLR, CVPR, SIGCOMM, depending on your area). Try to understand the problem, the proposed solution, and what's still open. Did you find this engaging or draining? That's your signal.<\/p>\n        <div class=\"timeline-tag\">TIME: 2–3 weeks<\/div>\n      <\/div>\n      <div class=\"action-card type-phd\">\n        <div class=\"action-card-tag\">PhD test<\/div>\n        <h4>Email a faculty member at Ashoka or another institution<\/h4>\n        <p>Ask if you can discuss their research area. A genuine interest in a researcher's work, communicated clearly, almost always gets a response. The conversation itself will tell you a lot about whether you find the field interesting when it's real and unpacked.<\/p>\n        <div class=\"timeline-tag\">TIME: 1–4 weeks (including response time)<\/div>\n      <\/div>\n      <div class=\"action-card type-phd\">\n        <div class=\"action-card-tag\">PhD test<\/div>\n        <h4>Try to reproduce a paper's results<\/h4>\n        <p>Pick a recent paper with open-source code. Try to run it, understand the architecture, and replicate a key result. This is as close to PhD-level daily work as you can get without enrolling. If you find it absorbing, that's real evidence. If you find it frustrating and pointless, that is also real evidence.<\/p>\n        <div class=\"timeline-tag\">TIME: 1–2 months<\/div>\n      <\/div>\n      <div class=\"action-card type-research\">\n        <div class=\"action-card-tag\">Research MS test<\/div>\n        <h4>Do an RA position with a faculty member<\/h4>\n        <p>Ashoka has researchers whose work spans NLP, HCI, computational biology, and systems. Approach them for a research assistant role, even informally. Being inside a research project — cleaning data, running baselines, reading relevant papers — shows you what the work actually demands.<\/p>\n        <div class=\"timeline-tag\">TIME: One semester<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>For students considering a coursework MS<\/h2>\n      <div class=\"action-card type-ms\">\n        <div class=\"action-card-tag\">MS test<\/div>\n        <h4>Audit a graduate-level course online<\/h4>\n        <p>Stanford CS229 (ML), MIT 6.824 (Distributed Systems), CMU 15-445 (Databases) are publicly available and genuinely graduate-level. Spend 4–6 weeks seriously engaging with one. If you find the pace and depth energising, that's a sign a coursework MS environment will suit you.<\/p>\n        <div class=\"timeline-tag\">TIME: 4–8 weeks<\/div>\n      <\/div>\n      <div class=\"action-card type-ms\">\n        <div class=\"action-card-tag\">MS test<\/div>\n        <h4>Talk to someone one year out of a programme you're considering<\/h4>\n        <p>Not someone on LinkedIn with a polished post. Someone who will tell you what was hard, what they wish they'd known, and whether they'd do it again. Ask specifically: what did the MS unlock that you couldn't have gotten otherwise?<\/p>\n        <div class=\"timeline-tag\">TIME: One conversation<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>For students considering going directly to work<\/h2>\n      <div class=\"action-card type-job\">\n        <div class=\"action-card-tag\">Industry test<\/div>\n        <h4>Apply for and do a technical internship<\/h4>\n        <p>If you haven't done a proper software engineering internship at a company with engineering culture (not a startup where you do everything), this should be your first move. It tells you whether you enjoy shipping production code, working in teams, and building at scale.<\/p>\n        <div class=\"timeline-tag\">TIME: 2–3 months<\/div>\n      <\/div>\n      <div class=\"action-card type-job\">\n        <div class=\"action-card-tag\">Industry test<\/div>\n        <h4>Build something real and get it used<\/h4>\n        <p>Build a side project, deploy it, and try to get 100 real users. The discipline required — scoping, iterating, maintaining — is different from coursework. If you enjoy the feedback loop of building and shipping, industry likely suits you. If you find yourself more interested in the underlying algorithm than the product, that's a signal too.<\/p>\n        <div class=\"timeline-tag\">TIME: 1–3 months<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>One final piece of advice<\/h2>\n      <div cla
