\" or \"Software Engineer at Google\").<\/li>\n          <li>Filter by company if you have a specific target in mind.<\/li>\n          <li>Click through to individual profiles and look at their education history.<\/li>\n          <li>Note patterns — which MS programmes appear repeatedly among people in that role at that company.<\/li>\n        <\/ul>\n        <p>Do this for 3–4 target roles or companies. Schools that appear repeatedly are the ones feeding into your target. Schools that never appear — regardless of their ranking, and regardless of whether they are public or private — may not be the right choice for your specific goal.<\/p>\n      <\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(2)\">← Cost<\/button>\n    <span class=\"page-label\">03 / 05<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(4)\">Next: Safety, Target, Dream →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 4: SAFETY TARGET DREAM -->\n<div class=\"page\" id=\"page-4\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 04 — School Categories<\/div>\n    <h1>Safety, Target,<br><em>Dream<\/em><\/h1>\n    <p class=\"hero-lead\">How to determine where each school falls relative to your profile, how many of each to apply to, and how to build a final list that gives you real options.<\/p>\n  <\/div>\n  <div class=\"content\">\n\n    <div class=\"section-block\">\n      <h2>What the categories mean<\/h2>\n      <div class=\"data-rows\">\n        <div class=\"data-row\">\n          <div class=\"data-key\">Safety<\/div>\n          <div class=\"data-val\">You are confident of admission. Your profile is at or above the median admitted student. A strong application is still required — being a safety school does not mean automatic acceptance.<\/div>\n        <\/div>\n        <div class=\"data-row\">\n          <div class=\"data-key\">Target<\/div>\n          <div class=\"data-val\">You have a realistic chance. Your profile is near the median admitted student — you could get in or not. These schools are the core of your list.<\/div>\n        <\/div>\n        <div class=\"data-row\">\n          <div class=\"data-key\">Dream<\/div>\n          <div class=\"data-val\">Admission would require your strongest possible application and some luck. Your profile is below the typical admitted student. Apply, but do not plan your life around these.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"warn-block\">\n        <div class=\"warn-icon\">→<\/div>\n        <p>These are probabilistic categories, not guarantees. A safety school can reject you. A dream school can admit you. The categories help you build a balanced list — they do not predict individual outcomes.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>How to determine where a school falls for you<\/h2>\n\n      <h3>Check programme statistics<\/h3>\n      <p>Most programmes publish or make available the average GPA and GRE score ranges of admitted students. Find these on the admissions page or FAQ for the specific programme. For Indian public institutes, the equivalent number is the previous years' GATE/JAM closing rank or score cutoff for the specific institute, department, and category.<\/p>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to find admission statistics<\/div>\n        <ul>\n          <li>Search: <em>[programme name] average GPA admitted students<\/em> or <em>[programme name] class profile.<\/em> For India: <em>[institute name] M.Tech CSE GATE cutoff [year].<\/em><\/li>\n          <li>For programmes that don't publish this, GradCafe (thegradcafe.com) has self-reported admission outcomes with GPA and test scores going back several years, for US/UK/Canada programmes.<\/li>\n          <li>University-specific Reddit communities (r/gradadmissions, r/MSCS) often have data points from recent application cycles. For India, r/developersIndia and GATE-specific forums serve a similar purpose.<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"warn-block\">\n        <div class=\"warn-icon\">→<\/div>\n        <p>GPA, test scores, and exam ranks are thresholds, not guarantees. Meeting the median does not mean you will be admitted. Falling below it does not mean you will be rejected (except in strictly rank-based Indian public admissions, where the cutoff is often close to a hard line). Research experience, statement of purpose quality, and recommendation letters move you significantly in either direction for holistic-admission programmes.<\/p>\n      <\/div>\n\n      <h3>Talk to current students<\/h3>\n      <p>The most accurate signal for where a school falls in your list is a conversation with someone who recently went through the process.<\/p>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to find current students<\/div>\n        <ul>\n          <li>LinkedIn: search for the programme name in the Education filter, filter by graduation year (current or last year), and message students directly. Introduce yourself as an Ashoka student considering the programme.<\/li>\n          <li>Many programmes have admitted student communities on Discord or Facebook — ask the admissions office if you can be added as a prospective student.<\/li>\n          <li>Contact the Ashoka PG Office — they maintain contact with recent graduates who have agreed to speak with current students, including those who went the India (public and private institute) route.<\/li>\n        <\/ul>\n        <p>Ask specific questions: \"What did your profile look like when you applied?\" and \"What do you think the programme values most in applicants?\" get more useful responses than \"Can you tell me about the programme?\"<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>How many schools to apply to<\/h2>\n      <div class=\"table-wrap\">\n        <table class=\"std-table\">\n          <thead><tr><th>Category<\/th><th>Recommended number<\/th><th>Why<\/th><\/tr><\/thead>\n          <tbody>\n            <tr><td class=\"tl\">Safety<\/td><td>2–3<\/td><td>Gives you real options if target and dream schools don't come through<\/td><\/tr>\n            <tr><td class=\"tl\">Target<\/td><td>3–4<\/td><td>The core of your list — schools you genuinely want to attend and have a real chance at<\/td><\/tr>\n            <tr><td class=\"tl\">Dream<\/td><td>2–3<\/td><td>Worth attempting; don't plan around these<\/td><\/tr>\n            <tr><td class=\"tl\" style=\"color:var(--ink);font-weight:600;\">Total<\/td><td style=\"font-weight:600;\">7–10<\/td><td>Fewer reduces real options; more than 12 degrades SOP quality across applications<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <p>Each application requires a customised statement of purpose. Quality drops when you are writing 15 of them. Fewer, better applications outperform more, weaker ones. If India is part of your list, remember GATE/JAM-based admissions run on a different calendar and format (a single national exam rather than individual SOPs), so budget for that separately rather than folding it into the same 7–10 count.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Building the list<\/h2>\n      <ul class=\"step-list\">\n        <li><span class=\"step-num\">01<\/span>Identify the role and location you want 3 years after graduation.<\/li>\n        <li><span class=\"step-num\">02<\/span>Find 5–10 people currently in that role on LinkedIn. Note where they did their master's.<\/li>\n        <li><span class=\"step-num\">03<\/span>Research those programmes using the faculty, placement, and cost criteria from sections 02 and 03.<\/li>\n        <li><span class=\"step-num\">04<\/span>Assign each school a category — safety, target, or dream — based on your profile against their admission statistics.<\/li>\n        <li><span class=\"step-num\">05<\/span>Check that your final list has schools in all three categories, and that your safety schools are ones you would genuinely attend.<\/li>\n      <\/ul>\n    <\/div>\n\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(3)\">← Programme<\/button>\n    <span class=\"page-label\">04 / 05<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(5)\">Next: Resources →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 5: RESOURCES -->\n<div class=\"page\" id=\"page-5\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 05 — Resources<\/div>\n    <h1>Tools and<br><em>resources<\/em><\/h1>\n    <p class=\"hero-lead\">The tools, databases, and Ashoka-specific resources that support every stage of the shortlisting process.<\/p>\n  <\/div>\n  <div class=\"content\">\n\n    <div class=\"section-block\">\n      <h2>Post Graduate Office<\/h2>\n      <p>The Ashoka PG Office maintains a spreadsheet of programmes applied to by previous Ashoka CS students, including outcomes (admitted, waitlisted, rejected) and anonymised profile information. This is the most Ashoka-specific resource available — use it to calibrate your list against what students with similar profiles have done, and to find alumni you can contact directly. This includes students who applied to Indian public and private institutes as well as international programmes.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Rankings<\/h2>\n      <p>Rankings are a starting point for discovery, not a decision tool. Use them to find programmes you haven't heard of — not to compare programmes you are already evaluating.<\/p>\n      <div class=\"data-rows\">\n        <div class=\"data-row\">\n          <div class=\"data-key\">CSRankings.org<\/div>\n          <div class=\"data-val\"><strong>Best for: research-oriented students.<\/strong> Measures actual faculty publication output at top CS conferences. Lets you filter by sub-field (ML, systems, theory, etc.) to see which programmes are strongest in your specific area, and includes several Indian public institutes (IITs, IISc) alongside US/UK/European/Canadian ones. Go to csrankings.org, select your sub-field from the checkboxes, and the ranking updates accordingly. Click on any programme name to see which specific faculty are driving the ranking — these are the people to consider contacting.<\/div>\n        <\/div>\n        <div class=\"data-row\">\n          <div class=\"data-key\">QS World Rankings (CS)<\/div>\n          <div class=\"data-val\"><strong>Best for: industry-oriented students and employer recognition.<\/strong> Measures global reputation, citations, and employer survey results. More useful than CSRankings if you are targeting roles in India after graduation, where QS rankings carry more recognition with employers than publication-based metrics, and where it covers both public (IITs, IISc) and private (BITS, IIIT-Hyderabad) Indian institutes.<\/div>\n        <\/div>\n        <div class=\"data-row\">\n          <div class=\"data-key\">US News (Graduate CS)<\/div>\n          <div class=\"data-val\"><strong>Best for: US programme comparison.<\/strong> Peer assessment scores from CS faculty across the US. Useful as a cross-reference alongside CSRankings. Less useful than CSRankings for sub-field specific comparisons.<\/div>\n        <\/div>\n        <div class=\"data-row\">\n          <div class=\"data-key\">NIRF Ranking<\/div>\n          <div class=\"data-val\"><strong>Best for: comparing Indian institutes specifically.<\/strong> India's official government ranking framework, published annually by the Ministry of Education, covers both public and private engineering/CS departments on a common set of parameters. Useful for comparing IITs, NITs, IIITs, and private institutes against each other on a single scale.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Research and discovery tools<\/h2>\n      <div class=\"table-wrap\">\n        <table class=\"std-table\">\n          <thead><tr><th>Tool<\/th><th>Use<\/th><th>How to access<\/th><\/tr><\/thead>\n          <tbody>\n            <tr>\n              <td class=\"tl\">LinkedIn<\/td>\n              <td>Alumni tracking, placement research, contacting current students and graduates<\/td>\n              <td>linkedin.com — use the Alumni tool on university pages and the Education filter in search<\/td>\n            <\/tr>\n            <tr>\n              <td class=\"tl\">GradCafe<\/td>\n              <td>Self-reported admission results with GPA, test scores, and decisions going back several years<\/td>\n              <td>thegradcafe.com — search by programme name and filter by year<\/td>\n            <\/tr>\n            <tr>\n              <td class=\"tl\">Google Scholar<\/td>\n              <td>Checking faculty publication activity and recency<\/td>\n              <td>scholar.google.com — search the faculty member's name and check dates of recent publications<\/td>\n            <\/tr>\n            <tr>\n              <td class=\"tl\">Numbeo<\/td>\n              <td>City-level cost of living comparisons — rent, food, transport<\/td>\n              <td>numbeo.com — search by city<\/td>\n            <\/tr>\n            <tr>\n              <td class=\"tl\">University CoA pages<\/td>\n              <td>Official cost of attendance including tuition, fees, health insurance, and living cost estimates<\/td>\n              <td>Search: <em>[university name] cost of attendance international students<\/em><\/td>\n            <\/tr>\n            <tr>\n              <td class=\"tl\">College Scorecard<\/td>\n              <td>Median earnings and median debt by US programme<\/td>\n              <td>collegescorecard.ed.gov — US programmes only<\/td>\n            <\/tr>\n            <tr>\n              <td class=\"tl\">GATE / JAM official portals<\/td>\n              <td>Exam registration, previous years' cutoffs, and category-wise closing ranks for Indian public institutes<\/td>\n              <td>Search: <em>GATE official website<\/em> or <em>JAM official website<\/em> for the current admission cycle<\/td>\n            <\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Useful links<\/h2>\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">University lists<\/div><div class=\"data-val\"><strong>CSRankings (all areas, worldwide)<\/strong> — <a href=\"https://csrankings.org/#/index?all&amp;world\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent)\">csrankings.org<\/a><br><strong>University list spreadsheet<\/strong> — <a href=\"https://docs.google.com/spreadsheets/d/17ZyAOAWHu1Jdv7t3P8W1er2ZhE8MwdeyyfMvknrDt5Q/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent)\">Open in Google Sheets<\/a><\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">SOP examples<\/div><div class=\"data-val\"><strong>CS PhD Statements of Purpose<\/strong> — <a href=\"https://cs-sop.notion.site/CS-PhD-Statements-of-Purpose-df39955313834889b7ac5411c37b958d\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent)\">cs-sop.notion.site<\/a><br><strong>Graduate Admissions repository<\/strong> — <a href=\"https://github.com/siddu1998/Graduate-Admissions/tree/main\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent)\">github.com/siddu1998<\/a><\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Suggested research workflow<\/h2>\n      <ul class=\"step-list\">\n        <li><span class=\"step-num\">01<\/span><strong>Decide on a region<\/strong> using the location page, including whether India (public or private) is part of your plan. Confirm the visa pathway (where relevant) and job market fit before spending time on individual schools.<\/li>\n        <li><span class=\"step-num\">02<\/span><strong>Use CSRankings, QS, or NIRF<\/strong> to generate an initial pool of 15–20 programmes in your area of interest.<\/li>\n        <li><span class=\"step-num\">03<\/span><strong>Check the PG Office spreadsheet<\/strong> to see how Ashoka students have fared at programmes on your initial list.<\/li>\n        <li><span class=\"step-num\">04<\/span><strong>For each programme<\/strong>, check faculty on the department website, placements on LinkedIn (or the institute's official placement report for Indian public institutes), and cost on the CoA page (or fee structure page).<\/li>\n        <li><span class=\"step-num\">05<\/span><strong>Use GradCafe<\/strong> (or GATE/JAM cutoff data for India) to assign each school a category — safety, target, or dream — based on your profile relative to admitted students.<\/li>\n        <li><span class=\"step-num\">06<\/span><strong>Talk to at least one current student<\/strong> at each programme you are seriously considering before finalising your list.<\/li>\n        <li><span class=\"step-num\">07<\/span><strong>Finalise at 7–10 schools<\/strong> with coverage across all three categories.<\/li>\n      <\/ul>\n    <\/div>\n\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(4)\">← Safety, Target, Dream<\/button>\n    <span class=\"page-label\">05 / 05<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(0)\">← Back to contents<\/button>\n  <\/div>\n  <div class=\"disclaimer\">This resource is maintained by the Ashoka University Post Graduate Office. Content does not constitute professional advice. Verify all programme details directly with the institution.<\/div>\n<\/div>\n\n<script>\nconst TOTAL_PAGES = 6;\nlet currentPage = 0;\n\nfunction buildNav() {\n  const container = document.getElementById('navDots');\n  container.innerHTML = '<span onclick=\"goTo(Math.max(0, currentPage - 1))\" style=\"font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:0.06em;cursor:pointer;margin-right:10px;\">← back<\/span>';\n  const labels = ['Contents','Location','Cost','Programme','Safety/Target/Dream','Resources'];\n  for (let i = 0; i < TOTAL_PAGES; i++) {\n    const dot = document.createElement('div');\n    dot.className = 'nav-dot' + (i === currentPage ? ' active' : (i < currentPage ? ' visited' : ''));\n    dot.onclick = () => goTo(i);\n    dot.title = labels[i];\n    container.appendChild(dot);\n  }\n}\n\nfunction goTo(n) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.getElementById('page-' + n).classList.add('active');\n  currentPage = n;\n  buildNav();\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n\nbuildNav();\n<\/script>\n<style>\n.pg-home{display:none;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:none;border:1px solid var(--rule);padding:.4rem .75rem;cursor:pointer;white-space:nowrap}\n.pg-home:hover{color:var(--accent);border-color:var(--accent)}\n.pg-home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\nbody.on-sub .pg-home{display:inline-flex}\nbody.on-sub nav .nav-brand{display:none}\n<\/style>\n<script>(function(){\nvar nav=document.querySelector('nav');if(!nav||typeof goTo!=='function')return;\nvar b=document.createElement('button');b.type='button';b.className='pg-home';b.textContent='\\u2190 Contents';\nb.title='Back to the start of this section';b.onclick=function(){goTo(0)};nav.insertBefore(b,nav.firstChild);\nfunction sync(){var a=document.querySelector('.page.active');var sub=!!a&&a.id!=='page-0';\n if(document.body.classList.contains('on-sub')!==sub)document.body.classList.toggle('on-sub',sub);}\nnew MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});sync();\nwindow.addEventListener('message',function(e){if(e.data==='pg-home')goTo(0)});\n})();<\/script>\n<\/body>\n<\/html>"}, {"id": "after", "title": "After you apply", "short": "After you apply", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>After You Apply — Ashoka CS<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --ink: #1a1a1a; --ink-2: #444; --ink-3: #888;\n    --paper: #faf8f3; --paper-2: #f2efe8; --paper-3: #e8e4da;\n    --accent: #c0392b; --accent-2: #e67e22;\n    --teal: #1a7a6e; --teal-light: #e8f5f3;\n    --rule: #ddd9d0;\n    --serif: 'DM Serif Display', Georgia, serif;\n    --sans: 'DM Sans', sans-serif;\n    --mono: 'DM Mono', monospace;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; font-size: 16px; line-height: 1.7; }\n\n  nav { position: fixed; top: 0; left: 0; right: 0; background: var(--paper); border-bottom: 1px solid var(--rule); z-index: 100; padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; }\n  .nav-brand { font-family: var(--mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }\n  .nav-brand span { color: var(--accent); }\n  .nav-progress { display: flex; gap: 6px; align-items: center; }\n  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--paper-3); cursor: pointer; transition: background 0.2s, transform 0.2s; }\n  .nav-dot.active { background: var(--accent); transform: scale(1.4); }\n  .nav-dot.visited { background: var(--ink-3); }\n\n  .page { display: none; min-height: 100vh; padding-top: 56px; animation: fadeIn 0.35s ease; }\n  .page.active { display: block; }\n  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n\n  .hero { padding: 5rem 2rem 4rem; max-width: 900px; margin: 0 auto; border-bottom: 1px solid var(--rule); }\n  .hero-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; }\n  .hero h1 { font-family: var(--serif); font-size: clamp(2.2rem, 4.5vw, 3.6rem); line-height: 1.15; color: var(--ink); margin-bottom: 1.4rem; font-weight: 400; }\n  .hero h1 em { font-style: italic; color: var(--accent); }\n  .hero-lead { font-size: 1.05rem; color: var(--ink-2); max-width: 600px; line-height: 1.75; }\n\n  .content { max-width: 900px; margin: 0 auto; padding: 3rem 2rem 6rem; }\n  .section-block { margin-bottom: 3.5rem; }\n  .section-block h2 { font-family: var(--serif); font-size: 1.75rem; font-weight: 400; margin-bottom: 1rem; color: var(--ink); }\n  .section-block h3 { font-family: var(--sans); font-size: 0.875rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); margin-bottom: 0.75rem; margin-top: 2rem; }\n  .section-block p { color: var(--ink-2); margin-bottom: 1rem; }\n  .section-block p:last-child { margin-bottom: 0; }\n  .section-block strong { color: var(--ink); font-weight: 500; }\n\n  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin: 1.5rem 0; }\n  .card { background: var(--paper-2); border: 1px solid var(--rule); padding: 1.25rem 1.25rem 1.5rem; }\n  .card-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.5rem; }\n  .card h4 { font-family: var(--serif); font-size: 1.1rem; font-weight: 400; margin-bottom: 0.5rem; color: var(--ink); }\n  .card p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.6; }\n  .card.accent-card { background: #fdf0ee; border-color: #e8bfba; }\n  .card.teal-card { background: var(--teal-light); border-color: #b3d8d4; }\n\n  .data-rows { border: 1px solid var(--rule); margin: 1.5rem 0; }\n  .data-row { display: grid; grid-template-columns: 180px 1fr; border-bottom: 1px solid var(--rule); }\n  .data-row:last-child { border-bottom: none; }\n  .data-key { padding: 0.85rem 1rem; background: var(--paper-2); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; display: flex; align-items: flex-start; padding-top: 1rem; }\n  .data-val { padding: 0.85rem 1.25rem; font-size: 0.9rem; color: var(--ink-2); line-height: 1.65; }\n  .data-val strong { color: var(--ink); font-weight: 500; }\n  @media (max-width: 560px) { .data-row { grid-template-columns: 1fr; } .data-key { border-bottom: 1px solid var(--rule); padding-bottom: 0.5rem; } }\n\n  .howto { border: 1px solid #b3d8d4; background: var(--teal-light); padding: 1.25rem 1.5rem; margin: 1.25rem 0; }\n  .howto-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); margin-bottom: 0.6rem; }\n  .howto p { font-size: 0.875rem; color: var(--ink-2); margin-bottom: 0.5rem; line-height: 1.65; }\n  .howto p:last-child { margin-bottom: 0; }\n  .howto ul { padding-left: 1.1rem; margin-top: 0.4rem; }\n  .howto ul li { font-size: 0.875rem; color: var(--ink-2); line-height: 1.65; margin-bottom: 0.4rem; }\n\n  .warn-block { border: 1px solid #e8bfba; background: #fdf0ee; padding: 1.1rem 1.5rem; margin: 1.25rem 0; display: flex; gap: 1rem; align-items: flex-start; }\n  .warn-icon { font-size: 1rem; flex-shrink: 0; color: var(--accent); margin-top: 2px; }\n  .warn-block p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.6; }\n\n  .table-wrap { overflow-x: auto; margin: 1.5rem 0; -webkit-overflow-scrolling: touch; }\n  .std-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; min-width: 480px; }\n  .std-table th { background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.75rem 1rem; text-align: left; font-weight: 400; white-space: nowrap; }\n  .std-table td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--rule); color: var(--ink-2); vertical-align: top; line-height: 1.55; }\n  .std-table tr:nth-child(even) td { background: var(--paper-2); }\n  .std-table .tl { font-weight: 500; color: var(--ink); }\n\n  .step-list { list-style: none; margin: 1rem 0; }\n  .step-list li { display: flex; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid var(--rule); font-size: 0.9rem; color: var(--ink-2); line-height: 1.6; align-items: flex-start; }\n  .step-list li:last-child { border-bottom: none; }\n  .step-num { font-family: var(--mono); font-size: 11px; color: var(--accent); min-width: 20px; padding-top: 2px; flex-shrink: 0; }\n\n  .part-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 2.5rem 0 0.25rem; }\n  .part-label:first-child { margin-top: 0; }\n  .toc { margin: 0.5rem 0 1rem; }\n  .toc-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--rule); cursor: pointer; transition: color 0.15s; }\n  .toc-item:hover { color: var(--accent); }\n  .toc-item:hover .toc-arrow { opacity: 1; transform: translateX(4px); }\n  .toc-num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 2rem; }\n  .toc-title { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; flex: 1; }\n  .toc-meta { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.05em; display: none; }\n  @media (min-width: 500px) { .toc-meta { display: block; } }\n  .toc-arrow { font-size: 1rem; color: var(--accent); opacity: 0; transition: opacity 0.15s, transform 0.15s; }\n\n  /* TIMELINE */\n  .timeline { border-left: 2px solid var(--rule); margin: 1.5rem 0 0 0.4rem; padding-left: 1.5rem; }\n  .tl-item { position: relative; padding-bottom: 1.4rem; }\n  .tl-item:last-child { padding-bottom: 0; }\n  .tl-item::before { content: ''; position: absolute; left: calc(-1.5rem - 6px); top: 0.45rem; width: 10px; height: 10px; border-radius: 50%; background: var(--paper); border: 2px solid var(--accent); }\n  .tl-when { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }\n  .tl-what { font-size: 0.9rem; color: var(--ink-2); line-height: 1.6; }\n  .tl-what strong { color: var(--ink); font-weight: 500; }\n\n  /* CHECKLIST */\n  .checklist { list-style: none; margin: 1rem 0; }\n  .checklist li { border-bottom: 1px solid var(--rule); }\n  .checklist li:last-child { border-bottom: none; }\n  .checklist label { display: flex; gap: 0.85rem; align-items: flex-start; padding: 0.7rem 0; font-size: 0.9rem; color: var(--ink-2); line-height: 1.6; cursor: pointer; }\n  .checklist input { appearance: none; -webkit-appearance: none; flex: none; width: 16px; height: 16px; margin-top: 4px; border: 1px solid var(--ink-3); background: var(--paper); cursor: pointer; display: grid; place-content: center; }\n  .checklist input:checked { background: var(--teal); border-color: var(--teal); }\n  .checklist input:checked::after { content: ''; width: 8px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }\n  .checklist input:checked + span { color: var(--ink-3); text-decoration: line-through; }\n  .checklist input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n  .country-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); margin: 1.5rem 0 0; overflow-x: auto; scrollbar-width: none; }\n  .country-tabs::-webkit-scrollbar { display: none; }\n  .ctab { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 0.6rem 1rem; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); cursor: pointer; }\n  .ctab:hover { color: var(--ink); }\n  .ctab.active { color: var(--ink); border-bottom-color: var(--accent); }\n  .ctab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }\n  .cpanel { display: none; padding-top: 1.5rem; }\n  .cpanel.active { display: block; }\n\n  /* COMPARISON TOOL */\n  .tool { border: 1px solid var(--rule); background: var(--paper-2); padding: 1.5rem; margin: 1.5rem 0; }\n  .tool-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.4rem; }\n  .tool h4 { font-family: var(--serif); font-size: 1.3rem; font-weight: 400; margin-bottom: 0.4rem; }\n  .tool-note { font-size: 0.85rem; color: var(--ink-3); margin-bottom: 1.25rem; line-height: 1.6; }\n  .weights { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.75rem 1.25rem; padding: 1rem 0 1.25rem; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 1.25rem; }\n  .field-label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.3rem; }\n  select, .offer input[type=\"text\"], .offer input[type=\"number\"] { width: 100%; font: 400 0.9rem var(--sans); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); padding: 0.45rem 0.6rem; border-radius: 0; }\n  select:focus, .offer input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }\n  .offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }\n  .offer { background: var(--paper); border: 1px solid var(--rule); padding: 1rem; display: flex; flex-direction: column; gap: 0.7rem; }\n  .offer-head { display: flex; justify-content: space-between; align-items: center; }\n  .offer-num { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; }\n  .offer-remove { background: none; border: 0; font: 400 11px var(--mono); color: var(--ink-3); cursor: pointer; letter-spacing: 0.06em; }\n  .offer-remove:hover { color: var(--accent); }\n  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }\n  .rating { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }\n  .rating .field-label { margin: 0; }\n  .dots { display: flex; gap: 4px; }\n  .dots button { width: 22px; height: 22px; border: 1px solid var(--rule); background: var(--paper); font: 400 10px var(--mono); color: var(--ink-3); cursor: pointer; padding: 0; }\n  .dots button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }\n  .dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }\n  .tool-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.25rem; }\n  .results { margin-top: 1.5rem; display: none; }\n  .results.show { display: block; }\n  .result-row { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: 0.75rem; align-items: center; padding: 0.85rem 0; border-bottom: 1px solid var(--rule); }\n  .result-rank { font-family: var(--mono); font-size: 12px; color: var(--accent); }\n  .result-name { font-family: var(--serif); font-size: 1.1rem; }\n  .result-sub { font-size: 0.8rem; color: var(--ink-3); font-family: var(--mono); letter-spacing: 0.03em; }\n  .result-score { font-family: var(--mono); font-size: 1rem; color: var(--ink); text-align: right; }\n  .bar { grid-column: 2 / 4; height: 4px; background: var(--paper-3); }\n  .bar span { display: block; height: 100%; background: var(--teal); }\n  .result-row.top .bar span { background: var(--accent); }\n  .result-caveat { font-size: 0.85rem; color: var(--ink-2); margin-top: 1rem; line-height: 1.6; }\n\n  .page-nav { max-width: 900px; margin: 0 auto; padding: 2rem 2rem 4rem; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }\n  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 0.7rem 1.4rem; font-family: var(--sans); font-size: 0.875rem; font-weight: 500; cursor: pointer; border: 1px solid var(--ink); background: transparent; color: var(--ink); transition: background 0.15s, color 0.15s; letter-spacing: 0.01em; }\n  .btn:hover { background: var(--ink); color: var(--paper); }\n  .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }\n  .btn.primary:hover { background: #a93226; border-color: #a93226; }\n  .btn:disabled { opacity: 0.28; cursor: default; pointer-events: none; }\n  .btn.small { padding: 0.5rem 1rem; font-size: 0.8rem; }\n  .page-label { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em; text-align: center; }\n\n  .asof { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-top: 1.5rem; }\n  .disclaimer { background: var(--paper-2); border-top: 1px solid var(--rule); padding: 1rem 2rem; font-size: 0.8rem; color: var(--ink-3); text-align: center; line-height: 1.6; }\n  @media (max-width: 600px) {\n    nav { padding: 0 1rem; }\n    .hero { padding: 3.5rem 1.25rem 3rem; }\n    .content { padding: 2.5rem 1.25rem 5rem; }\n    .page-nav { padding: 1.5rem 1.25rem 3rem; }\n    .page-nav .btn { padding: 0.6rem 0.9rem; }\n    .card-grid { grid-template-columns: 1fr; }\n    .tool { padding: 1.1rem; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<nav>\n  <div class=\"nav-brand\">Ashoka University · <span>CS Higher Ed<\/span><\/div>\n  <div class=\"nav-progress\" id=\"navDots\"><\/div>\n<\/nav>\n\n<\!-- PAGE 0: INDEX -->\n<div class=\"page active\" id=\"page-0\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 05 — After you apply · Post Graduate Office<\/div>\n    <h1>After the<br><em>applications<\/em><\/h1>\n    <p class=\"hero-lead\">Submitting your applications is not the end of the process. Between your first decision and your first day of class you still have to pay for the programme, get a visa, and choose between your offers. This section covers all three.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <p>This section has two parts. <strong>Part I, Getting there,<\/strong> covers the practical work of funding your degree and getting a student visa. <strong>Part II, Choosing,<\/strong> covers how to decide between your offers. In practice the two overlap: what an offer will cost you, and how hard its visa is, should both feed into your decision.<\/p>\n      <div class=\"part-label\">Part I — Getting there<\/div>\n      <div class=\"toc\">\n        <div class=\"toc-item\" onclick=\"goTo(1)\">\n          <span class=\"toc-num\">01<\/span>\n          <span class=\"toc-title\">Funding<\/span>\n          <span class=\"toc-meta\">Scholarships · Assistantships · Loans · Sending money<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n        <div class=\"toc-item\" onclick=\"goTo(2)\">\n          <span class=\"toc-num\">02<\/span>\n          <span class=\"toc-title\">Visa preparation<\/span>\n          <span class=\"toc-meta\">US · UK · Canada · Germany · Documents · Interview<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n      <\/div>\n      <div class=\"part-label\">Part II — Choosing<\/div>\n      <div class=\"toc\">\n        <div class=\"toc-item\" onclick=\"goTo(3)\">\n          <span class=\"toc-num\">03<\/span>\n          <span class=\"toc-title\">Deciding between your options<\/span>\n          <span class=\"toc-meta\">Reading offers · Framework · Comparison tool · Negotiating<\/span>\n          <span class=\"toc-arrow\">→<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>How the months fit together<\/h2>\n      <p>This is a typical timeline for a fall intake. The exact dates depend on the country and the programme.<\/p>\n      <div class=\"timeline\">\n        <div class=\"tl-item\"><div class=\"tl-when\">Before decisions · Dec–Mar<\/div><div class=\"tl-what\"><strong>Apply for external scholarships.<\/strong> Many Indian scholarships and loan-scholarships close in the first quarter, often before you have any admit.<\/div><\/div>\n        <div class=\"tl-item\"><div class=\"tl-when\">Decisions arrive · Feb–Apr<\/div><div class=\"tl-what\"><strong>Compare offers<\/strong> and line up loan quotes so you know what each option really costs.<\/div><\/div>\n        <div class=\"tl-item\"><div class=\"tl-when\">Commit · Apr–May<\/div><div class=\"tl-what\"><strong>Accept one offer, pay the deposit, decline the rest.<\/strong> Send financial documents so the university can issue your I-20, CAS or letter of acceptance.<\/div><\/div>\n        <div class=\"tl-item\"><div class=\"tl-when\">Visa · May–Jul<\/div><div class=\"tl-what\"><strong>Apply for your visa as soon as you have the university document.<\/strong> Summer appointment slots fill up quickly.<\/div><\/div>\n        <div class=\"tl-item\"><div class=\"tl-when\">Leave · Jul–Aug<\/div><div class=\"tl-what\"><strong>Make the first tuition payment, arrange housing and insurance, and travel.<\/strong><\/div><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"disclaimer\">This resource is maintained by the Ashoka University Post Graduate Office. Visa rules, fees and scholarship terms change often. Figures were checked in November 2026. Always confirm with the official source before acting.<\/div>\n<\/div>\n\n<\!-- PAGE 1: FUNDING -->\n<div class=\"page\" id=\"page-1\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Part I · 01 — Funding<\/div>\n    <h1>Paying for<br><em>your degree<\/em><\/h1>\n    <p class=\"hero-lead\">Most CS master's students abroad pay through a mix of family savings, an education loan, and whatever scholarship or campus job they can get. The aim is to know your full funding plan before you accept an offer, not after.<\/p>\n  <\/div>\n  <div class=\"content\">\n\n    <div class=\"section-block\">\n      <h2>Start with the real number<\/h2>\n      <p>Take the university's international cost of attendance for the whole programme (see the Cost page in <em>Shortlisting<\/em>), then subtract any funding that is <strong>confirmed in writing<\/strong>. Only count promised money, not money you hope to get. The amount left over is what you need to cover from savings, loans and campus work.<\/p>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Doesn't need repaying<\/div>\n          <h4>Scholarships and waivers<\/h4>\n          <p>Merit awards from the university, external scholarships, and full or partial tuition waivers. For CS master's students abroad these are uncommon and usually small, but worth applying for.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Earned<\/div>\n          <h4>Assistantships<\/h4>\n          <p>Teaching assistant, research assistant or grader roles. In the US these can cover tuition and pay a stipend, but master's students usually get them after arriving, not with the offer.<\/p>\n        <\/div>\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">Repaid with interest<\/div>\n          <h4>Education loans<\/h4>\n          <p>The main source of funding for most students. Loan terms vary a lot between lenders, so get several quotes before you accept an offer.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>External scholarships for Indian students<\/h2>\n      <p>Most of these close early in the year, often before you have heard from universities. Some are interest-free <strong>loan scholarships<\/strong>, which you repay but without interest. Eligibility and deadlines change every cycle, so check the official site before you apply.<\/p>\n      <div class=\"table-wrap\">\n        <table class=\"std-table\">\n          <thead><tr><th>Scholarship<\/th><th>What it is<\/th><th>Notes for CS students<\/th><\/tr><\/thead>\n          <tbody>\n            <tr><td class=\"tl\">JN Tata Endowment<\/td><td>Loan scholarship for Indian graduates going abroad for postgraduate study<\/td><td>Applications usually close around mid-March. Apply online.<\/td><\/tr>\n            <tr><td class=\"tl\">Narotam Sekhsaria Foundation<\/td><td>Interest-free loan scholarship for postgraduate study in India or abroad. Repayment starts a year after the course ends.<\/td><td>Applications usually open in January, with interviews between April and June. The final award depends on securing admission.<\/td><\/tr>\n            <tr><td class=\"tl\">K.C. Mahindra Scholarships for PG Studies Abroad<\/td><td>Interest-free loan scholarship<\/td><td>Annual cycle in the first half of the year. Check the K.C. Mahindra Education Trust site.<\/td><\/tr>\n            <tr><td class=\"tl\">Chevening (UK)<\/td><td>Fully funded one-year UK master's, from the UK government<\/td><td>Requires about two years of work experience, so most students coming straight from an undergraduate degree are not eligible yet.<\/td><\/tr>\n            <tr><td class=\"tl\">DAAD (Germany)<\/td><td>German government scholarships for international students<\/td><td>Many programmes require work experience. Search the DAAD scholarship database by your subject and degree.<\/td><\/tr>\n            <tr><td class=\"tl\">University awards<\/td><td>Merit scholarships given automatically at admission, or through a separate application<\/td><td>Some, such as the ETH Zurich Excellence Scholarship, have a deadline at the same time as the admission application. Check this while you are shortlisting.<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <div class=\"warn-block\">\n        <div class=\"warn-icon\">→<\/div>\n        <p><strong>Check exclusions before you invest time in an application.<\/strong> Some well-known scholarships do not fund computer science or engineering. The Inlaks Shivdasani scholarship, for example, excludes both. Read the eligibility list first.<\/p>\n      <\/div>\n      <div class=\"howto\">\n        <div class=\"howto-label\">How to find more<\/div>\n        <ul>\n          <li>Search <em>[university] international graduate scholarships<\/em> and <em>[department] master's funding<\/em>. Department pages sometimes list awards that the main financial aid page does not.<\/li>\n          <li>Ask the PG Office about scholarships that Ashoka alumni have won in previous cycles.<\/li>\n          <li>Keep one document with your statement of purpose, CV and transcripts ready to adapt. Most scholarship applications reuse the same material.<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Assistantships and campus work<\/h2>\n      <p>In the US, TA, RA and grader positions for master's students are competitive and rarely promised at admission. Plan your budget assuming you will not get one, and treat any you do get as a bonus. Students who get them usually:<\/p>\n      <ul class=\"step-list\">\n        <li><span class=\"step-num\">01<\/span><span>Email professors whose research matches their background, briefly and specifically, before or soon after arriving.<\/span><\/li>\n        <li><span class=\"step-num\">02<\/span><span>Apply early to the department's TA or grader openings. These are often posted just before the semester starts.<\/span><\/li>\n        <li><span class=\"step-num\">03<\/span><span>Do well in a course and then offer to grade it the next term.<\/span><\/li>\n      <\/ul>\n      <p>Student visas limit how much you can work. In the US, on-campus work is usually capped at 20 hours a week during term. The UK and Canada have their own caps. Check the current limit for your visa before taking a job.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Education loans<\/h2>\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">Public banks<\/div><div class=\"data-val\">Usually the lowest interest rates. Larger loans normally need <strong>collateral<\/strong>, such as property or fixed deposits, and processing can be slow, so start early.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Private banks &amp; NBFCs<\/div><div class=\"data-val\">Will lend larger amounts without collateral, based on your admit and a co-borrower's income. They are faster, but the interest rates and fees are higher.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">International lenders<\/div><div class=\"data-val\">Lenders such as Prodigy Finance and MPOWER lend in foreign currency, decide based on your future earnings, and usually don't need an Indian co-borrower. Rates are often higher, and you take on exchange-rate risk if you later repay from rupees.<\/div><\/div>\n      <\/div>\n      <h3>What to compare across quotes<\/h3>\n      <ul class=\"step-list\">\n        <li><span class=\"step-num\">01<\/span><span><strong>Interest rate and type:<\/strong> whether it is fixed or floating, and what benchmark it is linked to.<\/span><\/li>\n        <li><span class=\"step-num\">02<\/span><span><strong>Moratorium:<\/strong> how long after the course ends before repayment starts, and whether interest builds up during your studies.<\/span><\/li>\n        <li><span class=\"step-num\">03<\/span><span><strong>Margin money:<\/strong> the share of the cost you have to pay yourself.<\/span><\/li>\n        <li><span class=\"step-num\">04<\/span><span><strong>Processing fees, insurance, and prepayment penalties.<\/strong><\/span><\/li>\n        <li><span class=\"step-num\">05<\/span><span><strong>Disbursement:<\/strong> whether the lender pays the university directly, and how quickly it releases money for each term.<\/span><\/li>\n        <li><span class=\"step-num\">06<\/span><span><strong>Sanction letter timing:<\/strong> universities and visa officers often accept a sanction letter as proof of funds, so make sure you can get one before your I-20 or visa deadline.<\/span><\/li>\n      <\/ul>\n      <p>In India, interest paid on an education loan has generally been deductible from the borrower's taxable income for several years. This matters if a parent is the co-borrower. Check the current rules with a tax advisor.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Sending money abroad<\/h2>\n      <p>Indian banks collect tax at source (TCS) on large overseas transfers. From <strong>1 April 2026<\/strong>, for education payments:<\/p>\n      <div class=\"table-wrap\">\n        <table class=\"std-table\">\n          <thead><tr><th>Source of money<\/th><th>TCS<\/th><\/tr><\/thead>\n          <tbody>\n            <tr><td class=\"tl\">Education loan from a bank or NBFC<\/td><td>Nil<\/td><\/tr>\n            <tr><td class=\"tl\">Own savings / family funds<\/td><td>Nil on the first ₹10 lakh per PAN per financial year; 2% on the amount above that<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <p>TCS is not an additional cost. You can claim it back against your income tax, but it ties up cash until then. Spreading payments across two PANs or two financial years can reduce how much is held. Ask your bank or tax advisor about this.<\/p>\n    <\/div>\n\n    <div class=\"howto\">\n      <div class=\"howto-label\">Before you accept an offer<\/div>\n      <ul>\n        <li>Write down the total cost, confirmed funding, and the gap.<\/li>\n        <li>Get at least two loan quotes for that gap, including one from a public bank if you have collateral.<\/li>\n        <li>Confirm which documents the university needs as proof of funds, and how recent they must be.<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"asof\">Figures checked November 2026<\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(0)\">← Contents<\/button>\n    <span class=\"page-label\">01 / 03<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(2)\">Next: Visa →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 2: VISA -->\n<div class=\"page\" id=\"page-2\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Part I · 02 — Visa preparation<\/div>\n    <h1>Getting your<br><em>student visa<\/em><\/h1>\n    <p class=\"hero-lead\">Each country has its own visa process, but they all follow the same steps. The university issues a document, you show you can pay, and you apply. The most common mistake is leaving it too late.<\/p>\n  <\/div>\n  <div class=\"content\">\n\n    <div class=\"section-block\">\n      <h2>The common sequence<\/h2>\n      <ul class=\"step-list\">\n        <li><span class=\"step-num\">01<\/span><span><strong>Accept the offer and pay the deposit.<\/strong> The university will not issue visa documents until you have committed.<\/span><\/li>\n        <li><span class=\"step-num\">02<\/span><span><strong>Send proof of funds to the university.<\/strong> Use bank statements, a loan sanction letter, and scholarship letters. Each university has a format and a minimum amount.<\/span><\/li>\n        <li><span class=\"step-num\">03<\/span><span><strong>Receive the university document:<\/strong> an I-20 (US), CAS (UK), or letter of acceptance (Canada, Germany).<\/span><\/li>\n        <li><span class=\"step-num\">04<\/span><span><strong>Pay the visa and associated fees, then book biometrics or an interview.<\/strong><\/span><\/li>\n        <li><span class=\"step-num\">05<\/span><span><strong>Attend the appointment.<\/strong> Bring originals of everything, and keep a copy of every document.<\/span><\/li>\n      <\/ul>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>By country<\/h2>\n      <div class=\"country-tabs\" role=\"tablist\" aria-label=\"Country\">\n        <button class=\"ctab active\" role=\"tab\" aria-selected=\"true\" data-c=\"us\">United States<\/button>\n        <button class=\"ctab\" role=\"tab\" aria-selected=\"false\" data-c=\"uk\">United Kingdom<\/button>\n        <button class=\"ctab\" role=\"tab\" aria-selected=\"false\" data-c=\"ca\">Canada<\/button>\n        <button class=\"ctab\" role=\"tab\" aria-selected=\"false\" data-c=\"de\">Germany<\/button>\n      <\/div>\n\n      <div class=\"cpanel active\" id=\"c-us\" role=\"tabpanel\">\n        <div class=\"data-rows\">\n          <div class=\"data-row\"><div class=\"data-key\">Visa<\/div><div class=\"data-val\"><strong>F-1<\/strong>, based on the I-20 your university issues once it has your proof of funds.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">Fees<\/div><div class=\"data-val\">SEVIS I-901 fee <strong>$350<\/strong> (pay it before the interview). Visa application (MRV) fee <strong>$185<\/strong>. A new <strong>$250 visa integrity fee<\/strong>, charged when the visa is issued, has started at some consulates. It may be refundable later, but the refund process is not finalised.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">Interview<\/div><div class=\"data-val\">Since September 2025, almost all F-1 applicants need an <strong>in-person interview<\/strong>. Book as soon as you have your I-20. Slots in India get scarce from May to July.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">Social media<\/div><div class=\"data-val\">F-1 applicants must list all their social media handles on the DS-160 and set their profiles to <strong>public<\/strong>. Make sure what is public is accurate and consistent with your application.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">Delays<\/div><div class=\"data-val\">Officers may issue a <strong>221(g)<\/strong> refusal for extra administrative checks. This is not a final rejection, but it can take weeks to resolve, which is another reason to apply early.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">In flux<\/div><div class=\"data-val\">A rule replacing \"duration of status\" with fixed admission periods was published in July 2026, then blocked by a federal court in September 2026. Changes to OPT have also been proposed. Neither is final. Check your university's international student office for the latest position.<\/div><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"cpanel\" id=\"c-uk\" role=\"tabpanel\">\n        <div class=\"data-rows\">\n          <div class=\"data-row\"><div class=\"data-key\">Visa<\/div><div class=\"data-val\"><strong>Student visa<\/strong>, based on the CAS (Confirmation of Acceptance for Studies) your university issues.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">Fees<\/div><div class=\"data-val\">Application fee <strong>£558<\/strong> (from 8 April 2026). Immigration Health Surcharge <strong>£776 per year<\/strong> of the visa, paid upfront.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">Funds<\/div><div class=\"data-val\">Show unpaid tuition plus living costs for up to 9 months: <strong>£1,529/month in London<\/strong>, <strong>£1,171/month elsewhere<\/strong>. The money must have been in the account for at least <strong>28 consecutive days<\/strong> before you apply. A dip below the required amount on any day can lead to refusal.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">Dependants<\/div><div class=\"data-val\">Taught master's students generally <strong>cannot bring dependants<\/strong>. Research degrees such as a PhD are an exception.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">After study<\/div><div class=\"data-val\">From <strong>1 January 2027<\/strong>, Graduate Route visas for master's graduates last <strong>18 months<\/strong> instead of two years (PhD graduates still get three years). This applies to anyone starting a one-year master's in 2027.<\/div><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"cpanel\" id=\"c-ca\" role=\"tabpanel\">\n        <div class=\"data-rows\">\n          <div class=\"data-row\"><div class=\"data-key\">Visa<\/div><div class=\"data-val\"><strong>Study permit<\/strong>, based on a letter of acceptance from a Designated Learning Institution.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">PAL<\/div><div class=\"data-val\">Since 1 January 2026, master's and PhD students at <strong>public<\/strong> universities are exempt from the study permit cap and do not need a provincial attestation letter (PAL). Private institutions are not exempt.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">Funds<\/div><div class=\"data-val\">For applications received from 1 September 2026, a single applicant outside Quebec must show <strong>CAD 23,448<\/strong> for living costs, <strong>plus first-year tuition and travel<\/strong>. Officers now check <strong>where the money comes from<\/strong> in every case, so keep documentation of its source. For programmes longer than one year, also explain how later years will be paid for.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">Quebec<\/div><div class=\"data-val\">For McGill or Université de Montréal you first need a Quebec Acceptance Certificate (CAQ), which takes extra time. Quebec's living-cost figure is CAD 24,617 for a single applicant.<\/div><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"cpanel\" id=\"c-de\" role=\"tabpanel\">\n        <div class=\"data-rows\">\n          <div class=\"data-row\"><div class=\"data-key\">Visa<\/div><div class=\"data-val\"><strong>National (D) student visa<\/strong>, converted to a residence permit after you arrive.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">APS<\/div><div class=\"data-val\">Indian applicants need an <strong>APS certificate<\/strong>, which verifies your academic documents, before applying for the visa. Many universities also require it for admission. It can take several weeks, so apply for it early.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">Funds<\/div><div class=\"data-val\">The usual proof is a <strong>blocked account<\/strong> holding <strong>€11,904 for one year<\/strong> (€992 a month). A scholarship letter or a formal sponsor declaration can replace some or all of it.<\/div><\/div>\n          <div class=\"data-row\"><div class=\"data-key\">Other<\/div><div class=\"data-val\">You need health insurance from enrolment. Book the visa appointment early, as appointment waiting times in India can be long.<\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Document checklist<\/h2>\n      <p>Requirements differ by country, but most applications need most of these. Keep a scanned copy and a paper copy of each.<\/p>\n      <ul class=\"checklist\">\n        <li><label><input type=\"checkbox\"><span>Passport valid for at least six months beyond your intended stay<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\"><span>University document (I-20 / CAS / letter of acceptance) and the offer letter<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\"><span>Fee payment receipts (SEVIS, visa application, health surcharge)<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\"><span>Proof of funds: bank statements, loan sanction letter, scholarship letters, sponsor affidavit<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\"><span>Proof of where the money came from: salary slips or income tax returns of sponsors, property papers if used as loan collateral<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\"><span>Academic transcripts, degree certificate or provisional certificate<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\"><span>Test scores (GRE / TOEFL / IELTS) where relevant<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\"><span>Country-specific items: APS certificate (Germany), CAQ (Quebec), TB test certificate (UK, if required)<\/span><\/label><\/li>\n        <li><label><input type=\"checkbox\"><span>Photographs to the exact specification for that country<\/span><\/label><\/li>\n      <\/ul>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Preparing for a US visa interview<\/h2>\n      <p>The interview is short. The officer is checking three things: that you are a genuine student, that you can pay, and that your plans make sense. Prepare to answer clearly in a sentence or two:<\/p>\n      <div class=\"card-grid\">\n        <div class=\"card\">\n          <div class=\"card-label\">Programme<\/div>\n          <h4>Why this degree, why here?<\/h4>\n          <p>Name specific courses, labs or faculty. Explain how the degree follows from what you studied at Ashoka.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Money<\/div>\n          <h4>Who is paying?<\/h4>\n          <p>Know the total cost, who your sponsors are, what they earn, and how much of it is a loan.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Plans<\/div>\n          <h4>What happens after?<\/h4>\n          <p>Describe a realistic career plan. Answer truthfully and consistently with your DS-160 and SOP.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"warn-block\">\n        <div class=\"warn-icon\">→<\/div>\n        <p><strong>Never use agents who promise guaranteed visas or \"arranged\" bank balances.<\/strong> Fake or borrowed funds can lead to refusal and a permanent record of misrepresentation. If your finances are complicated, explain them honestly with documents.<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"howto\">\n      <div class=\"howto-label\">Official sources<\/div>\n      <ul>\n        <li>US: travel.state.gov (visa process), fmjfee.com (SEVIS fee), and your university's international student office<\/li>\n        <li>UK: gov.uk/student-visa<\/li>\n        <li>Canada: canada.ca, under study permits (IRCC)<\/li>\n        <li>Germany: the German Missions in India website, and aps-india.de for the APS<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"asof\">Fees and rules checked November 2026<\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(1)\">← Funding<\/button>\n    <span class=\"page-label\">02 / 03<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(3)\">Next: Deciding →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- PAGE 3: DECIDING -->\n<div class=\"page\" id=\"page-3\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Part II · 03 — Deciding<\/div>\n    <h1>Choosing between<br><em>your options<\/em><\/h1>\n    <p class=\"hero-lead\">Having more than one offer is a good position to be in, but it still requires a decision. Choosing the highest-ranked school is a common default, and it is not always the best choice. Compare your offers against what you wanted from the degree in the first place.<\/p>\n  <\/div>\n  <div class=\"content\">\n\n    <div class=\"section-block\">\n      <h2>First, read each offer carefully<\/h2>\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">Deadline<\/div><div class=\"data-val\">The date you must respond by, and whether you can ask for an extension. Many US graduate schools sign the Council of Graduate Schools' April 15 Resolution, which covers offers that include financial support. Check whether your school is a signatory before you feel pressured to decide early.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Deposit<\/div><div class=\"data-val\">The amount, whether it is refundable, and whether it counts towards tuition.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Funding<\/div><div class=\"data-val\">Whether funding is for one year or the whole programme, and whether it depends on grades or work hours. Find out exactly what is waived: tuition, fees, or both.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Conditions<\/div><div class=\"data-val\">Final transcript requirements, minimum GPA, or English test conditions you still need to meet.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Deferral<\/div><div class=\"data-val\">Whether you can defer to a later intake, and on what terms.<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>A framework for comparing<\/h2>\n      <p>Score each offer on these five factors. Most students end up weighing two or three of them much more than the others, and that is fine as long as you decide which ones on purpose.<\/p>\n      <div class=\"card-grid\">\n        <div class=\"card\">\n          <div class=\"card-label\">01 · Cost<\/div>\n          <h4>Net cost<\/h4>\n          <p>Total cost minus confirmed funding. Also consider the loan you would carry and the monthly repayment against a realistic starting salary.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">02 · Outcomes<\/div>\n          <h4>Where graduates go<\/h4>\n          <p>Look at placement data for <em>this<\/em> programme, not the university overall. Check where alumni from India in particular ended up, and how many went on to PhDs if that is your goal.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">03 · Fit<\/div>\n          <h4>Academic fit<\/h4>\n          <p>Whether the courses and faculty match your field, how easy it is to get into a lab or do a thesis, and how large the classes are.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">04 · After<\/div>\n          <h4>Location and work rights<\/h4>\n          <p>The post-study work route (OPT, Graduate Route, PGWP), the local job market, and where you want to live in five years.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">05 · Life<\/div>\n          <h4>Personal factors<\/h4>\n          <p>Distance from family, support networks, climate, safety, and whether you would actually be happy living there.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"howto\">\n        <div class=\"howto-label\">Get information from people who are there<\/div>\n        <ul>\n          <li>Ask the department to connect you with current international students, and look for Ashoka alumni on LinkedIn and in the PG Office spreadsheet.<\/li>\n          <li>Ask them specific questions: <em>How many people in your cohort got internships, and how? Did anyone get a TA position in their first term? What would you choose again?<\/em><\/li>\n          <li>Attend the admitted-students events (virtual or in person). How the department treats you before you commit says a lot.<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <div class=\"tool\" id=\"cmpTool\">\n        <div class=\"tool-label\">Interactive<\/div>\n        <h4>Offer comparison<\/h4>\n        <p class=\"tool-note\">Set how much each factor matters to you, then enter your offers. Costs are in ₹ lakh. Net cost is scored relative to your cheapest option. Nothing you enter leaves this page.<\/p>\n        <div class=\"weights\" id=\"weights\"><\/div>\n        <div class=\"offers\" id=\"offers\"><\/div>\n        <div class=\"tool-actions\">\n          <button class=\"btn small\" id=\"addOffer\">+ Add offer<\/button>\n          <button class=\"btn primary small\" id=\"runCmp\">Compare<\/button>\n        <\/div>\n        <div class=\"results\" id=\"results\" aria-live=\"polite\"><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Negotiating and waitlists<\/h2>\n      <h3>Asking for more funding<\/h3>\n      <p>If a school you prefer gave you less funding than a comparable school, you can politely ask the department whether the award can be reconsidered. Attach the competing offer. Be brief and factual, and don't present it as an ultimatum. Many departments can't change awards, but some can.<\/p>\n      <h3>Waitlists<\/h3>\n      <p>Tell the school you are still interested, add a short update if you have new results, and set a date by which you will move on. Do not let a waitlist make you miss the deposit deadline for an offer you already have.<\/p>\n      <div class=\"warn-block\">\n        <div class=\"warn-icon\">→<\/div>\n        <p><strong>Deciding not to go is also a valid outcome.<\/strong> If none of your offers make sense once you look at the full cost and the likely outcomes, you can take a job and reapply later with stronger experience. See <em>Should I pursue higher education?<\/em> for that comparison.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(2)\">← Visa<\/button>\n    <span class=\"page-label\">03 / 03<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(0)\">Back to contents<\/button>\n  <\/div>\n<\/div>\n\n<script>\n// ============ NAVIGATION ============\nconst TOTAL_PAGES = 4;\nlet currentPage = 0;\n\nfunction buildNav() {\n  const container = document.getElementById('navDots');\n  container.innerHTML = '<span onclick=\"goTo(Math.max(0, currentPage - 1))\" style=\"font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:0.06em;cursor:pointer;margin-right:10px;\">← back<\/span>';\n  const labels = ['Contents','Funding','Visa','Deciding'];\n  for (let i = 0; i < TOTAL_PAGES; i++) {\n    const dot = document.createElement('div');\n    dot.className = 'nav-dot' + (i === currentPage ? ' active' : (i < currentPage ? ' visited' : ''));\n    dot.onclick = () => goTo(i);\n    dot.title = labels[i];\n    container.appendChild(dot);\n  }\n}\n\nfunction goTo(n) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.getElementById('page-' + n).classList.add('active');\n  currentPage = n;\n  buildNav();\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\nbuildNav();\n\n// ============ COUNTRY TABS ============\ndocument.querySelectorAll('.ctab').forEach(btn => {\n  btn.addEventListener('click', () => {\n    document.querySelectorAll('.ctab').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });\n    document.querySelectorAll('.cpanel').forEach(p => p.classList.remove('active'));\n    btn.classList.add('active'); btn.setAttribute('aria-selected', 'true');\n    document.getElementById('c-' + btn.dataset.c).classList.add('active');\n  });\n});\n\n// ============ OFFER COMPARISON ============\nconst FACTORS = [\n  { key: 'cost', label: 'Net cost' },\n  { key: 'outcomes', label: 'Career outcomes' },\n  { key: 'fit', label: 'Academic fit' },\n  { key: 'after', label: 'Location & work rights' },\n  { key: 'life', label: 'Personal factors' }\n];\nconst RATED = FACTORS.filter(f => f.key !== 'cost');\nconst weights = { cost: 2, outcomes: 3, fit: 2, after: 2, life: 1 };\nlet offers = [];\n\nfunction newOffer(name) { return { name: name || '', cost: '', funding: '', outcomes: 3, fit: 3, after: 3, life: 3 }; }\noffers = [newOffer(), newOffer()];\n\nfunction renderWeights() {\n  const w = document.getElementById('weights');\n  w.innerHTML = FACTORS.map(f => `\n    <div><label class=\"field-label\" for=\"w-${f.key}\">${f.label}<\/label>\n    <select id=\"w-${f.key}\" data-w=\"${f.key}\">\n      <option value=\"0\"${weights[f.key]===0?' selected':''}>Doesn't matter<\/option>\n      <option value=\"1\"${weights[f.key]===1?' selected':''}>Matters a little<\/option>\n      <option value=\"2\"${weights[f.key]===2?' selected':''}>Matters<\/option>\n      <option value=\"3\"${weights[f.key]===3?' selected':''}>Matters a lot<\/option>\n    <\/select><\/div>`).join('');\n  w.querySelectorAll('select').forEach(s => s.addEventListener('change', e => { weights[e.target.dataset.w] = +e.target.value; }));\n}\n\nfunction esc(s) { return String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }\n\nfunction renderOffers() {\n  const box = document.getElementById('offers');\n  box.innerHTML = offers.map((o, i) => `\n    <div class=\"offer\" data-i=\"${i}\">\n      <div class=\"offer-head\"><span class=\"offer-num\">Offer ${String(i + 1).padStart(2, '0')}<\/span>\n        ${offers.length > 2 ? `<button class=\"offer-remove\" data-rm=\"${i}\" aria-label=\"Remove offer ${i + 1}\">Remove ×<\/button>` : ''}<\/div>\n      <div><label class=\"field-label\" for=\"n-${i}\">University / programme<\/label>\n        <input type=\"text\" id=\"n-${i}\" data-f=\"name\" value=\"${esc(o.name)}\" placeholder=\"e.g. Georgia Tech MSCS\"><\/div>\n      <div class=\"two\">\n        <div><label class=\"field-label\" for=\"c-${i}\">Total cost<\/label><input type=\"number\" min=\"0\" step=\"0.5\" id=\"c-${i}\" data-f=\"cost\" value=\"${o.cost}\" placeholder=\"₹ lakh\"><\/div>\n        <div><label class=\"field-label\" for=\"fu-${i}\">Funding<\/label><input type=\"number\" min=\"0\" step=\"0.5\" id=\"fu-${i}\" data-f=\"funding\" value=\"${o.funding}\" placeholder=\"₹ lakh\"><\/div>\n      <\/div>\n      ${RATED.map(f => `\n        <div class=\"rating\"><span class=\"field-label\">${f.label}<\/span>\n          <div class=\"dots\" role=\"group\" aria-label=\"${f.label} rating for offer ${i + 1}\">\n            ${[1,2,3,4,5].map(v => `<button type=\"button\" data-r=\"${f.key}\" data-v=\"${v}\" class=\"${o[f.key] >= v ? 'on' : ''}\" aria-pressed=\"${o[f.key] === v}\" aria-label=\"${v} of 5\">${v}<\/button>`).join('')}\n          <\/div><\/div>`).join('')}\n    <\/div>`).join('');\n\n  box.querySelectorAll('.offer').forEach(card => {\n    const i = +card.dataset.i;\n    card.querySelectorAll('input').forEach(inp => inp.addEventListener('input', e => { offers[i][e.target.dataset.f] = e.target.value; }));\n    card.querySelectorAll('.dots button').forEach(b => b.addEventListener('click', () => { offers[i][b.dataset.r] = +b.dataset.v; renderOffers(); }));\n    const rm = card.querySelector('[data-rm]');\n    if (rm) rm.addEventListener('click', () => { offers.splice(i, 1); renderOffers(); });\n  });\n  document.getElementById('addOffer').disabled = offers.length >= 4;\n}\n\nfunction compare() {\n  const res = document.getElementById('results');\n  const rows = offers.map((o, i) => {\n    const cost = parseFloat(o.cost), fund = parseFloat(o.funding) || 0;\n    const net = isNaN(cost) ? null : Math.max(0, cost - fund);\n    return { name: o.name.trim() || 'Offer ' + (i + 1), net, o };\n  });\n  const nets = rows.filter(r => r.net !== null).map(r => r.net);\n  const minNet = nets.length ? Math.min(...nets) : null;\n  const totalW = Object.values(weights).reduce((a, b) => a + b, 0);\n  if (!totalW) { res.innerHTML = '<p class=\"result-caveat\">Set at least one factor above \"Doesn\\'t matter\".<\/p>'; res.classList.add('show'); return; }\n\n  rows.forEach(r => {\n    let costScore;\n    if (r.net === null) costScore = 3;\n    else if (r.net === 0 || minNet === 0) costScore = r.net === 0 ? 5 : Math.max(1, 5 - r.net / 10);\n    else costScore = 5 * (minNet / r.net);\n    r.costScore = costScore;\n    let s = weights.cost * costScore;\n    RATED.forEach(f => { s += weights[f.key] * r.o[f.key]; });\n    r.score = s / totalW;\n  });\n  rows.sort((a, b) => b.score - a.score);\n\n  const missing = rows.some(r => r.net === null);\n  const close = rows.length > 1 && (rows[0].score - rows[1].score) < 0.25;\n  res.innerHTML = rows.map((r, k) => `\n    <div class=\"result-row${k === 0 ? ' top' : ''}\">\n      <span class=\"result-rank\">${String(k + 1).padStart(2, '0')}<\/span>\n      <div><div class=\"result-name\">${esc(r.name)}<\/div>\n        <div class=\"result-sub\">${r.net === null ? 'Net cost not entered' : 'Net cost ₹' + r.net.toLocaleString('en-IN', { maximumFractionDigits: 1 }) + ' lakh'}<\/div><\/div>\n      <span class=\"result-score\">${r.score.toFixed(1)}<span style=\"color:var(--ink-3);font-size:0.75rem;\"> / 5<\/span><\/span>\n      <div class=\"bar\"><span style=\"width:${(r.score / 5 * 100).toFixed(0)}%\"><\/span><\/div>\n    <\/div>`).join('') +\n    `<p class=\"result-caveat\">${close ? '<strong>Your top two are very close.<\/strong> A small change in one rating would swap them, so let the factor you care about most decide. ' : ''}${missing ? 'Offers without a cost were given a neutral cost score. ' : ''}This score is a summary of your own ratings, not a recommendation. If the result surprises you, check whether your weights reflect what you actually care about.<\/p>`;\n  res.classList.add('show');\n}\n\nrenderWeights();\nrenderOffers();\ndocument.getElementById('addOffer').addEventListener('click', () => { if (offers.length < 4) { offers.push(newOffer()); renderOffers(); } });\ndocument.getElementById('runCmp').addEventListener('click', compare);\n\n<\/script>\n<style>\n.pg-home{display:none;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:none;border:1px solid var(--rule);padding:.4rem .75rem;cursor:pointer;white-space:nowrap}\n.pg-home:hover{color:var(--accent);border-color:var(--accent)}\n.pg-home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\nbody.on-sub .pg-home{display:inline-flex}\nbody.on-sub nav .nav-brand{display:none}\n<\/style>\n<script>(function(){\nvar nav=document.querySelector('nav');if(!nav||typeof goTo!=='function')return;\nvar b=document.createElement('button');b.type='button';b.className='pg-home';b.textContent='\\u2190 Contents';\nb.title='Back to the start of this section';b.onclick=function(){goTo(0)};nav.insertBefore(b,nav.firstChild);\nfunction sync(){var a=document.querySelector('.page.active');var sub=!!a&&a.id!=='page-0';\n if(document.body.classList.contains('on-sub')!==sub)document.body.classList.toggle('on-sub',sub);}\nnew MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});sync();\nwindow.addEventListener('message',function(e){if(e.data==='pg-home')goTo(0)});\n})();<\/script>\n<\/body>\n<\/html>\n"}];
const frames = document.getElementById('frames');
const tabs = [...document.querySelectorAll('.tab')];
const loaded = {};
let current = -1;

function show(i, push) {
  i = Math.max(0, Math.min(GUIDES.length - 1, i));
  const g = GUIDES[i];
  if (!loaded[g.id]) {
    const f = document.createElement('iframe');
    f.title = g.title;
    f.srcdoc = g.html;
    frames.appendChild(f);
    loaded[g.id] = f;
  }
  Object.values(loaded).forEach(f => f.classList.toggle('active', f === loaded[g.id]));
  tabs.forEach((t, k) => t.setAttribute('aria-selected', k === i ? 'true' : 'false'));
  tabs[i].scrollIntoView({ block:'nearest', inline:'nearest' });
  document.getElementById('prevGuide').disabled = i === 0;
  document.getElementById('nextGuide').disabled = i === GUIDES.length - 1;
  document.title = g.title + ' — Ashoka Post Graduate Office';
  current = i;
  if (push && location.hash !== '#' + g.id) history.pushState(null, '', '#' + g.id);
}

function fromHash() {
  const i = GUIDES.findIndex(g => '#' + g.id === location.hash);
  show(i < 0 ? 0 : i, false);
}

tabs.forEach((t, i) => t.addEventListener('click', () => {
  if (i === current) { const f = loaded[GUIDES[i].id]; if (f && f.contentWindow) f.contentWindow.postMessage('pg-home', '*'); return; }
  show(i, true);
}));
document.getElementById('prevGuide').addEventListener('click', () => show(current - 1, true));
document.getElementById('nextGuide').addEventListener('click', () => show(current + 1, true));
window.addEventListener('popstate', fromHash);
window.addEventListener('message', e => {
  const id = e.data && e.data.portalGo; if (!id) return;
  const i = GUIDES.findIndex(g => g.id === id); if (i >= 0) show(i, true);
});
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
