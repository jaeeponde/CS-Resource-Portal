iv class=\"data-row\"><div class=\"data-key\">Thesis<\/div><div class=\"data-val\">Yes, but shorter than a PhD dissertation. Typically 40,000–60,000 words (compared to 80,000–100,000 for a PhD). Must make an original scholarly contribution and is examined by an internal and external examiner via viva voce (oral examination).<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Advisor role<\/div><div class=\"data-val\">High. An MPhil supervisor directs the research, provides feedback on drafts, and serves a role similar to a PhD supervisor, though the shorter timeline means the relationship is more compressed.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Where offered<\/div><div class=\"data-val\">Primarily UK institutions: Oxford, Cambridge, Edinburgh, UCL, Imperial, Manchester. Some Australian universities offer the MPhil as well. Rare in the US and continental Europe.<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Programme structure<\/h2>\n      <p>The MPhil is an almost entirely research-based degree. There are typically no formal taught courses — you begin research from day one under supervisor guidance. This distinguishes it from degrees that blend coursework with research in the first year.<\/p>\n      <div class=\"timeline\">\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Months 1–3<\/div>\n          <h4>Research plan and literature review<\/h4>\n          <p>Developing the research question with your supervisor, conducting an initial literature survey, and submitting a formal research plan that the department approves.<\/p>\n        <\/div>\n        <div class=\"timeline-item highlight\">\n          <div class=\"timeline-year\">Months 3–18<\/div>\n          <h4>Research and writing<\/h4>\n          <p>The main research period. Regular supervisor meetings, iterative feedback on written work, and production of the thesis chapters. The pace is self-directed with supervisor oversight.<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Month 18–24<\/div>\n          <h4>Submission and viva<\/h4>\n          <p>Thesis submission followed by an oral examination (viva voce) with two examiners — typically one internal and one external to the institution. Outcome may be pass, minor corrections, major corrections, or referral to PhD.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>MPhil as PhD probation<\/h2>\n      <p>At some UK institutions, students are initially registered as MPhil students and upgrade to PhD candidacy after a formal review at 9–12 months. This is a quality control mechanism — not all students who intend to do a PhD complete the upgrade successfully. If you are admitted to a UK PhD programme with MPhil registration, clarify whether this is the case and what the upgrade process involves.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>What you produce<\/h2>\n      <p>A written thesis of 40,000–60,000 words presenting an original research contribution. In CS, this is typically accompanied by software, datasets, or experimental results. The thesis must pass an oral examination to be awarded.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Typical career destinations<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Most common<\/div>\n          <h4>PhD programme<\/h4>\n          <p>Many MPhil students continue to a PhD, either at the same institution or elsewhere. The MPhil provides a strong foundation and demonstrates research ability.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Also possible<\/div>\n          <h4>Industry research roles<\/h4>\n          <p>Research scientist or research engineer roles at companies with UK or European operations. The MPhil is better recognised in the UK market than internationally.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"exit-block\">\n      <div class=\"exit-label\">Exit options<\/div>\n      <p>In the UK system, if a student registered for a PhD does not complete or does not pass the upgrade review, they may be awarded an MPhil based on work completed to that point. This is a formal exit route and is reasonably common. Students who begin as standalone MPhil registrants and choose not to continue have no intermediate credential — the degree is awarded only upon successful completion.<\/p>\n    <\/div>\n\n    <div class=\"india-note\">\n      <div class=\"india-note-label\">India context<\/div>\n      <p>The MPhil exists formally in India — some universities offer it — but it is being phased out following UGC regulatory changes. It was more common in humanities than in CS. For CS students from Ashoka considering research degrees, the MPhil is a UK/international consideration, not an Indian one.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(5)\">← Back<\/button>\n    <span class=\"page-label\">06 / 09<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(7)\">Next: MRes →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- ===================== PAGE 7: MRES ===================== -->\n<div class=\"page\" id=\"page-7\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Deep Dive 07<\/div>\n    <h1>MRes —<br><em>Master of Research<\/em><\/h1>\n    <p class=\"hero-lead\">A one-year research-focused degree offered primarily in the UK. Designed explicitly as preparation for doctoral study — minimal taught content, maximum research exposure.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">Duration<\/div><div class=\"data-val\">1 year full-time (some part-time options over 2 years).<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Funding<\/div><div class=\"data-val\">EPSRC and other UK research council funding is sometimes available, particularly for MRes programmes that feed directly into funded PhD tracks. Institutional bursaries exist. Many students are self-funded. Total cost at UK universities for international students: £20,000–£35,000 including living expenses.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Thesis<\/div><div class=\"data-val\">Yes — a substantial research report or short thesis, typically 20,000–40,000 words. Some MRes programmes have a viva voce; others are assessed by submission and examiner review only.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Advisor role<\/div><div class=\"data-val\">High. Research supervision is the core of the programme. You work closely with one or two supervisors throughout the year. In some MRes programmes linked to doctoral training centres (CDTs), you rotate through multiple research groups before committing to a thesis project.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Where offered<\/div><div class=\"data-val\">Imperial College London, UCL, Edinburgh, Manchester, Bristol, and several others. Often offered through EPSRC Centres for Doctoral Training (CDTs), which combine an MRes year with subsequent PhD funding.<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Programme structure<\/h2>\n      <p>The MRes is unusual in that it is explicitly designed to train you in research methods and practices, rather than to teach subject content. Taught components, where they exist, focus on research skills — academic writing, statistical methods, research ethics, presentation — rather than technical CS content.<\/p>\n      <div class=\"timeline\">\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Months 1–3<\/div>\n          <h4>Research training and project selection<\/h4>\n          <p>In CDT-linked programmes, this often involves lab rotations — spending 4–6 weeks in different research groups to identify a project. Standalone MRes programmes begin with an assigned or agreed project immediately.<\/p>\n        <\/div>\n        <div class=\"timeline-item highlight\">\n          <div class=\"timeline-year\">Months 3–10<\/div>\n          <h4>Research project<\/h4>\n          <p>The main research work. Reading, experimenting, building, writing. Weekly supervisor meetings. The pace is intensive given the short overall duration.<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Months 10–12<\/div>\n          <h4>Thesis submission<\/h4>\n          <p>Writing and submission of the research report or thesis. Some programmes require an oral presentation; others assess by written submission only.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>CDT-linked MRes programmes<\/h2>\n      <p>Several of the most competitive MRes opportunities in the UK are attached to EPSRC Centres for Doctoral Training. In these programmes, the MRes is year one of a 4+1 structure — you do the MRes year and, if successful, continue into a funded PhD for 3–4 more years. This is a significant consideration: the MRes application is effectively also a PhD application, and the funding flows through the full programme. Examples include the CDTs in Machine Learning (Edinburgh, Cambridge), Natural Language Processing (Sheffield), and Autonomous Intelligent Machines (Imperial).<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>What you produce<\/h2>\n      <p>A research report or short thesis presenting a completed research project. In CS MRes programmes, this often includes a software component alongside the written document. Given the one-year timeline, the scope is narrower than a full PhD or MPhil thesis.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Typical career destinations<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Primary path<\/div>\n          <h4>PhD programme<\/h4>\n          <p>Most MRes students continue to a PhD, either through the CDT structure (directly funded) or by applying separately to PhD programmes elsewhere. The MRes is primarily a research training and PhD preparation degree.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Secondary path<\/div>\n          <h4>Industry research roles<\/h4>\n          <p>Research engineer or research scientist roles, particularly at UK-based companies. The one-year duration and research-only structure make it more specialised than a taught master's for general industry applications.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"exit-block\">\n      <div class=\"exit-label\">Exit options<\/div>\n      <p>Given the one-year duration, there are no meaningful mid-programme exit options. If you are in a CDT-linked programme and choose not to continue to the PhD, you receive the MRes upon successful submission of the thesis. The MRes is a complete credential in itself — it does not require continuation to a PhD to be awarded.<\/p>\n    <\/div>\n\n    <div class=\"india-note\">\n      <div class=\"india-note-label\">India context<\/div>\n      <p>The MRes does not exist in Indian institutions. It is a UK-specific credential. For Ashoka students, it is most relevant if you are specifically interested in UK PhD programmes that use the CDT structure, or if you want a one-year research experience before deciding whether to commit to a full PhD.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(6)\">← Back<\/button>\n    <span class=\"page-label\">07 / 09<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(8)\">Next: PhD →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- ===================== PAGE 8: PHD ===================== -->\n<div class=\"page\" id=\"page-8\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Deep Dive 08<\/div>\n    <h1>PhD —<br><em>Doctor of Philosophy<\/em><\/h1>\n    <p class=\"hero-lead\">A research doctorate. The terminal academic degree in CS. You are expected to produce original knowledge — work that advances the field in a demonstrable way — and defend that contribution publicly.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">Duration<\/div><div class=\"data-val\">4–6 years in the US. 3–4 years in the UK and Europe (where students typically arrive with a master's already completed). The actual duration is difficult to predict at enrolment — it depends on the research problem, advisor, and individual progress.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Funding<\/div><div class=\"data-val\">Fully funded at accredited US programmes — stipend of $28,000–$45,000/year depending on institution and location, plus full tuition waiver. UK and European PhD studentships are also typically funded. A PhD should never require you to pay tuition. If a programme asks you to pay, it is not a standard research doctorate.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Thesis<\/div><div class=\"data-val\">Yes — a dissertation of 150–300 pages (in CS, often shorter than other fields) presenting several years of original research. Must make a novel and significant contribution to the field. Examined in an oral defence (US: dissertation defence; UK: viva voce).<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Advisor role<\/div><div class=\"data-val\">Central. Your advisor (principal investigator, or PI) sets your research direction in collaboration with you, provides funding through grants, supervises your work, co-authors papers, writes your most important recommendation letters, and is often the primary factor in where you get your first job after graduating. The advisor relationship is the most important variable in a PhD.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Publications<\/div><div class=\"data-val\">In CS, papers published at top conferences (NeurIPS, ICML, ICLR for ML; SOSP, OSDI for systems; SIGGRAPH for graphics; CCS for security; etc.) are the primary currency of a PhD. The number and venue of publications significantly influence job prospects in both academia and industry research.<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Programme structure<\/h2>\n      <div class=\"timeline\">\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Year 1<\/div>\n          <h4>Coursework and lab rotations<\/h4>\n          <p>Most US PhD programmes require 4–8 graduate courses in the first year. Some programmes (CMU, Stanford, MIT) also have a rotation system — you spend 6–8 weeks in different research labs before committing to an advisor. Others expect you to have identified an advisor before arrival.<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Year 2<\/div>\n          <h4>Qualifying examination<\/h4>\n          <p>Most US PhD programmes require a qualifying exam at the end of year 1 or during year 2. The format varies — written exam, oral exam, or research proposal presentation. Passing the qual is required to continue in the programme. Students who fail may receive a terminal master's degree.<\/p>\n        <\/div>\n        <div class=\"timeline-item highlight\">\n          <div class=\"timeline-year\">Years 2–4<\/div>\n          <h4>Research and publication<\/h4>\n          <p>The core of the PhD. Identifying research problems, running experiments, writing papers, submitting to conferences, revising and resubmitting. This period is open-ended and self-directed, with weekly advisor meetings providing structure. Most publications happen in this phase.<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Year 3–5<\/div>\n          <h4>Dissertation proposal<\/h4>\n          <p>A formal document and presentation outlining your planned dissertation — what you have done so far and what you will complete. Once approved by your committee, you are officially a PhD candidate. This process is sometimes called \"advancing to candidacy.\"<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Year 4–6<\/div>\n          <h4>Dissertation and defence<\/h4>\n          <p>Writing the dissertation, incorporating advisor and committee feedback, and conducting the final oral defence. In CS, the dissertation typically consolidates 3–5 published or submitted papers into a coherent document with a connecting narrative.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>The advisor relationship<\/h2>\n      <p>The advisor is the most consequential factor in a PhD experience. Your advisor controls your funding (through grants), sets research direction, reviews your papers, writes the recommendation letters that open doors to post-PhD positions, and in many cases is directly responsible for connecting you to your first job through their network.<\/p>\n      <p>Before committing to a PhD programme, most applicants reach out to potential advisors directly — emailing to discuss research interests, attending their talks, and requesting informal conversations with their current students. Advisor selection is something to do before accepting an offer, not after arriving.<\/p>\n\n      <div class=\"card-grid\">\n        <div class=\"card\">\n          <div class=\"card-label\">Ask the advisor<\/div>\n          <h4>Funding horizon<\/h4>\n          <p>How long does their current grant funding last? Are they writing new grants? A funding gap in year 3 of a PhD is a serious problem.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Ask their students<\/div>\n          <h4>Graduation timelines<\/h4>\n          <p>How long did recent students take to finish? Are there students who left the programme or changed advisors? What do students do after graduating — and did the advisor help place them?<\/p>\n        <\/div>\n        <div class=\"card accent-card\">\n          <div class=\"card-label\">Check independently<\/div>\n          <h4>Publication record<\/h4>\n          <p>Look at the advisor's lab page. Are their students publishing at strong venues regularly? A strong advisor has a consistent output of student-led publications at relevant conferences.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>What you produce<\/h2>\n      <p>A dissertation — typically 3–5 papers worth of original research compiled into a coherent document. In CS, the papers themselves (published or accepted at top conferences) are the primary output during the PhD. The dissertation is a synthesis of this work. By the end, you are expected to be one of the world's experts on a specific, narrow problem.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Typical career destinations<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Research careers<\/div>\n          <h4>Academic faculty<\/h4>\n          <p>Assistant professor positions at universities. The academic job market in CS is competitive — tenure-track positions at research universities require a strong publication record at top venues and strong faculty recommendation letters.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Research careers<\/div>\n          <h4>Industry research labs<\/h4>\n          <p>Research scientist roles at Google DeepMind, Meta AI, Microsoft Research, OpenAI, Anthropic, and similar organisations. These positions are highly competitive and typically require a strong PhD publication record.<\/p>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\">Industry roles<\/div>\n          <h4>Senior engineering and applied ML<\/h4>\n          <p>Many PhD graduates enter industry in senior engineering, staff research engineering, or applied science roles. The PhD is not required for these positions, but the research training and seniority signal are valued at some companies.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"exit-block\">\n      <div class=\"exit-label\">Exit options<\/div>\n      <p>Most US PhD programmes have a formal \"master's out\" option. After completing coursework requirements and the qualifying examination (typically at the end of year 2), a student who leaves the programme can receive a master's degree. This is a legitimate and common exit — it is not treated as a failure by most employers. The MS awarded this way is equivalent to a standalone research MS for most purposes. UK and European programmes handle this differently — check the specific programme's policy. In India, IISc and some IIT programmes have similar provisions, but they vary by department.<\/p>\n    <\/div>\n\n    <div class=\"india-note\">\n      <div class=\"india-note-label\">India context<\/div>\n      <p>IISc and IITs offer PhD programmes that are stipend-funded (₹31,000–₹35,000/month at IISc for junior research fellows). Admission is through interviews and in some cases GATE scores or JEST/JGEEBILS. Indian PhD programmes are typically 4–6 years. The publication culture is improving but remains less competitive than top US programmes for placements at international research labs — though this is changing in ML and AI specifically.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(7)\">← Back<\/button>\n    <span class=\"page-label\">08 / 09<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(9)\">Next: Integrated MS-PhD →<\/button>\n  <\/div>\n<\/div>\n\n<\!-- ===================== PAGE 9: INTEGRATED MS-PHD ===================== -->\n<div class=\"page\" id=\"page-9\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Deep Dive 09<\/div>\n    <h1>Integrated<br><em>MS-PhD<\/em><\/h1>\n    <p class=\"hero-lead\">A single enrolment track that combines a master's degree and a PhD into one continuous programme. You apply to the PhD track, receive the MS along the way, and continue to the doctorate without a separate application.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">Duration<\/div><div class=\"data-val\">5–6 years total. The MS is typically awarded at the end of year 2 or upon completion of coursework and qualifying requirements. The PhD follows for 3–4 more years.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Funding<\/div><div class=\"data-val\">Fully funded throughout — stipend plus tuition waiver for the entire duration, exactly as with a standalone PhD. The MS component does not require separate or additional funding.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Thesis<\/div><div class=\"data-val\">Yes — both an MS thesis (or equivalent milestone) and a PhD dissertation. Some programmes award the MS based on coursework and qualifying exam completion without a separate thesis; others require a thesis or research report at the MS stage.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Advisor role<\/div><div class=\"data-val\">Central, identical to a standalone PhD. The advisor relationship is the same in structure and importance.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">Where offered<\/div><div class=\"data-val\">CMU (most departments), MIT (some programmes), Georgia Tech, UMass Amherst, and several others. In India: TIFR, IISc (some departments), IISER. Not all CS departments offer an integrated track — it is programme-specific.<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>How it differs from a standalone PhD<\/h2>\n      <p>In a standalone PhD, you apply as a PhD student from day one. In an integrated MS-PhD, the structure is the same but the MS degree is a formal milestone along the way — you receive it automatically after completing the coursework and qualifying requirements, without needing to apply or pay separately for it.<\/p>\n      <p>The key practical difference is at the application stage: you are committing to the PhD track when you apply. There is no \"try the MS first and see if I want to continue\" step. Some students prefer this clarity; others prefer the optionality of a standalone research MS that can pivot to a PhD application later.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Programme structure<\/h2>\n      <div class=\"timeline\">\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Years 1–2<\/div>\n          <h4>Coursework and qualifying requirements<\/h4>\n          <p>Graduate courses, lab rotations (in some programmes), and qualifying examinations. Upon completing these requirements, the MS degree is awarded. The programme continues without interruption.<\/p>\n        <\/div>\n        <div class=\"timeline-item highlight\">\n          <div class=\"timeline-year\">Years 2–5+<\/div>\n          <h4>PhD research<\/h4>\n          <p>Full-time research, publication, dissertation proposal, and dissertation. Identical in structure to the research phase of a standalone PhD.<\/p>\n        <\/div>\n        <div class=\"timeline-item\">\n          <div class=\"timeline-year\">Year 5–6<\/div>\n          <h4>Dissertation and defence<\/h4>\n          <p>Same as a standalone PhD — writing, submission, and oral defence before the dissertation committee.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Why choose this over a standalone PhD<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Advantage<\/div>\n          <h4>MS credential at no extra cost<\/h4>\n          <p>You receive a fully funded MS degree as part of a funded PhD programme. If you master out, you leave with an MS at no tuition cost — the same exit option as a standalone PhD, but the MS was always built in.<\/p>\n        <\/div>\n        <div class=\"card teal-card\">\n          <div class=\"card-label\">Advantage<\/div>\n          <h4>No reapplication required<\/h4>\n          <p>You don't need to apply separately to a PhD after completing an MS. This removes a year of uncertainty and a second application cycle.<\/p>\n        <\/div>\n        <div class=\"card amber-card\">\n          <div class=\"card-label\">Consideration<\/div>\n          <h4>Early commitment<\/h4>\n          <p>You are committing to a PhD track at the point of application — without the trial run that a standalone research MS provides. Students who are uncertain about research should factor this in.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>What you produce<\/h2>\n      <p>The same outputs as a standalone PhD — publications at research conferences, a dissertation, and a defence. The MS along the way is a formal credential but not an additional research output on its own. Some programmes require a research report at the MS milestone; others do not.<\/p>\n    <\/div>\n\n    <div class=\"section-block\">\n      <h2>Typical career destinations<\/h2>\n      <p>Identical to a standalone PhD. Academic faculty positions, research scientist roles at labs, and senior engineering or applied science roles in industry. Employers treat an integrated MS-PhD the same as a standalone PhD for hiring purposes.<\/p>\n    <\/div>\n\n    <div class=\"exit-block\">\n      <div class=\"exit-label\">Exit options<\/div>\n      <p>The same master's out option exists as in a standalone PhD. After completing coursework and qualifying requirements, a student who chooses to leave the programme receives the MS degree. Because the integrated programme was designed with the MS as a milestone, this exit is structurally clean — there is no ambiguity about whether you qualify for the MS upon leaving. The MS awarded this way is equivalent to a standalone research MS or the master's awarded upon exit from a PhD programme.<\/p>\n    <\/div>\n\n    <div class=\"india-note\">\n      <div class=\"india-note-label\">India context<\/div>\n      <p>TIFR (Tata Institute of Fundamental Research) offers an integrated PhD programme in CS and related fields that follows a similar structure — coursework in the first year, research thereafter, with the MS awarded along the way. IISc offers integrated PhD programmes in some departments. Admission to these programmes is through national-level examinations (JEST, JGEEBILS) or direct interviews for top candidates.<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\">\n    <button class=\"btn\" onclick=\"goTo(8)\">← Back<\/button>\n    <span class=\"page-label\">09 / 09<\/span>\n    <button class=\"btn primary\" onclick=\"goTo(0)\">← Back to comparison<\/button>\n  <\/div>\n  <div class=\"disclaimer\">This resource is maintained by the Ashoka University Post Graduate Office. Content does not constitute professional advice.<\/div>\n<\/div>\n\n<script>\nconst TOTAL_PAGES = 10;\nlet currentPage = 0;\n\nfunction buildNav() {\n const container = document.getElementById('navDots');\n container.innerHTML = '<span onclick=\"goTo(Math.max(0, 0))\" style=\"font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:0.06em;cursor:pointer;margin-right:10px;\"> HOME <\/span>';\n const labels = ['Map','AI/ML','Systems','Theory','Human-Centred','Interdisciplinary','Robotics','T1: AI vs Systems','T2: Theory vs ML','T3: Broad vs Niche','T4: Degree vs MSCS'];\n for (let i = 0; i < TOTAL_PAGES; i++) {\n   const dot = document.createElement('div');\n   dot.className = 'nav-dot' + (i === currentPage ? ' active' : (i < currentPage ? ' visited' : ''));\n   dot.onclick = () => goTo(i);\n   dot.title = labels[i];\n   container.appendChild(dot);\n }\n}\n\n\nfunction goTo(n) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.getElementById('page-' + n).classList.add('active');\n  currentPage = n;\n  buildNav();\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n\nbuildNav();\n<\/script>\n<style>\n.pg-home{display:none;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:none;border:1px solid var(--rule);padding:.4rem .75rem;cursor:pointer;white-space:nowrap}\n.pg-home:hover{color:var(--accent);border-color:var(--accent)}\n.pg-home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\nbody.on-sub .pg-home{display:inline-flex}\nbody.on-sub nav .nav-brand{display:none}\n<\/style>\n<script>(function(){\nvar nav=document.querySelector('nav');if(!nav||typeof goTo!=='function')return;\nvar b=document.createElement('button');b.type='button';b.className='pg-home';b.textContent='\\u2190 Contents';\nb.title='Back to the start of this section';b.onclick=function(){goTo(0)};nav.insertBefore(b,nav.firstChild);\nfunction sync(){var a=document.querySelector('.page.active');var sub=!!a&&a.id!=='page-0';\n if(document.body.classList.contains('on-sub')!==sub)document.body.classList.toggle('on-sub',sub);}\nnew MutationObserver(sync).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']});sync();\nwindow.addEventListener('message',function(e){if(e.data==='pg-home')goTo(0)});\n})();<\/script>\n<\/body>\n<\/html>"}, {"id": "field", "title": "What field should I choose?", "short": "Which field?", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>What Field Should I Choose? — Ashoka CS<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --ink: #1a1a1a;\n    --ink-2: #444;\n    --ink-3: #888;\n    --paper: #faf8f3;\n    --paper-2: #f2efe8;\n    --paper-3: #e8e4da;\n    --accent: #c0392b;\n    --accent-2: #e67e22;\n    --teal: #1a7a6e;\n    --teal-light: #e8f5f3;\n    --purple: #5b4fcf;\n    --purple-light: #f0eeff;\n    --rule: #ddd9d0;\n    --serif: 'DM Serif Display', Georgia, serif;\n    --sans: 'DM Sans', sans-serif;\n    --mono: 'DM Mono', monospace;\n  }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; font-size: 16px; line-height: 1.7; }\n\n  nav { position: fixed; top: 0; left: 0; right: 0; background: var(--paper); border-bottom: 1px solid var(--rule); z-index: 100; padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; }\n  .nav-brand { font-family: var(--mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }\n  .nav-brand span { color: var(--accent); }\n  .nav-progress { display: flex; gap: 6px; align-items: center; }\n  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--paper-3); cursor: pointer; transition: background 0.2s, transform 0.2s; }\n  .nav-dot.active { background: var(--accent); transform: scale(1.4); }\n  .nav-dot.visited { background: var(--ink-3); }\n\n  .page { display: none; min-height: 100vh; padding-top: 56px; animation: fadeIn 0.35s ease; }\n  .page.active { display: block; }\n  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }\n\n  .hero { padding: 5rem 2rem 4rem; max-width: 900px; margin: 0 auto; border-bottom: 1px solid var(--rule); }\n  .hero-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; }\n  .hero h1 { font-family: var(--serif); font-size: clamp(2.2rem, 4.5vw, 3.6rem); line-height: 1.15; color: var(--ink); margin-bottom: 1.4rem; font-weight: 400; }\n  .hero h1 em { font-style: italic; color: var(--accent); }\n  .hero-lead { font-size: 1.05rem; color: var(--ink-2); max-width: 580px; line-height: 1.75; }\n\n  .content { max-width: 900px; margin: 0 auto; padding: 3rem 2rem 6rem; }\n  .section-block { margin-bottom: 3.5rem; }\n  .section-block h2 { font-family: var(--serif); font-size: 1.75rem; font-weight: 400; margin-bottom: 1rem; color: var(--ink); }\n  .section-block h3 { font-family: var(--sans); font-size: 0.875rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); margin-bottom: 0.75rem; margin-top: 2rem; }\n  .section-block p { color: var(--ink-2); margin-bottom: 1rem; }\n  .section-block p:last-child { margin-bottom: 0; }\n\n  .pull-quote { border-left: 3px solid var(--accent); padding: 1rem 1.5rem; margin: 2rem 0; background: var(--paper-2); }\n  .pull-quote p { font-family: var(--serif); font-size: 1.2rem; color: var(--ink); font-style: italic; margin: 0; }\n\n  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin: 1.5rem 0; }\n  .card { background: var(--paper-2); border: 1px solid var(--rule); padding: 1.25rem 1.25rem 1.5rem; }\n  .card-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.5rem; }\n  .card h4 { font-family: var(--serif); font-size: 1.1rem; font-weight: 400; margin-bottom: 0.5rem; color: var(--ink); }\n  .card p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.6; }\n  .card.teal-card { background: var(--teal-light); border-color: #b3d8d4; }\n  .card.accent-card { background: #fdf0ee; border-color: #e8bfba; }\n  .card.purple-card { background: var(--purple-light); border-color: #c5bef5; }\n  .card.amber-card { background: #fef9ee; border-color: #f0d9a0; }\n\n  .data-rows { border: 1px solid var(--rule); margin: 1.5rem 0; }\n  .data-row { display: grid; grid-template-columns: 170px 1fr; border-bottom: 1px solid var(--rule); }\n  .data-row:last-child { border-bottom: none; }\n  .data-key { padding: 0.85rem 1rem; background: var(--paper-2); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; display: flex; align-items: flex-start; padding-top: 1rem; }\n  .data-val { padding: 0.85rem 1.25rem; font-size: 0.9rem; color: var(--ink-2); line-height: 1.65; }\n  .data-val strong { color: var(--ink); font-weight: 500; }\n  @media (max-width: 560px) { .data-row { grid-template-columns: 1fr; } .data-key { border-bottom: 1px solid var(--rule); padding-bottom: 0.5rem; } }\n\n  .subfield-block { border: 1px solid var(--rule); padding: 1.5rem; margin-bottom: 1rem; background: var(--paper); position: relative; overflow: hidden; }\n  .subfield-block::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }\n  .subfield-block.broad::before { background: var(--teal); }\n  .subfield-block.specialised::before { background: var(--purple); }\n  .subfield-block.nodegree::before { background: var(--ink-3); }\n  .subfield-tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }\n  .subfield-block.broad .subfield-tag { color: var(--teal); }\n  .subfield-block.specialised .subfield-tag { color: var(--purple); }\n  .subfield-block.nodegree .subfield-tag { color: var(--ink-3); }\n  .subfield-block h4 { font-weight: 500; font-size: 1rem; color: var(--ink); margin-bottom: 0.4rem; }\n  .subfield-block p { font-size: 0.875rem; color: var(--ink-2); margin-bottom: 0.5rem; line-height: 1.6; }\n  .subfield-block p:last-child { margin-bottom: 0; }\n  .example-problem { font-size: 0.82rem; color: var(--ink-3); font-style: italic; border-top: 1px solid var(--rule); margin-top: 0.75rem; padding-top: 0.75rem; line-height: 1.55; }\n  .example-problem::before { content: 'Example problem — '; font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 0.3rem; }\n\n  .legend { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 1.5rem 0 2rem; padding: 1rem 1.25rem; background: var(--paper-2); border: 1px solid var(--rule); }\n  .legend-item { display: flex; align-items: center; gap: 0.5rem; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-2); }\n  .legend-swatch { width: 12px; height: 12px; flex-shrink: 0; }\n  .legend-swatch.broad { background: var(--teal); }\n  .legend-swatch.specialised { background: var(--purple); }\n  .legend-swatch.nodegree { background: var(--ink-3); }\n\n  /* ── INTERACTIVE FIELD MAP ── */\n  .fm-wrap { margin: 2rem 0; font-family: var(--sans); }\n  .fm-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; padding: 9px 14px; background: var(--paper-2); border: 1px solid var(--rule); }\n  .fm-leg { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }\n  .fm-ls { width: 11px; height: 11px; flex-shrink: 0; }\n  .fm-rl { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; margin: 14px 0 7px; }\n  .fm-tier { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }\n  .fm-chip { border-radius: 4px; padding: 9px 8px; cursor: pointer; border: 1px solid transparent; text-align: center; line-height: 1.35; transition: filter .15s, transform .12s; }\n  .fm-chip:hover { filter: brightness(.93); transform: translateY(-1px); }\n  .fm-chip:active { transform: scale(.97); }\n  .fm-cn { font-size: 12px; font-weight: 500; display: block; font-family: var(--sans); }\n  .fm-cs { font-size: 10px; display: block; margin-top: 2px; opacity: .72; font-family: var(--mono); letter-spacing: .03em; }\n  .fm-arr-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; height: 20px; }\n  .fm-arr-cell { display: flex; justify-content: center; }\n\n  .fm-broad { background: #e8f5f3; border-color: #1a7a6e; color: #085041; }\n  .fm-spec { background: #f0eeff; border-color: #5b4fcf; color: #3c348a; }\n  .fm-nodeg { background: var(--paper-2); border-color: var(--rule); color: var(--ink-3); border-style: dashed; }\n  .fm-notice { background: #fef9ee; border: 1px dashed #e67e22; color: #7a4a00; font-size: 10px; font-family: var(--mono); padding: 7px 8px; border-radius: 4px; text-align: center; cursor: default; line-height: 1.4; }\n  .fm-notice:hover { filter: none; transform: none; }\n\n  .fm-c-aiml  { background: #fdf0ee; border-color: #c0392b; color: #7a1f14; }\n  .fm-c-sys   { background: #e8f5f3; border-color: #1a7a6e; color: #085041; }\n  .fm-c-theory{ background: #f0eeff; border-color: #5b4fcf; color: #3c348a; }\n  .fm-c-hci   { background: #fef9ee; border-color: #e67e22; color: #7a4a00; }\n  .fm-c-inter { background: #eef5fc; border-color: #2980b9; color: #0c407a; }\n  .fm-c-rob   { background: #fdf0f6; border-color: #8e44ad; color: #5b1f72; }\n\n  .fm-scol { display: flex; flex-direction: column; gap: 5px; }\n  .fm-sm { font-size: 11px; padding: 7px 8px; }\n  .fm-divider { border: none; border-top: 1px dashed var(--rule); margin: 14px 0 4px; }\n\n  .fm-panel { margin-top: 16px; border: 1px solid var(--rule); padding: 1.25rem 1.5rem; background: var(--paper); display: none; }\n  .fm-panel.open { display: block; }\n  .fm-ptag { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; margin-bottom: 8px; font-weight: 500; }\n  .fm-t-cluster { background: #fdf0ee; color: #7a1f14; }\n  .fm-t-broad   { background: #e8f5f3; color: #085041; }\n  .fm-t-spec    { background: #f0eeff; color: #3c348a; }\n  .fm-t-sub     { background: var(--paper-2); color: var(--ink-3); border: 1px solid var(--rule); }\n  .fm-ptitle { font-family: var(--serif); font-size: 1.2rem; font-weight: 400; color: var(--ink); margin-bottom: 6px; }\n  .fm-pbody  { font-size: 0.875rem; color: var(--ink-2); line-height: 1.65; }\n  .fm-pclose { float: right; font-family: var(--mono); font-size: 10px; color: var(--ink-3); cursor: pointer; padding: 2px 7px; border: 1px solid var(--rule); margin-left: 8px; letter-spacing: .05em; }\n  .fm-pclose:hover { color: var(--ink); }\n  .fm-active { outline: 2px solid var(--ink); outline-offset: 1px; }\n\n  @media (max-width: 700px) {\n    .fm-tier { grid-template-columns: repeat(3, 1fr); }\n    .fm-arr-row { grid-template-columns: repeat(3, 1fr); }\n  }\n  @media (max-width: 440px) {\n    .fm-tier { grid-template-columns: repeat(2, 1fr); }\n    .fm-arr-row { grid-template-columns: repeat(2, 1fr); }\n  }\n\n  .cluster-nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0.75rem; margin: 2rem 0; }\n  .cluster-btn { display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.25rem; border: 1px solid var(--rule); background: var(--paper); cursor: pointer; transition: border-color 0.15s, background 0.15s; text-align: left; width: 100%; font-family: var(--sans); }\n  .cluster-btn:hover { border-color: var(--ink-3); background: var(--paper-2); }\n  .cluster-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }\n  .cluster-btn-text { flex: 1; }\n  .cluster-btn-name { font-weight: 500; font-size: 0.95rem; color: var(--ink); display: block; }\n  .cluster-btn-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.05em; display: block; margin-top: 0.2rem; }\n  .cluster-btn-arrow { color: var(--ink-3); font-size: 0.9rem; }\n\n  .versus-header { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: center; margin: 2rem 0; }\n  .versus-side { padding: 1.5rem; border: 1px solid var(--rule); }\n  .versus-side h3 { font-family: var(--serif); font-size: 1.3rem; font-weight: 400; margin-bottom: 0.5rem; }\n  .versus-side p { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.6; }\n  .versus-side.left { border-left: 3px solid var(--teal); }\n  .versus-side.right { border-left: 3px solid var(--purple); }\n  .versus-divider { font-family: var(--serif); font-size: 1.8rem; color: var(--ink-3); text-align: center; font-style: italic; }\n  @media (max-width: 600px) { .versus-header { grid-template-columns: 1fr; } .versus-divider { display: none; } }\n\n  .compare-row-grid { display: grid; grid-template-columns: 140px 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 1.5rem 0; }\n  .compare-row-grid .crg-head { background: var(--ink); padding: 0.75rem 1rem; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--paper); font-weight: 400; }\n  .compare-row-grid .crg-cell { background: var(--paper); padding: 0.85rem 1rem; font-size: 0.875rem; color: var(--ink-2); line-height: 1.6; vertical-align: top; }\n  .compare-row-grid .crg-cell.label { background: var(--paper-2); font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.05em; text-transform: uppercase; display: flex; align-items: center; }\n  @media (max-width: 560px) { .compare-row-grid { grid-template-columns: 1fr; } .compare-row-grid .crg-head:first-child { display: none; } }\n\n  .page-nav { max-width: 900px; margin: 0 auto; padding: 2rem 2rem 4rem; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; }\n  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 0.7rem 1.4rem; font-family: var(--sans); font-size: 0.875rem; font-weight: 500; cursor: pointer; border: 1px solid var(--ink); background: transparent; color: var(--ink); transition: background 0.15s, color 0.15s; letter-spacing: 0.01em; }\n  .btn:hover { background: var(--ink); color: var(--paper); }\n  .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }\n  .btn.primary:hover { background: #a93226; border-color: #a93226; }\n  .btn:disabled { opacity: 0.28; cursor: default; pointer-events: none; }\n  .page-label { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em; text-align: center; }\n\n  .toc { margin: 2rem 0; }\n  .toc-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--rule); cursor: pointer; transition: color 0.15s; }\n  .toc-item:hover { color: var(--accent); }\n  .toc-item:hover .toc-arrow { opacity: 1; transform: translateX(4px); }\n  .toc-num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 2rem; }\n  .toc-title { font-family: var(--serif); font-size: 1.1rem; font-weight: 400; flex: 1; }\n  .toc-meta { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.05em; display: none; }\n  @media (min-width: 500px) { .toc-meta { display: block; } }\n  .toc-arrow { font-size: 1rem; color: var(--accent); opacity: 0; transition: opacity 0.15s, transform 0.15s; }\n\n  .disclaimer { background: var(--paper-2); border-top: 1px solid var(--rule); padding: 1rem 2rem; font-size: 0.8rem; color: var(--ink-3); text-align: center; line-height: 1.6; }\n\n  .c-aiml { background: #c0392b; }\n  .c-systems { background: #1a7a6e; }\n  .c-theory { background: #5b4fcf; }\n  .c-human { background: #e67e22; }\n  .c-interdisciplinary { background: #2980b9; }\n  .c-robotics { background: #6c3483; }\n<\/style>\n<\/head>\n<body>\n\n<nav>\n  <div class=\"nav-brand\">Ashoka University · <span>CS Higher Ed<\/span><\/div>\n  <div style=\"display:flex;align-items:center;gap:14px;\">\n    <span onclick=\"goTo(0)\" style=\"font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;transition:color 0.15s;\" onmouseover=\"this.style.color='var(--accent)'\" onmouseout=\"this.style.color='var(--ink-3)'\">Home<\/span>\n    <div class=\"nav-progress\" id=\"navDots\"><\/div>\n  <\/div>\n<\/nav>\n\n<\!-- ===================== PAGE 0: FIELD MAP ===================== -->\n<div class=\"page active\" id=\"page-0\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Section 03 — Fields · Post Graduate Office<\/div>\n    <h1>What field should<br>I <em>choose?<\/em><\/h1>\n    <p class=\"hero-lead\">A map of every major research area in CS, the degree structures that cover them, and what each field actually involves. Click any node to learn more.<\/p>\n  <\/div>\n\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <h2>How to read this map<\/h2>\n      <p>Each cluster below is a major research area. Within each cluster, sub-fields and degrees are marked by type. Click any chip to see a description. The distinction matters: some fields have standalone named degrees; others are pursued through course selection within a broader programme.<\/p>\n    <\/div>\n\n    <\!-- INTERACTIVE FIELD MAP -->\n    <div class=\"section-block\">\n      <div class=\"fm-wrap\">\n\n        <div class=\"fm-legend\">\n          <div class=\"fm-leg\"><div class=\"fm-ls\" style=\"background:#e8f5f3;border:1px solid #1a7a6e\"><\/div>Broad degree<\/div>\n          <div class=\"fm-leg\"><div class=\"fm-ls\" style=\"background:#f0eeff;border:1px solid #5b4fcf\"><\/div>Specialised degree<\/div>\n          <div class=\"fm-leg\"><div class=\"fm-ls\" style=\"background:#f2efe8;border:1px dashed #888\"><\/div>No dedicated degree<\/div>\n        <\/div>\n\n        <div class=\"fm-rl\">Clusters — click any node for details<\/div>\n        <div class=\"fm-tier\">\n          <div class=\"fm-chip fm-c-aiml\"   id=\"fc-aiml\">  <span class=\"fm-cn\">AI / ML<\/span>        <span class=\"fm-cs\">ML · DL · NLP · CV · RL<\/span><\/div>\n          <div class=\"fm-chip fm-c-sys\"    id=\"fc-sys\">   <span class=\"fm-cn\">Systems<\/span>         <span class=\"fm-cs\">OS · Distributed · Security<\/span><\/div>\n          <div class=\"fm-chip fm-c-theory\" id=\"fc-theory\"><span class=\"fm-cn\">Theory<\/span>          <span class=\"fm-cs\">Algorithms · Crypto · QC<\/span><\/div>\n          <div class=\"fm-chip fm-c-hci\"    id=\"fc-hci\">   <span class=\"fm-cn\">Human-Centred<\/span>   <span class=\"fm-cs\">HCI · Social Science<\/span><\/div>\n          <div class=\"fm-chip fm-c-inter\"  id=\"fc-inter\"> <span class=\"fm-cn\">Interdisciplinary<\/span><span class=\"fm-cs\">Bio · Sci. Computing<\/span><\/div>\n          <div class=\"fm-chip fm-c-rob\"    id=\"fc-rob\">   <span class=\"fm-cn\">Robotics<\/span>         <span class=\"fm-cs\">Perception · Planning<\/span><\/div>\n        <\/div>\n\n        <div class=\"fm-arr-row\" style=\"margin-top:2px\">\n          <div class=\"fm-arr-cell\"><svg width=\"2\" height=\"20\" overflow=\"visible\"><line x1=\"1\" y1=\"0\" x2=\"1\" y2=\"13\" stroke=\"#888\" stroke-width=\"0.5\"/><polygon points=\"1,20 -2,13 4,13\" fill=\"#888\"/><\/svg><\/div>\n          <div class=\"fm-arr-cell\"><svg width=\"2\" height=\"20\" overflow=\"visible\"><line x1=\"1\" y1=\"0\" x2=\"1\" y2=\"13\" stroke=\"#888\" stroke-width=\"0.5\"/><polygon points=\"1,20 -2,13 4,13\" fill=\"#888\"/><\/svg><\/div>\n          <div class=\"fm-arr-cell\"><svg width=\"2\" height=\"20\" overflow=\"visible\"><line x1=\"1\" y1=\"0\" x2=\"1\" y2=\"13\" stroke=\"#888\" stroke-width=\"0.5\"/><polygon points=\"1,20 -2,13 4,13\" fill=\"#888\"/><\/svg><\/div>\n          <div class=\"fm-arr-cell\"><svg width=\"2\" height=\"20\" overflow=\"visible\"><line x1=\"1\" y1=\"0\" x2=\"1\" y2=\"13\" stroke=\"#888\" stroke-width=\"0.5\"/><polygon points=\"1,20 -2,13 4,13\" fill=\"#888\"/><\/svg><\/div>\n          <div class=\"fm-arr-cell\"><svg width=\"2\" height=\"20\" overflow=\"visible\"><line x1=\"1\" y1=\"0\" x2=\"1\" y2=\"13\" stroke=\"#888\" stroke-width=\"0.5\"/><polygon points=\"1,20 -2,13 4,13\" fill=\"#888\"/><\/svg><\/div>\n          <div class=\"fm-arr-cell\"><svg width=\"2\" height=\"20\" overflow=\"visible\"><line x1=\"1\" y1=\"0\" x2=\"1\" y2=\"13\" stroke=\"#888\" stroke-width=\"0.5\"/><polygon points=\"1,20 -2,13 4,13\" fill=\"#888\"/><\/svg><\/div>\n        <\/div>\n\n        <div class=\"fm-rl\">Broad degrees<\/div>\n        <div class=\"fm-tier\">\n          <div class=\"fm-chip fm-broad\" id=\"fd-mscs-ai\">    <span class=\"fm-cn\">MSCS (AI track)<\/span>   <span class=\"fm-cs\">Broad<\/span><\/div>\n          <div class=\"fm-chip fm-broad\" id=\"fd-mscs-sys\">   <span class=\"fm-cn\">MSCS (Systems)<\/span>    <span class=\"fm-cs\">Broad<\/span><\/div>\n          <div class=\"fm-chip fm-broad\" id=\"fd-mscs-theory\"><span class=\"fm-cn\">MSCS (Theory)<\/span>     <span class=\"fm-cs\">Only option<\/span><\/div>\n          <div class=\"fm-chip fm-broad\" id=\"fd-mscs-hci\">   <span class=\"fm-cn\">MSCS (HCI)<\/span>        <span class=\"fm-cs\">Broad<\/span><\/div>\n          <div class=\"fm-chip fm-broad\" id=\"fd-mscs-inter\"> <span class=\"fm-cn\">MSCS + electives<\/span>  <span class=\"fm-cs\">Broad<\/span><\/div>\n          <div class=\"fm-chip fm-spec\"  id=\"fd-msr\">        <span class=\"fm-cn\">MSR / MSROBOTICS<\/span>  <span class=\"fm-cs\">Broad = Specialised<\/span><\/div>\n        <\/div>\n\n        <div class=\"fm-arr-row\" style=\"margin-top:2px\">\n          <div class=\"fm-arr-cell\"><svg width=\"2\" height=\"20\" overflow=\"visible\"><line x1=\"1\" y1=\"0\" x2=\"1\" y2=\"13\" stroke=\"#888\" stroke-width=\"0.5\"/><polygon points=\"1,20 -2,13 4,13\" fill=\"#888\"/><\/svg><\/div>\n          <div class=\"fm-arr-cell\"><svg width=\"2\" height=\"20\" overflow=\"visible\"><line x1=\"1\" y1=\"0\" x2=\"1\" y2=\"13\" stroke=\"#888\" stroke-width=\"0.5\"/><polygon points=\"1,20 -2,13 4,13\" fill=\"#888\"/><\/svg><\/div>\n          <div class=\"fm-arr-cell\"><\/div>\n          <div class=\"fm-arr-cell\"><svg width=\"2\" height=\"20\" overflow=\"visible\"><line x1=\"1\" y1=\"0\" x2=\"1\" y2=\"13\" stroke=\"#888\" stroke-width=\"0.5\"/><polygon points=\"1,20 -2,13 4,13\" fill=\"#888\"/><\/svg><\/div>\n          <div class=\"fm-arr-cell\"><svg width=\"2\" height=\"20\" overflow=\"visible\"><line x1=\"1\" y1=\"0\" x2=\"1\" y2=\"13\" stroke=\"#888\" stroke-width=\"0.5\"/><polygon points=\"1,20 -2,13 4,13\" fill=\"#888\"/><\/svg><\/div>\n          <div class=\"fm-arr-cell\"><\/div>\n        <\/div>\n\n        <div class=\"fm-rl\">Specialised degrees<\/div>\n        <div class=\"fm-tier\">\n          <div class=\"fm-scol\">\n            <div class=\"fm-chip fm-spec fm-sm\" id=\"fd-msai\">MSAI / MSML<\/div>\n            <div class=\"fm-chip fm-spec fm-sm\" id=\"fd-mscv\">MSCV<\/div>\n            <div class=\"fm-chip fm-spec fm-sm\" id=\"fd-msds-a\">MSDS<\/div>\n            <div class=\"fm-chip fm-spec fm-sm\" id=\"fd-msnlp\">MSNLP (rare)<\/div>\n          <\/div>\n          <div class=\"fm-scol\">\n            <div class=\"fm-chip fm-spec fm-sm\" id=\"fd-msis\">MSIS / MS-Security<\/div>\n            <div class=\"fm-chip fm-spec fm-sm\" id=\"fd-msde\">MSDE<\/div>\n          <\/div>\n          <div class=\"fm-scol\">\n            <div class=\"fm-notice\">No standalone Theory MS exists at any major institution<\/div>\n          <\/div>\n          <div class=\"fm-scol\">\n            <div class=\"fm-chip fm-spec fm-sm\" id=\"fd-mshci\">MSHCI<\/div>\n          <\/div>\n          <div class=\"fm-scol\">\n            <div class=\"fm-chip fm-spec fm-sm\" id=\"fd-mscb\">MSCB / MS Bioinformatics<\/div>\n            <div class=\"fm-chip fm-spec fm-sm\" id=\"fd-msds-i\">MSDS<\/div>\n          <\/div>\n          <div class=\"fm-scol\">\n            <div class=\"fm-notice\">Field is small — broad and specialised are the same degree<\/div>\n          <\/div>\n        <\/div>\n\n        <hr class=\"fm-divider\">\n        <div class=\"fm-rl\">Sub-fields — no dedicated degree (pursued within a broader programme)<\/div>\n        <div class=\"fm-tier\">\n          <div class=\"fm-scol\">\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-rl\">Reinforcement Learning<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-aisafety\">AI Safety &amp; Alignment<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-dl\">Deep Learning<\/div>\n          <\/div>\n          <div class=\"fm-scol\">\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-os\">OS &amp; Distributed Systems<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-arch\">Computer Architecture<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-pl\">PL &amp; Compilers<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-net\">Networking<\/div>\n          <\/div>\n          <div class=\"fm-scol\">\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-algos\">Algorithms &amp; Complexity<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-crypto\">Cryptography (theory)<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-fm\">Formal Methods<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-qc\">Quantum Computing<\/div>\n          <\/div>\n          <div class=\"fm-scol\">\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-css\">Computational Social Science<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-rai\">Responsible AI / Ethics<\/div>\n          <\/div>\n          <div class=\"fm-scol\">\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-scicomp\">Scientific Computing<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-ling\">Computational Linguistics<\/div>\n          <\/div>\n          <div class=\"fm-scol\">\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-percept\">Perception<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-planning\">Planning &amp; Control<\/div>\n            <div class=\"fm-chip fm-nodeg fm-sm\" id=\"fd-hri\">Human-Robot Interaction<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"fm-panel\" id=\"fm-panel\">\n          <span class=\"fm-pclose\" id=\"fm-pclose\">close ✕<\/span>\n          <span class=\"fm-ptag\" id=\"fm-ptag\"><\/span>\n          <div class=\"fm-ptitle\" id=\"fm-ptitle\"><\/div>\n          <div class=\"fm-pbody\"  id=\"fm-pbody\"><\/div>\n        <\/div>\n\n      <\/div>\n    <\/div>\n\n    <\!-- CLUSTER NAV -->\n    <div class=\"section-block\">\n      <h2>Explore each cluster<\/h2>\n      <div class=\"cluster-nav\">\n        <button class=\"cluster-btn\" onclick=\"goTo(1)\"><div class=\"cluster-dot c-aiml\"><\/div><div class=\"cluster-btn-text\"><span class=\"cluster-btn-name\">AI / Machine Learning<\/span><span class=\"cluster-btn-sub\">ML · DL · NLP · CV · RL · AI Safety<\/span><\/div><span class=\"cluster-btn-arrow\">→<\/span><\/button>\n        <button class=\"cluster-btn\" onclick=\"goTo(2)\"><div class=\"cluster-dot c-systems\"><\/div><div class=\"cluster-btn-text\"><span class=\"cluster-btn-name\">Systems<\/span><span class=\"cluster-btn-sub\">OS · Distributed · Architecture · Security · PL<\/span><\/div><span class=\"cluster-btn-arrow\">→<\/span><\/button>\n        <button class=\"cluster-btn\" onclick=\"goTo(3)\"><div class=\"cluster-dot c-theory\"><\/div><div class=\"cluster-btn-text\"><span class=\"cluster-btn-name\">Theory<\/span><span class=\"cluster-btn-sub\">Algorithms · Crypto · Formal Methods · Quantum<\/span><\/div><span class=\"cluster-btn-arrow\">→<\/span><\/button>\n        <button class=\"cluster-btn\" onclick=\"goTo(4)\"><div class=\"cluster-dot c-human\"><\/div><div class=\"cluster-btn-text\"><span class=\"cluster-btn-name\">Human-Centred Computing<\/span><span class=\"cluster-btn-sub\">HCI · Comp. Social Science · Responsible AI<\/span><\/div><span class=\"cluster-btn-arrow\">→<\/span><\/button>\n        <button class=\"cluster-btn\" onclick=\"goTo(5)\"><div class=\"cluster-dot c-interdisciplinary\"><\/div><div class=\"cluster-btn-text\"><span class=\"cluster-btn-name\">Interdisciplinary Sciences<\/span><span class=\"cluster-btn-sub\">Comp. Biology · Scientific Computing · Comp. Linguistics<\/span><\/div><span class=\"cluster-btn-arrow\">→<\/span><\/button>\n        <button class=\"cluster-btn\" onclick=\"goTo(6)\"><div class=\"cluster-dot c-robotics\"><\/div><div class=\"cluster-btn-text\"><span class=\"cluster-btn-name\">Robotics &amp; Embodied Systems<\/span><span class=\"cluster-btn-sub\">Perception · Planning · Control · HRI<\/span><\/div><span class=\"cluster-btn-arrow\">→<\/span><\/button>\n      <\/div>\n    <\/div>\n\n    <\!-- TRADEOFFS TOC -->\n    <div class=\"section-block\">\n      <h2>Tradeoff comparisons<\/h2>\n      <div class=\"toc\">\n        <div class=\"toc-item\" onclick=\"goTo(7)\"><span class=\"toc-num\">T1<\/span><span class=\"toc-title\">AI vs Systems<\/span><span class=\"toc-meta\">Skills · market · daily work<\/span><span class=\"toc-arrow\">→<\/span><\/div>\n        <div class=\"toc-item\" onclick=\"goTo(8)\"><span class=\"toc-num\">T2<\/span><span class=\"toc-title\">Theory vs Applied ML<\/span><span class=\"toc-meta\">Depth · career paths · market<\/span><span class=\"toc-arrow\">→<\/span><\/div>\n        <div class=\"toc-item\" onclick=\"goTo(9)\"><span class=\"toc-num\">T3<\/span><span class=\"toc-title\">Broad vs niche specialisation<\/span><span class=\"toc-meta\">Flexibility · signal · career stage<\/span><span class=\"toc-arrow\">→<\/span><\/div>\n        <div class=\"toc-item\" onclick=\"goTo(10)\"><span class=\"toc-num\">T4<\/span><span class=\"toc-title\">Specialised degree vs MSCS<\/span><span class=\"toc-meta\">Curriculum · employer view · when it matters<\/span><span class=\"toc-arrow\">→<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"disclaimer\">This resource is maintained by the Ashoka University Post Graduate Office. Field descriptions reflect general patterns across institutions.<\/div>\n<\/div>\n\n<\!-- ===================== PAGE 1: AI / ML ===================== -->\n<div class=\"page\" id=\"page-1\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Cluster 01 — AI / Machine Learning<\/div>\n    <h1>Artificial Intelligence<br>& <em>Machine Learning<\/em><\/h1>\n    <p class=\"hero-lead\">The study of systems that learn from data, make decisions, and generate content. Currently the largest and most active research area in CS.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\">\n      <p>AI/ML covers a wide range of sub-fields unified by the question of how to make computers learn from experience rather than following explicit instructions. Within the cluster, the approaches, mathematical tools, and career paths vary considerably.<\/p>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Broad degree vs specialised degree<\/h2>\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">MSCS (AI track)<\/div><div class=\"data-val\">Lets you take AI/ML courses alongside systems, theory, or HCI courses. If you want to work across ML and distributed systems, or ML and HCI, this flexibility matters. Most programmes allow 3–4 AI courses within an MSCS without formally declaring a track.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">MSAI / MSML<\/div><div class=\"data-val\">Curriculum is more prescribed — you take a defined set of AI/ML courses. Less room for electives outside the field. Signals clear focus to employers and research labs. At many schools the courses are identical — the degree name is the only difference.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">When to pick MSAI<\/div><div class=\"data-val\">You are certain you want to work in ML specifically, you are not interested in cross-disciplinary coursework, and you are applying to a programme where the MSAI curriculum is genuinely more focused than the MSCS AI track. Check both curricula before deciding.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">When to pick MSCS<\/div><div class=\"data-val\">You want flexibility to explore, you are interested in more than one area, or you are at a programme where the MSCS and MSAI curricula are largely the same.<\/div><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Sub-fields<\/h2>\n      <div class=\"subfield-block broad\"><div class=\"subfield-tag\">Core — all AI/ML degrees cover this<\/div><h4>Machine Learning<\/h4><p>The mathematical and statistical foundations of learning from data. Covers supervised learning, unsupervised learning, generalisation theory, optimisation, and probabilistic modelling. This is the substrate that everything else in the cluster builds on.<\/p><div class=\"example-problem\">How do you train a model that generalises well to data it has never seen, when you only have a small labelled training set?<\/div><\/div>\n      <div class=\"subfield-block specialised\"><div class=\"subfield-tag\">Specialised — MSCV available at CMU and some others<\/div><h4>Computer Vision<\/h4><p>Teaching computers to understand visual information — images, video, 3D scenes. Has driven most of the practical applications of deep learning in the last decade. Combines signal processing, geometry, and neural network methods.<\/p><div class=\"example-problem\">How do you build a system that can identify and segment every object in a video stream in real time on embedded hardware?<\/div><\/div>\n      <div class=\"subfield-block specialised\"><div class=\"subfield-tag\">Specialised — MSAI / MSML covers this; MSNLP rare<\/div><h4>Natural Language Processing<\/h4><p>Building systems that understand and generate human language. The field has been transformed by large language models. Combines linguistics intuition, statistical methods, and large-scale engineering. Currently one of the most active and well-funded sub-fields.<\/p><div class=\"example-problem\">How do you make a language model reliably follow complex multi-step instructions without hallucinating facts or violating constraints?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — pursued within MSAI or MSCS<\/div><h4>Reinforcement Learning<\/h4><p>Learning through interaction with an environment — the agent takes actions, receives rewards, and learns a policy. Underlies game-playing systems, robotics control, and increasingly, language model training (RLHF). Requires solid grounding in probability, optimisation, and dynamic programming.<\/p><div class=\"example-problem\">How do you train a robot arm to perform a new manipulation task from a handful of human demonstrations, without needing millions of trials?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — small, growing research community<\/div><h4>AI Safety and Alignment<\/h4><p>A research field focused on ensuring that AI systems behave as intended, especially as they become more capable. Technical methods include interpretability, robustness, and alignment techniques (RLHF, Constitutional AI, formal verification of neural networks). Distinct from AI ethics and AI policy.<\/p><div class=\"example-problem\">How do you determine what a large language model has encoded internally about a concept, and whether that representation is consistent with how it behaves?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — covered in all AI/ML programmes<\/div><h4>Deep Learning<\/h4><p>The study of neural network architectures — transformers, diffusion models, graph networks, and their training dynamics. Less a standalone sub-field and more a set of methods that pervades all of CV, NLP, and RL. Almost every AI/ML programme covers this.<\/p><div class=\"example-problem\">Why do large neural networks trained with gradient descent generalise well even when the number of parameters far exceeds the number of training examples?<\/div><\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Research vs industry demand<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card teal-card\"><div class=\"card-label\">Research<\/div><h4>Extremely active<\/h4><p>More papers published at NeurIPS, ICML, ICLR, CVPR, and ACL each year than in any other CS area. Competition for top PhD positions is very high.<\/p><\/div>\n        <div class=\"card teal-card\"><div class=\"card-label\">Industry<\/div><h4>Very high demand<\/h4><p>ML engineering, applied science, and research scientist roles are numerous and well-compensated. The market has been growing for a decade. Competition is also high.<\/p><\/div>\n        <div class=\"card accent-card\"><div class=\"card-label\">Note<\/div><h4>AI Safety specifically<\/h4><p>Research and industry positions in AI safety are currently concentrated at a small number of organisations — Anthropic, DeepMind, ARC Evals, Redwood Research, and a few others.<\/p><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Career paths<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card\"><div class=\"card-label\">Research<\/div><h4>Research Scientist<\/h4><p>At academic labs or industry research labs. Requires strong publication record. PhD typically required for frontier labs.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>ML Engineer<\/h4><p>Building, training, and deploying ML systems at product companies. One of the most common post-MS roles. MS or strong portfolio sufficient.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>Applied Scientist<\/h4><p>Research-adjacent role at companies like Amazon, Microsoft, Google. Combines ML research with product application. MS or PhD.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Research<\/div><h4>Faculty<\/h4><p>Assistant professor at a university. Requires PhD and strong publication record. Competitive market globally.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\"><button class=\"btn\" onclick=\"goTo(0)\">← Map<\/button><span class=\"page-label\">Cluster 01 / 06<\/span><button class=\"btn primary\" onclick=\"goTo(2)\">Next: Systems →<\/button><\/div>\n<\/div>\n\n<\!-- ===================== PAGE 2: SYSTEMS ===================== -->\n<div class=\"page\" id=\"page-2\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Cluster 02 — Systems<\/div>\n    <h1><em>Systems<\/em><\/h1>\n    <p class=\"hero-lead\">The design, implementation, and analysis of the infrastructure that all software runs on — operating systems, distributed systems, databases, networks, compilers, and hardware.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\"><p>Systems is the cluster most concerned with how things actually work at scale — how you make software reliable, efficient, and secure when it runs on thousands of machines, handles millions of requests, and must not fail.<\/p><\/div>\n    <div class=\"section-block\">\n      <h2>Broad degree vs specialised degree<\/h2>\n      <div class=\"data-rows\">\n        <div class=\"data-row\"><div class=\"data-key\">MSCS (Systems track)<\/div><div class=\"data-val\">The standard path. There is no broad \"MS in Systems\" at most institutions — you do MSCS and select systems courses. This is not a limitation; systems is embedded in the CS curriculum by design.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">MSIS / MSCS-Security<\/div><div class=\"data-val\">Security is the main sub-field with a dedicated degree. CMU's MSIT-Information Security, Georgia Tech's MSCS Security specialisation, and similar programmes exist for students who want to go deep in applied security, policy, and cryptography together.<\/div><\/div>\n        <div class=\"data-row\"><div class=\"data-key\">MSDE<\/div><div class=\"data-val\">A degree focused on building and operating large-scale data infrastructure — pipelines, warehouses, streaming systems. Available at a small number of schools. Sits at the boundary of systems and data science.<\/div><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Sub-fields<\/h2>\n      <div class=\"subfield-block broad\"><div class=\"subfield-tag\">Core — all systems tracks cover this<\/div><h4>Operating Systems & Distributed Systems<\/h4><p>How computers manage resources — memory, processes, storage, concurrency. Distributed systems extends this to networks of machines: coordination, consensus, fault tolerance, and consistency.<\/p><div class=\"example-problem\">How do you design a distributed database that remains consistent across data centres in three continents even when the network between them is unreliable?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — within MSCS systems track<\/div><h4>Computer Architecture<\/h4><p>The design of processors, memory hierarchies, and hardware-software interfaces. Increasingly important as ML workloads have driven demand for custom silicon (GPUs, TPUs, NPUs).<\/p><div class=\"example-problem\">How do you design a processor memory hierarchy that minimises latency for the specific access patterns of transformer inference?<\/div><\/div>\n      <div class=\"subfield-block specialised\"><div class=\"subfield-tag\">Specialised degree available — MSIS, MSCS-Security at several schools<\/div><h4>Security & Cryptography (applied)<\/h4><p>Protecting systems from attack — vulnerability analysis, secure system design, network security, and applied cryptography. Different from theoretical cryptography (which lives in the Theory cluster).<\/p><div class=\"example-problem\">How do you design an authentication system that remains secure even when an attacker can observe all network traffic and has compromised one authentication server?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — within MSCS systems track<\/div><h4>Programming Languages & Compilers<\/h4><p>The design of programming languages, type systems, and the tools that translate code into machine instructions. Bridges theory and systems. One of the more mathematically demanding areas within systems.<\/p><div class=\"example-problem\">How do you design a type system that can statically verify that a concurrent program is free from data races without requiring programmer annotations?<\/div><\/div>\n      <div class=\"subfield-block specialised\"><div class=\"subfield-tag\">Specialised degree — MSDE available at select schools<\/div><h4>Data Engineering<\/h4><p>Building and operating large-scale data infrastructure — ingestion pipelines, data warehouses, stream processing, and query optimisation. High industry demand.<\/p><div class=\"example-problem\">How do you build a real-time data pipeline that processes 10 million events per second with sub-second latency while guaranteeing exactly-once delivery?<\/div><\/div>\n    <\/div>\n    <div class=\"section-block\">\n      <h2>Career paths<\/h2>\n      <div class=\"card-grid\">\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>Systems / Infrastructure Engineer<\/h4><p>Building the infrastructure that products run on. High demand at every technology company.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>Security Engineer<\/h4><p>Penetration testing, vulnerability research, secure system design. Specialised degree or strong portfolio.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Industry<\/div><h4>Data Engineer<\/h4><p>Designing and operating data infrastructure. Very high demand.<\/p><\/div>\n        <div class=\"card\"><div class=\"card-label\">Research<\/div><h4>Systems Researcher<\/h4><p>Academic or industry research on OS, distributed systems, or architecture. PhD typically required.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"page-nav\"><button class=\"btn\" onclick=\"goTo(1)\">← AI/ML<\/button><span class=\"page-label\">Cluster 02 / 06<\/span><button class=\"btn primary\" onclick=\"goTo(3)\">Next: Theory →<\/button><\/div>\n<\/div>\n\n<\!-- ===================== PAGE 3: THEORY ===================== -->\n<div class=\"page\" id=\"page-3\">\n  <div class=\"hero\">\n    <div class=\"hero-kicker\">Cluster 03 — Theory<\/div>\n    <h1><em>Theory<\/em><\/h1>\n    <p class=\"hero-lead\">The mathematical foundations of computer science — what can be computed, how efficiently, and with what guarantees. The cluster with the highest mathematical floor and the narrowest industry job market.<\/p>\n  <\/div>\n  <div class=\"content\">\n    <div class=\"section-block\"><p>Theory asks questions about computation at an abstract level — not how to build a system, but what is provably possible or impossible, and at what cost. The tools are mathematics: proof techniques, combinatorics, probability, algebra, and logic.<\/p><\/div>\n    <div class=\"section-block\">\n      <h2>Sub-fields<\/h2>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — core of any theory track<\/div><h4>Algorithms & Complexity<\/h4><p>The design and analysis of efficient algorithms, and the study of computational complexity — which problems are tractable and which are not. Includes graph algorithms, approximation algorithms, randomised algorithms, and the P vs NP question.<\/p><div class=\"example-problem\">Is there an algorithm that finds an approximately optimal solution to the Travelling Salesman Problem in polynomial time, with a provable bound on how far from optimal it is?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — bridges theory and security<\/div><h4>Cryptography (theoretical)<\/h4><p>The mathematical study of secure communication — building protocols whose security can be formally proved under well-defined hardness assumptions. Foundational to blockchain, secure computation, and zero-knowledge proofs.<\/p><div class=\"example-problem\">How do you design a protocol that allows two parties to compute a function of their private inputs without either party learning anything about the other's input beyond the output?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — niche within theory<\/div><h4>Formal Methods & Verification<\/h4><p>Using mathematical logic to formally specify and verify software and hardware systems. Used in safety-critical systems: avionics, medical devices, cryptographic protocols.<\/p><div class=\"example-problem\">How do you automatically verify that a microkernel's memory isolation guarantees hold under all possible sequences of system calls?<\/div><\/div>\n      <div class=\"subfield-block nodegree\"><div class=\"subfield-tag\">No dedicated degree — emerging, interdisciplinary<\/div><h4>Quantum Computing<\/h4><p>Computing with quantum mechanical systems — qubits, superposition, and entanglement. Currently pre-commercial in most applications. Requires linear algebra and quantum mechanics alongside CS theory.<\/p><div class=\"example-problem\">Which optimisation problems admit a quantum speedup, and how large must a fault-tolerant quantum computer be before it outperforms classical approaches
